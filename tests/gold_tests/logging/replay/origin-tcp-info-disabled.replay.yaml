meta:
  version: "1.0"

autest:
  description: 'Verify all origin TCP_INFO fields are unavailable with the default configuration'
  server:
    name: server_disabled
  client:
    name: client_disabled
  ats:
    name: ts_disabled
    process_config:
      enable_cache: false
    # Leave log_server_tcp_info unset to check that sampling defaults to off.
    records_config:
      proxy.config.log.max_secs_per_buffer: 1
      proxy.config.log.periodic_tasks_interval: 1
    remap_config:
    - from: 'http://origin-tcp-info.test/'
      to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
    logging_yaml:
      logging:
        formats:
        - name: origin_tcp_info
          format: '%<{uuid}cqh> %<crc> %<srtt> %<srtv> %<sret> %<scwn>'
        logs:
        - filename: origin_tcp_info
          format: origin_tcp_info
          mode: ascii

sessions:
- transactions:
  - client-request:
      method: GET
      url: /disabled
      version: '1.1'
      headers:
        fields:
        - [Host, origin-tcp-info.test]
        - [uuid, miss]
    server-response:
      status: 200
      headers:
        fields:
        - [Content-Length, 16]
    proxy-response:
      status: 200
