meta:
  version: "1.0"

autest:
  description: 'Discard TCP_INFO from a 503 when the next parent connection fails'
  server:
    name: server_retry
  client:
    name: client_retry
  ats:
    name: ts_retry
    process_config:
      enable_cache: false
    records_config:
      proxy.config.http.log_server_tcp_info: 1
      proxy.config.http.no_dns_just_forward_to_parent: 1
      proxy.config.http.uncacheable_requests_bypass_parent: 0
      proxy.config.http.parent_proxy.total_connect_attempts: 1
      proxy.config.http.parent_proxy.per_parent_connect_attempts: 1
      proxy.config.http.parent_proxy.self_detect: 0
      proxy.config.log.max_secs_per_buffer: 1
      proxy.config.log.periodic_tasks_interval: 1
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|socket_tcp_info'
    # The test adds two parents: this server, followed by an unused TCP port.
    remap_config:
    - from: 'http://origin-tcp-info.test/'
      to: 'http://origin-tcp-info.test/'
    logging_yaml:
      logging:
        formats:
        - name: origin_tcp_info
          format: '%<{uuid}cqh> %<crc> %<srtt> %<srtv> %<sret> %<scwn>'
        logs:
        - filename: origin_tcp_info
          format: origin_tcp_info
          mode: ascii
    log_validation:
      traffic_out:
        contains:
        - expression: '\(socket_tcp_info\).*rtt=[1-9][0-9]*'
          description: 'The first parent must supply a sample before the retry'

sessions:
- transactions:
  - client-request:
      method: GET
      url: /retry
      version: '1.1'
      headers:
        fields:
        - [Host, origin-tcp-info.test]
        - [uuid, retry]
    server-response:
      status: 503
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 502
