meta:
  version: "1.0"

autest:
  description: 'Skip TCP_INFO when access logging is globally disabled'
  server:
    name: server_global_disabled
  client:
    name: client_global_disabled
  ats:
    name: ts_global_disabled
    process_config:
      enable_cache: false
    records_config:
      proxy.config.http.log_server_tcp_info: 1
      proxy.config.log.logging_enabled: 0
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'socket_tcp_info'
    remap_config:
    - from: 'http://origin-tcp-info.test/'
      to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
    log_validation:
      traffic_out:
        excludes:
        - expression: '\(socket_tcp_info\)'
          description: 'The TCP_INFO accessor must not run with access logging disabled'

sessions:
- transactions:
  - client-request:
      method: GET
      url: /global-disabled
      version: '1.1'
      headers:
        fields:
        - [Host, origin-tcp-info.test]
        - [uuid, global-disabled]
    server-response:
      status: 200
      headers:
        fields:
        - [Content-Length, 16]
    proxy-response:
      status: 200
