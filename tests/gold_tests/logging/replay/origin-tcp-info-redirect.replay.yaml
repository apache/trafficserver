meta:
  version: "1.0"

autest:
  description: 'Clear origin TCP_INFO when following a redirect to a cached response'
  server:
    name: server_redirect
  client:
    name: client_redirect
  ats:
    name: ts_redirect
    process_config:
      enable_cache: true
    records_config:
      proxy.config.http.log_server_tcp_info: 1
      proxy.config.http.number_of_redirections: 1
      proxy.config.http.redirect_use_orig_cache_key: 0
      proxy.config.http.redirect.actions: 'self:follow'
      proxy.config.log.max_secs_per_buffer: 1
      proxy.config.log.periodic_tasks_interval: 1
    remap_config:
    - from: 'http://origin-tcp-info.test/'
      to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
    logging_yaml:
      logging:
        formats:
        - name: origin_tcp_info
          format: '%<{uuid}cqh> %<crc> %<srtt> %<srtv> %<sret> %<scwn>'
        logs:
        - filename: origin_tcp_info
          format: origin_tcp_info
          mode: ascii

sessions:
- transactions:
  - client-request:
      method: GET
      url: /target
      version: '1.1'
      headers:
        fields:
        - [Host, origin-tcp-info.test]
        - [uuid, prime]
    server-response:
      status: 200
      headers:
        fields:
        - [Content-Length, 16]
        - [Cache-Control, 'public, max-age=300']
    proxy-response:
      status: 200

  - client-request:
      # Allow the target's cache write to finish before following the redirect.
      delay: 100ms
      method: GET
      url: /redirect
      version: '1.1'
      headers:
        fields:
        - [Host, origin-tcp-info.test]
        - [uuid, redirect]
    server-response:
      status: 302
      headers:
        fields:
        - [Content-Length, 0]
        - [Location, /target]
        - [Cache-Control, no-store]
    proxy-response:
      status: 200
