meta:
  version: "1.0"

autest:
  description: 'Verify ATS rejects a header field longer than the uint16_t field-length limit with a 400.'

  dns:
    name: 'dns'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http'

    remap_config:
      - from: "http://example.com/"
        to: "http://backend.example.com:{SERVER_HTTP_PORT}/"

sessions:
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /oversized-field
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, oversized-field ]
        - [ X-Big,  ]

    # ATS must reject during parse and never forward the request to the origin.
    proxy-request:
      expect: absent

    # Never served (ATS rejects the request before it reaches the origin), but
    # Proxy Verifier requires a server-response on every transaction it parses.
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "0" ]

    proxy-response:
      status: 400

  # Normal, under-limit request. Regression guard: a small header must NOT be
  # over-rejected. ATS must forward it to the origin and return 200.
  - client-request:
      method: "GET"
      version: "1.1"
      url: /normal-field
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, normal-field ]
        - [ X-Small, small-value ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "4" ]
        - [ uuid, normal-field ]

    proxy-request:
      headers:
        fields:
        - [ uuid, { value: normal-field, as: equal } ]

    proxy-response:
      status: 200
