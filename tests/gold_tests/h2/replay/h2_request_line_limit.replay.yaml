# An HTTP/2 request line over request_line_max_size. HPACK caps :path at
# header_field_max_size, so this is only reachable when the request line limit
# is the smaller of the two, and a fast path that skipped parse_req would forward it.

meta:
  version: "1.0"

autest:
  description: 'HTTP/2 request handling: request_line_max_size'

  server:
    name: 'server-line-limit'

  client:
    name: 'client-line-limit'

  ats:
    name: 'ts-line-limit'

    process_config:
      enable_tls: true

    records_config:
      proxy.config.http.request_line_max_size: 1024

    remap_config:
      - from: "https://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
- protocol:
    stack: http2
    tls:
      sni: example.com
  transactions:
  - client-request:
      frames:
      - HEADERS:
          headers:
            fields:
            - [":method", GET]
            - [":scheme", https]
            - [":authority", example.com]
            - [":path", "/gate/llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllllll\
              llllll"]
            - [uuid, gate-request-line]
    proxy-request:
      expect: absent
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 414
