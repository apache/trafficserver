meta:
  version: '1.0'

autest:
  description: 'Verify bodyless HTTP/2 origin responses with header blocks larger than one IOBuffer block'

  server:
    name: 'h2-origin'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: false
      enable_tls: true

    records_config:
      proxy.config.ssl.client.alpn_protocols: 'h2,http/1.1'
      proxy.config.ssl.client.verify.server.policy: 'PERMISSIVE'
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|http2|ssl_alpn'

    remap_config:
    - from: 'http://h2-origin.test/'
      to: 'https://127.0.0.1:{SERVER_HTTPS_PORT}/'

    log_validation:
      traffic_out:
        contains:
        - expression: 'Negotiated ALPN: h2'
          description: 'ATS should talk HTTP/2 to the origin.'

sessions:
- transactions:

  # Bodyless 302 whose header block spans three 4 KB blocks.
  # Header block as printed by ATS: about 8721 bytes.
