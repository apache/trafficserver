meta:
  version: '1.0'

# Two outbound HTTP/2 transactions whose responses are generated by the
# custom origin in `continuation_origin.py`. The origin sends a header block
# larger than 16 KiB and positively verifies that it emits CONTINUATION
# frames. This drives the outbound response path on streams that are past
# IDLE so the regression guards in `h2_to_origin_continuation.test.py` catch:
#
#   - "continuation bad state" PROTOCOL_ERROR if the outbound
#     CONTINUATION state-machine guard is ever re-tightened.
#   - The `_sm == nullptr` assertion if `rcv_continuation_frame` ever
#     unconditionally calls `new_transaction` on outbound streams again.
sessions:
  - protocol:
      - name: http
        version: '2'
      - name: tls
        version: TLSv1.3
        sni: cont.h2o.example.com
        proxy-verify-mode: 0
        proxy-provided-cert: true
      - name: tcp
      - name: ip
        version: '4'

    transactions:
      - all: { headers: { fields: [[ uuid, h2o-cont-1 ]]}}

        client-request:
          version: '2'
          scheme: https
          method: GET
          url: /continuation/first
          headers:
            encoding: esc_json
            fields:
              - [ Host, cont.h2o.example.com ]
          content:
            encoding: plain
            size: 0

        proxy-request:
          version: '2'
          scheme: https
          method: GET
          url:
            - [ path, { value: /continuation/first, as: equal } ]
          headers:
            encoding: esc_json
            fields:
              - [ Host, cont.h2o.example.com ]

        server-response:
          version: '2'
          status: 200
          reason: OK
          headers:
            encoding: esc_json
            fields:
              - [ Content-Length, 4 ]
          content:
            encoding: plain
            data: 'okay'

        proxy-response:
          version: '2'
          status: 200
          headers:
            encoding: esc_json
            fields:
              - [ Content-Length, 4 ]

      - all: { headers: { fields: [[ uuid, h2o-cont-2 ]]}}

        client-request:
          version: '2'
          scheme: https
          method: GET
          url: /continuation/second
          headers:
            encoding: esc_json
            fields:
              - [ Host, cont.h2o.example.com ]
          content:
            encoding: plain
            size: 0

        proxy-request:
          version: '2'
          scheme: https
          method: GET
          url:
            - [ path, { value: /continuation/second, as: equal } ]
          headers:
            encoding: esc_json
            fields:
              - [ Host, cont.h2o.example.com ]

        server-response:
          version: '2'
          status: 200
          reason: OK
          headers:
            encoding: esc_json
            fields:
              - [ Content-Length, 4 ]
          content:
            encoding: plain
            data: 'okay'

        proxy-response:
          version: '2'
          status: 200
          headers:
            encoding: esc_json
            fields:
              - [ Content-Length, 4 ]
