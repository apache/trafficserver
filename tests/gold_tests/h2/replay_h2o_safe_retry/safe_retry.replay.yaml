meta:
  version: '1.0'

# The custom HTTP/2 origin rejects the first copy of each POST with a signal
# that guarantees the request was not processed. A successful response proves
# that ATS retries the non-idempotent method and replays its body.
sessions:
  - transactions:
      - all: { headers: { fields: [[ uuid, rst-refused ]]}}
        client-request:
          method: POST
          version: '1.1'
          scheme: http
          url: /rst-refused
          headers:
            fields:
              - [ Host, safe-retry.example.com ]
              - [ Content-Length, 12 ]
          content:
            encoding: plain
            data: request-body
        proxy-response:
          status: 200
          headers:
            fields:
              - [ Content-Length, 7 ]
          content:
            encoding: plain
            data: retried

      - all: { headers: { fields: [[ uuid, goaway-last-stream-zero ]]}}
        client-request:
          method: POST
          version: '1.1'
          scheme: http
          url: /goaway-last-stream-zero
          headers:
            fields:
              - [ Host, safe-retry.example.com ]
              - [ Content-Length, 12 ]
          content:
            encoding: plain
            data: request-body
        proxy-response:
          status: 200
          headers:
            fields:
              - [ Content-Length, 7 ]
          content:
            encoding: plain
            data: retried
