meta:
  version: '1.0'

sessions:
- protocol:
    stack: http2
    tls:
      sni: test_sni
  transactions:
  - client-request:
      headers:
        fields:
        - [:method, GET]
        - [:scheme, https]
        - [:authority, example.data.com]
        - [:path, /trailers]
        - [uuid, h2-origin-trailers-h1]

    proxy-request:
      headers:
        fields:
        - [uuid, {value: h2-origin-trailers-h1, as: equal}]

    server-response:
      status: 200
      headers:
        fields:
        - [Content-Type, text/plain]
        - [Cache-Control, no-store]
      content:
        encoding: plain
        data: hello from h2 origin
        size: 20
      trailers:
        fields:
        - [x-ats-h2-trailer, smuggled]
        - [x-trailer-check, after-body]
