meta:
  version: "1.0"

autest:
  description: "Dual certificate default context selection (ec_rsa)"
  server:
    name: "server_ec_rsa"
  client:
    name: "client_ec_rsa"
  ats:
    name: "ts_ec_rsa"
    process_config:
      enable_tls: true
      enable_cache: false
    ssl_multicert_yaml:
      - 'ssl_multicert:'
      - '  - dest_ip: "*"'
      - '    ssl_cert_name: signed-foo-ec.pem,signed-foo.pem'
      - '    ssl_key_name: signed-foo-ec.key,signed-foo.key'
      - '  - dest_ip: ""'
      - '    ssl_cert_name: signed-san.pem,signed-san-ec.pem'
      - '    ssl_key_name: signed-san.key,signed-san-ec.key'
    remap_config:
      - from: "https://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
  - protocol:
      stack: https
      tls:
        sni: one.com
    transactions:
      - client-request:
          method: GET
          url: /
          version: "1.1"
          headers:
            fields:
              - [ Host, example.com ]
              - [ uuid, dual-cert-default ]
        server-response:
          status: 200
          headers:
            fields:
              - [ Content-Length, 0 ]
        proxy-response:
          status: 200
