meta:
  version: "1.0"

autest:
  description: "Plain inbound transaction with outbound SNI server_name policy"
  dns:
    name: "dns"
  server:
    name: "server"
  client:
    name: "client"
  ats:
    name: "ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|ssl"
      proxy.config.ssl.client.sni_policy: "server_name"
      proxy.config.ssl.client.verify.server.policy: "DISABLED"
    remap_config:
      - from: "http://plain.example.com/"
        to: "https://origin.example.com:{SERVER_HTTPS_PORT}/"

sessions:
- protocol:
    stack: http
  transactions:
  - client-request:
      method: GET
      url: /server-name-policy
      version: "1.1"
      headers:
        fields:
        - [ Host, plain.example.com ]
        - [ uuid, outbound-sni-server-name-plain ]
        - [ X-Test, outbound-sni-server-name-plain ]
        - [ Content-Length, 0 ]

    proxy-request:
      protocol:
        stack: https
        tls:
          sni: origin.example.com
          proxy-verify-mode: 1
          proxy-provided-cert: false
      headers:
        fields:
        - [ X-Test, { value: outbound-sni-server-name-plain, as: equal } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ X-Response, outbound-sni-server-name-plain ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: outbound-sni-server-name-plain, as: equal } ]
