meta:
  version: "1.0"

autest:
  description: 'Verify txn_box compares a heterogeneous tuple'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    process_config:
      enable_cache: false

    copy_to_config_dir:
      - 'txn_box.yaml'

    plugin_config:
      - 'txn_box.so txn_box.yaml'

    remap_config:
      - from: 'http://example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'

sessions:
- transactions:
  - client-request:
      method: GET
      version: "1.1"
      url: /example
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, tuple-comparison ]

    proxy-request:
      method: GET
      url: /example

    server-response:
      status: 404
      reason: Not Found
      headers:
        fields:
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Cache-Control, { value: 'max-age=3600', as: equal } ]

  - client-request:
      method: GET
      version: "1.1"
      url: /scalar
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, scalar-comparison ]

    proxy-request:
      method: GET
      url: /scalar

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Txn-Box, { value: 'selected', as: equal } ]
