sessions:
- protocol:
    stack: https
    tls:
      sni: test

  transactions:
  # 1: Regular request
  # ```
  # payload='sub=frogs-in-a-well&exp=1577836800&nbf=1514764800&iat=1514160000&tid=1234567890&kid=key1&st=HMAC-SHA-256&md='
  # signature=$(echo -n ${payload} | openssl dgst -sha256 -hmac "PEIFtmunx9")
  # TokenRespHdr=${payload}${signature}
  # ```
  - client-request:
      method: "GET"
      version: "1.1"
      url: /test-1/
      headers:
        fields:
          - [ uuid, 1]
          - [ Host, example.com ]

    server-response:
      status: 200
      headers:
        fields:
          - [ TokenRespHdr, sub=frogs-in-a-well&exp=4073587200&nbf=1514764800&iat=1514160000&tid=1234567890&kid=key1&st=HMAC-SHA-256&md=d128cb2ee353515f3e09afb2010345a9ea1d9ce3bb49d10b2508eaca29c74d78 ]
          - [ Content-Length, 1024 ]

    proxy-response:
      status: 200
      headers:
        fields:
          - [ set-cookie, { value: Expires=, as: contains } ]

  # 2: Origin server set "exp=0" and ATS returns Session Cookie
  # ```
  # payload='sub=frogs-in-a-well&exp=0&nbf=1514764800&iat=1514160000&tid=1234567890&kid=key1&st=HMAC-SHA-256&md='
  # signature=$(echo -n ${payload} | openssl dgst -sha256 -hmac "PEIFtmunx9")
  # TokenRespHdr=${payload}${signature}
  # ```
  - client-request:
      method: "GET"
      version: "1.1"
      url: /test-2/
      headers:
        fields:
          - [ uuid, 2]
          - [ Host, example.com ]

    server-response:
      status: 200
      headers:
        fields:
          - [ TokenRespHdr, sub=frogs-in-a-well&exp=0&nbf=1514764800&iat=1514160000&tid=1234567890&kid=key1&st=HMAC-SHA-256&md=e67dce2fcfaf169dde0fe0e6ecf14bea7658bffbe3f1b30c22b048432e9cc41f ]
          - [ Content-Length, 1024 ]

    proxy-response:
      status: 200
      headers:
        fields:
          - [ set-cookie, { value: Expires=, not: contains } ]

  # 3: In-scope request with signed scoped token
  # ```
  # payload='sub=user1&exp=4073587200&nbf=1514764800&iat=1514160000&tid=1234567890&scope=/scoped/in-scope/&kid=key1&st=HMAC-SHA-256&md='
  # signature=$(echo -n ${payload} | openssl dgst -sha256 -hmac "PEIFtmunx9" | sed -e 's/^.* //')
  # token="${payload}${signature}"
  # cookie=$(echo -n "${token}" | base64 -w0 | tr '+/' '-_' | tr -d '=')
  # ```
  - client-request:
      method: "GET"
      version: "1.1"
      url: /scoped/in-scope/resource
      headers:
        fields:
          - [ uuid, 3 ]
          - [ Host, example.com ]
          - [ Cookie, "TokenCookie=c3ViPXVzZXIxJmV4cD00MDczNTg3MjAwJm5iZj0xNTE0NzY0ODAwJmlhdD0xNTE0MTYwMDAwJnRpZD0xMjM0NTY3ODkwJnNjb3BlPS9zY29wZWQvaW4tc2NvcGUvJmtpZD1rZXkxJnN0PUhNQUMtU0hBLTI1NiZtZD0xOWViZDdkZGVjNzM3N2FjMDNkY2FmYmMwMDRhN2Q0ZDZkZjdjMTEwZDE0ZTQxMWQ5OGNjYWNkZGVlYTAyMjQ3" ]

    proxy-request:
      headers:
        fields:
          - [ @TokenSubject, { value: user1, as: equal } ]

    server-response:
      status: 200
      headers:
        fields:
          - [ Content-Length, 10 ]

    proxy-response:
      status: 200

  # 4: Out-of-scope request with signed scoped token
  - client-request:
      method: "GET"
      version: "1.1"
      url: /scoped/out-of-scope/resource
      headers:
        fields:
          - [ uuid, 4 ]
          - [ Host, example.com ]
          - [ Cookie, "TokenCookie=c3ViPXVzZXIxJmV4cD00MDczNTg3MjAwJm5iZj0xNTE0NzY0ODAwJmlhdD0xNTE0MTYwMDAwJnRpZD0xMjM0NTY3ODkwJnNjb3BlPS9zY29wZWQvaW4tc2NvcGUvJmtpZD1rZXkxJnN0PUhNQUMtU0hBLTI1NiZtZD0xOWViZDdkZGVjNzM3N2FjMDNkY2FmYmMwMDRhN2Q0ZDZkZjdjMTEwZDE0ZTQxMWQ5OGNjYWNkZGVlYTAyMjQ3" ]

    proxy-response:
      status: 403
      headers:
        fields:
          - [ @TokenSubject, { as: absent } ]

