# Used by: global JA4 configuration reload test.
#
# Each client run selects a pair of sessions by uuid key:
#
#   initial-*  : servernames [jax.server.test] as loaded at startup.
#   reloaded-* : servernames [jax-filtered.server.test] after
#                traffic_ctl plugin msg jax_fingerprint.reload.
#
# A session whose SNI is in the current allowlist must carry the
# fingerprint headers; one whose SNI is not in it must not.

meta:
  version: "1.0"

sessions:

- protocol:
  - name: tls
    sni: jax.server.test
  - name: tcp
  - name: ip

  transactions:

  - client-request:
      method: GET
      url: /resource
      version: '1.1'
      headers:
        fields:
        - [ Host, jax.server.test ]
        - [ Content-Length, 0 ]
        - [ uuid, initial-allowed ]

    proxy-request:
      headers:
        fields:
        - [ x-jax, { as: present } ]
        - [ x-jax-via, { value: 'test.proxy.test', as: equal } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ Connection, close ]

    proxy-response:
      status: 200

- protocol:
  - name: tls
    sni: jax-filtered.server.test
  - name: tcp
  - name: ip

  transactions:

  - client-request:
      method: GET
      url: /resource
      version: '1.1'
      headers:
        fields:
        - [ Host, jax-filtered.server.test ]
        - [ Content-Length, 0 ]
        - [ uuid, initial-filtered ]

    proxy-request:
      headers:
        fields:
        - [ x-jax, { as: absent } ]
        - [ x-jax-via, { as: absent } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ Connection, close ]

    proxy-response:
      status: 200

- protocol:
  - name: tls
    sni: jax-filtered.server.test
  - name: tcp
  - name: ip

  transactions:

  - client-request:
      method: GET
      url: /resource
      version: '1.1'
      headers:
        fields:
        - [ Host, jax-filtered.server.test ]
        - [ Content-Length, 0 ]
        - [ uuid, reloaded-allowed ]

    proxy-request:
      headers:
        fields:
        - [ x-jax, { as: present } ]
        - [ x-jax-via, { value: 'test.proxy.test', as: equal } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ Connection, close ]

    proxy-response:
      status: 200

- protocol:
  - name: tls
    sni: jax.server.test
  - name: tcp
  - name: ip

  transactions:

  - client-request:
      method: GET
      url: /resource
      version: '1.1'
      headers:
        fields:
        - [ Host, jax.server.test ]
        - [ Content-Length, 0 ]
        - [ uuid, reloaded-filtered ]

    proxy-request:
      headers:
        fields:
        - [ x-jax, { as: absent } ]
        - [ x-jax-via, { as: absent } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ Connection, close ]

    proxy-response:
      status: 200
