# Used by: jax_fingerprint_log_field.test.py
#
# The client asks ATS to close the connection after the response. ATS closes
# the client connection before it writes the transaction log entry, so the
# --log-field callbacks run after the client vconn is gone.

meta:
  version: "1.0"

sessions:

- protocol:
  - name: tls
    sni: jax.server.test
  - name: tcp
  - name: ip

  transactions:

  - client-request:
      method: GET
      url: /connection-close
      version: '1.1'
      headers:
        fields:
        - [ Host, jax.server.test ]
        - [ Content-Length, 0 ]
        - [ Connection, close ]
        - [ uuid, connection-close ]

    proxy-request:
      headers:
        fields:
        - [ x-ja4, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 2 ]

    proxy-response:
      status: 200
