# Verify that stale-if-error origin fetches honor --max-memory-usage. When the
# origin response cannot fit in the plugin buffer, the plugin should fall back
# to the cached stale response instead of buffering the oversized response.

sessions:

- transactions:

  - client-request:
      method: GET
      url: /pictures/memory-cap.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, first-request ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, image/jpeg ]
        - [ Content-Length, 5 ]
        - [ Connection, keep-alive ]
        - [ Cache-Control, "max-age=1, stale-if-error=30" ]
        - [ X-Response, cached-response ]
      content:
        encoding: plain
        data: STALE

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: cached-response, as: equal } ]
      content:
        encoding: plain
        data: STALE
        verify: { as: equal }

  - client-request:

      delay: 2s

      method: GET
      url: /pictures/memory-cap.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, second-request ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, image/jpeg ]
        - [ Content-Length, 512 ]
        - [ Connection, close ]
        - [ Cache-Control, "max-age=1" ]
        - [ X-Response, oversized-origin-response ]
        # The preceding fields serialize to 215 bytes. X-Padding adds 42 wire
        # bytes (name, separator, 29-byte value, and CRLF), bringing the header
        # to the 256-byte limit plus the one-byte overflow sentinel. This makes
        # the memory rejection independent of body segmentation.
        - [ X-Padding, aaaaaaaaaaaaaaaaaaaaaaaaaaaaa ]
      content:
        size: 512

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: cached-response, as: equal } ]
      content:
        encoding: plain
        data: STALE
        verify: { as: equal }
