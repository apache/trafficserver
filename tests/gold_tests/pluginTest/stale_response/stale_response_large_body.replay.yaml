# Verify that the stale-while-revalidate refresh of a response whose body is
# larger than the server intercept's 64 KiB write slice is fully written into
# the cache.

meta:
  version: "1.0"

autest:
  description: 'stale-while-revalidate refresh of a large body is fully cached'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|stale_response'
      proxy.config.http.wait_for_cache: 1
      proxy.config.http.server_session_sharing.pool: global

    plugin_config:
      - 'stale_response.so --stale-while-revalidate-default 30'

    remap_config:
      - from: 'http://www.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'

    log_validation:
      traffic_out:
        contains:
          - expression: 'stale_response_intercept.*vconn write complete'
            description: 'The cache-populating intercept writes the whole body'
        excludes:
          - expression: 'stale_response_bad.*error event'
            description: 'The cache-populating intercept must not fail'

sessions:
- transactions:

  # Populate the cache with a response that quickly becomes stale.
  - client-request:
      method: GET
      url: /large.txt
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, first-request ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Content-Length, 200000 ]
        - [ Cache-Control, "max-age=1" ]
        - [ X-Response, first-response ]
      content:
        encoding: plain
        size: 200000

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 200000, as: equal } ]
        - [ X-Response, { value: first-response, as: equal } ]

  # Once stale, the plugin serves the cached response and refreshes it in the
  # background. The refreshed response is larger than one intercept write
  # slice.
  - client-request:
      delay: 2s
      method: GET
      url: /large.txt
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, second-request ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Content-Length, 300000 ]
        - [ Cache-Control, "max-age=300" ]
        - [ X-Response, second-response ]
      content:
        encoding: plain
        size: 300000

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 200000, as: equal } ]
        - [ X-Response, { value: first-response, as: equal } ]

  # The complete refreshed response should now be served from the cache.
  - client-request:
      delay: 3s
      method: GET
      url: /large.txt
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, third-request ]

    # This should not reach the server.
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ X-Response, third-response ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 300000, as: equal } ]
        - [ X-Response, { value: second-response, as: equal } ]
