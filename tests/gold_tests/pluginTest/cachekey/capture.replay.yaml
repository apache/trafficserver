meta:
  version: '1.0'

autest:
  description: 'Cachekey captures beyond the default regex match capacity'
  server:
    name: server
  client:
    name: client
  ats:
    name: ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: cachekey
    plugin_config:
      - 'xdebug.so --enable=x-cache-key'
    remap_config:
      - from: 'http://nine.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--static-prefix=capture'
              - '--capture-path=(a)(b)(c)(d)(e)(f)(g)(h)(i)'
      - from: 'http://ten.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--static-prefix=capture'
              - '--capture-path=(a)(b)(c)(d)(e)(f)(g)(h)(i)(j)'
      - from: 'http://twelve.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--static-prefix=capture'
              - '--capture-path=(a)(b)(c)(d)(e)(f)(g)(h)(i)(j)(k)(l)'
      - from: 'http://replace.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--static-prefix=capture'
              - '--capture-path=/(a)(b)(c)(d)(e)(f)(g)(h)(i)(j)(k)(l)/$9$1/'
      - from: 'http://whole.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--static-prefix=capture'
              - '--capture-path=abcdef'
      - from: 'http://no-match.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: cachekey.so
            args:
              - '--static-prefix=capture'
              - '--capture-path=(z)'

sessions:
- transactions:
  - client-request:
      method: GET
      url: /abcdefghi
      version: '1.1'
      headers:
        fields:
        - [Host, nine.example.com]
        - [uuid, nine]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: '/capture/a/b/c/d/e/f/g/h/i', as: equal}]

  - client-request:
      method: GET
      url: /abcdefghij
      version: '1.1'
      headers:
        fields:
        - [Host, ten.example.com]
        - [uuid, ten]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: '/capture/a/b/c/d/e/f/g/h/i/j', as: equal}]

  - client-request:
      method: GET
      url: /abcdefghijkl
      version: '1.1'
      headers:
        fields:
        - [Host, twelve.example.com]
        - [uuid, twelve]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: '/capture/a/b/c/d/e/f/g/h/i/j/k/l', as: equal}]

  - client-request:
      method: GET
      url: /abcdefghijkl
      version: '1.1'
      headers:
        fields:
        - [Host, replace.example.com]
        - [uuid, replace]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: '/capture/ia', as: equal}]

  - client-request:
      method: GET
      url: /abcdef
      version: '1.1'
      headers:
        fields:
        - [Host, whole.example.com]
        - [uuid, whole]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: '/capture/abcdef', as: equal}]

  - client-request:
      method: GET
      url: /abcdef
      version: '1.1'
      headers:
        fields:
        - [Host, no-match.example.com]
        - [uuid, no-match]
        - [X-Debug, x-cache-key]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Cache-Key, {value: '/capture', as: equal}]
