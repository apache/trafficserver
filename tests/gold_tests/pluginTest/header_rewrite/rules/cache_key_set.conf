cond %{CLIENT-HEADER:X-Case} =host
  set-cache-key HOST "k.ex"

cond %{CLIENT-HEADER:X-Case} =path
  set-cache-key PATH ""

cond %{CLIENT-HEADER:X-Case} =query
  set-cache-key QUERY ""

cond %{CLIENT-HEADER:X-Case} =scheme
  set-cache-key SCHEME "https"

# X-Port is absent in the port-reset case, so the value expands to "".
cond %{CLIENT-HEADER:X-Case} =port [OR]
cond %{CLIENT-HEADER:X-Case} =port-reset
  set-cache-key PORT "%{CLIENT-HEADER:X-Port}"

cond %{CLIENT-HEADER:X-Case} =no-scheme
  set-cache-key SCHEME ""
