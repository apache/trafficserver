# State-variable coverage for the issue #143 fix: txn (STATE-*) and session
# (SESSION-*) flag/int8/int16, via both eval and value-expansion reads.

# Txn STATE: set at remap, read on the response of the same transaction.
set-state-flag 2 true
set-state-int8 1 42
set-state-int16 0 4242

cond %{SEND_RESPONSE_HDR_HOOK} [AND]
cond %{STATE-FLAG:2} =TRUE
  set-header X-State-Flag "set"

cond %{SEND_RESPONSE_HDR_HOOK}
  set-header X-State-Int8 "%{STATE-INT8:1}"

cond %{SEND_RESPONSE_HDR_HOOK}
  set-header X-State-Int16 "%{STATE-INT16}"

# Session reads first (so request 1 of a keep-alive session sees unset)...
cond %{SEND_RESPONSE_HDR_HOOK} [AND]
cond %{SESSION-FLAG:0} =TRUE
  set-header X-Session-Seen "yes"

cond %{SEND_RESPONSE_HDR_HOOK}
  set-header X-Session-Int8 "%{SESSION-INT8:2}"

cond %{SEND_RESPONSE_HDR_HOOK} [AND]
cond %{SESSION-INT8:2} =100
  set-header X-Session-Int8-Seen "yes"

cond %{SEND_RESPONSE_HDR_HOOK}
  set-header X-Session-Int16 "%{SESSION-INT16}"

# ...then the writes, which persist to later requests on the same session.
cond %{SEND_RESPONSE_HDR_HOOK}
  set-session-flag 0 true

cond %{SEND_RESPONSE_HDR_HOOK}
  set-session-int8 2 100

cond %{SEND_RESPONSE_HDR_HOOK}
  set-session-int16 0 4242
