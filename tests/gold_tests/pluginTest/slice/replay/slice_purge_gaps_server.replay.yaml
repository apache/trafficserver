        - [uuid, hole-fill-0]
    server-response:
      status: 206
      reason: Partial Content
      headers:
        fields:
        - [Content-Range, bytes 0-9/30]
        - [Content-Length, '10']
        - [Cache-Control, 'public, max-age=86400']
      content: {encoding: plain, data: 'aaaaaaaaaa', size: 10}

