#
# Origin side of slice_purge_gaps.test.py.
#
# Keyed on "{url}{field.range}{field.uuid}", so one transaction answers one block
# of one phase. Blocks are 10 bytes: block 0 is "a", 1 is "b", 2 is "c", 4 is "e".
#
# PURGE is answered by ATS and the plugin issues no other request kind, so neither
# appears here.
#
# A check phase for a block expected to SURVIVE its purge is deliberately absent:
# if such a block were wrongly purged, ATS would ask for an unregistered key and
# the client's own expectation would fail too.
#

meta:
  version: "1.0"

