#
# Client side of slice_purge_gaps.test.py. Each transaction is one phase, selected
# by uuid with the verifier-client --keys option; several phases share a run where
# they are independent. The uuid also picks which origin transaction the block
# requests slice derives from will match.
#
# Blocks are 10 bytes: block 0 is "a", 1 is "b", 2 is "c", 4 is "e". Every proxy
# runs --ref-relative, so a ranged GET touches only the blocks its range covers
# and a fill phase can leave a chosen block uncached.
#

meta:
  version: "1.0"

sessions:
- transactions:

  - client-request:
      method: GET
      version: "1.1"
      url: /hole
      headers:
        fields:
        - [Host, slice]
        - [Range, bytes=0-9]
        - [uuid, hole-fill-0]
    proxy-response:
      status: 206
      headers:
        fields:
        - [Content-Range, {value: bytes 0-9/30, as: equal}]
      content:
        encoding: plain
        data: 'aaaaaaaaaa'
        verify: {as: equal}

  - client-request:
      method: GET
      version: "1.1"
      url: /hole
      headers:
        fields:
        - [Host, slice]
        - [Range, bytes=20-29]
        - [uuid, hole-fill-2]
    proxy-response:
      status: 206
      headers:
        fields:
        - [Content-Range, {value: bytes 20-29/30, as: equal}]
      content:
        encoding: plain
        data: 'cccccccccc'
        verify: {as: equal}

  - client-request:
      method: PURGE
      version: "1.1"
      url: /hole
