meta:
  version: "1.0"

autest:
  description: 'Verify slice strips body-declaring headers from block requests'

  server:
    name: 'server-body-headers'

  client:
    name: 'client-body-headers'

  ats:
    name: 'ts-body-headers'

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'slice'
      proxy.config.http.allow_half_open: 0
      # A block request left waiting on a body fails quickly instead of hanging.
      proxy.config.http.transaction_no_activity_timeout_in: 5

    remap_config:
      - from: "http://slice/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
        plugins:
          - name: "slice.so"
            args:
              - "--blockbytes-test=11"

# Client GETs with body-declaring headers must reach the origin as block
# requests without them, otherwise the internal transaction waits for a
# body slice never sends. Each 8 byte body fits in one 11 byte block, so
# every client request makes exactly one block request.
#
# Background prefetch reuses the same stripped request header. It cannot be
# asserted here because the prefetch request reuses the client uuid.

sessions:

  - transactions:

    - client-request:
        method: GET
        url: /dup_te
        version: '1.1'
        headers:
          fields:
          - [Host, slice]
          - [Transfer-Encoding, chunked]
          - [Transfer-Encoding, chunked]
          - [uuid, dup-te]
        content:
          size: 0

      proxy-request:
        headers:
          fields:
          - [Transfer-Encoding, {as: absent}]
          - [Content-Length, {as: absent}]

      server-response:
        status: 206
        reason: Partial Content
        headers:
          fields:
          - [Content-Length, "8"]
          - [Content-Range, "bytes 0-7/8"]
          - [Cache-Control, "max-age=500"]
        content:
          data: "surfin!!"

      proxy-response:
        status: 200
        headers:
          fields:
          - [Content-Length, {value: "8", as: equal}]

  - transactions:

    - client-request:
        method: GET
        url: /cl_zero
        version: '1.1'
        headers:
          fields:
          - [Host, slice]
          - [Content-Length, "0"]
          - [uuid, cl-zero]

      proxy-request:
        headers:
          fields:
          - [Transfer-Encoding, {as: absent}]
          - [Content-Length, {as: absent}]

      server-response:
        status: 206
        reason: Partial Content
        headers:
          fields:
          - [Content-Length, "8"]
          - [Content-Range, "bytes 0-7/8"]
          - [Cache-Control, "max-age=500"]
        content:
          data: "surfin!!"

      proxy-response:
        status: 200
        headers:
          fields:
          - [Content-Length, {value: "8", as: equal}]
