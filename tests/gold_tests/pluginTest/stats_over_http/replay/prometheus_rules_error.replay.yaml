meta:
  version: "1.0"

autest:
  description: 'With --on-config-error=503, a remap rule whose configuration file has an error answers with a 503'
  server:
    name: 'server-error'
  client:
    name: 'client-error'
  ats:
    name: 'ts-error'
    # The plugin logs the configuration errors as ERROR lines, which the default diags.log check rejects.
    process_config:
      disable_log_checks: true
    copy_to_config_dir:
      - 'rules/no_capture_group.yaml'
    remap_config:
      - from: 'http://broken.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: 'stats_over_http.so'
            args: ['--format=prometheus', '--config=no_capture_group.yaml', '--on-config-error=503']
      - from: 'http://missing.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: 'stats_over_http.so'
            args: ['--config=missing.yaml', '--on-config-error=503']
      - from: 'http://json.example.com/'
        to: 'http://127.0.0.1:{SERVER_HTTP_PORT}/'
        plugins:
          - name: 'stats_over_http.so'
            args: []
    log_validation:
      diags_log:
        contains:
          - expression: "no_capture_group.yaml: line 20: prometheus.rules.match: .* has no capture group.  The remap rule answers each request with a 503"
            description: 'The plugin should log the error in the file'
          - expression: "missing.yaml: cannot open the file: No such file or directory.  The remap rule answers each request with a 503"
            description: 'The plugin should log that the file is missing'
        excludes:
          - expression: 'FATAL:'
            description: 'Traffic Server should start despite the errors'
    metric_checks:
      - metric: 'plugin.stats_over_http.config_errors'
        value: 2
      - metric: 'plugin.stats_over_http.renders'
        value: 1

sessions:
- transactions:
  - client-request:
      method: GET
      version: '1.1'
      url: /metrics
      headers:
        fields:
        - [ Host, broken.example.com ]
        - [ uuid, broken ]
    proxy-request:
      expect: absent
    proxy-response:
      status: 503
      headers:
        fields:
        - [ Content-Type, { as: absent } ]
        - [ Content-Length, { value: 0, as: equal } ]
        - [ X-Stats-Format, { value: prometheus, as: equal } ]

  - client-request:
      method: HEAD
      version: '1.1'
      url: /metrics
      headers:
        fields:
        - [ Host, broken.example.com ]
        - [ uuid, broken-head ]
    proxy-request:
      expect: absent
    proxy-response:
      status: 503
      headers:
        fields:
        - [ X-Stats-Format, { value: prometheus, as: equal } ]

  - client-request:
      method: GET
      version: '1.1'
      url: /metrics
      headers:
        fields:
        - [ Host, missing.example.com ]
        - [ uuid, missing ]
    proxy-request:
      expect: absent
    proxy-response:
      status: 503
      headers:
        fields:
        - [ X-Stats-Format, { value: json, as: equal } ]

  # The error does not affect the other remap rules.
  - client-request:
      method: GET
      version: '1.1'
      url: /stats
      headers:
        fields:
        - [ Host, json.example.com ]
        - [ uuid, json ]
    proxy-request:
      expect: absent
    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Stats-Format, { value: json, as: equal } ]
      content:
        encoding: plain
        data: '"plugin.stats_over_http.config_errors": "2",'
        verify: { as: contains }
