meta:
  version: "1.0"

  blocks:
  - compressible-body: &compressible-body
      content:
        encoding: plain
        size: 1024

  # Served if a request that should be answered from cache reaches the origin.
  - unexpected-origin-response: &unexpected-origin-response
      status: 500
      reason: Unexpected
      headers:
        fields:
        - [ Content-Length, 0 ]

autest:
  description: 'Verify compress weakens strong ETags on compressed responses'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    copy_to_config_dir:
      - 'compress-etag.config'
      - 'compress-etag-cache-false.config'

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|compress'

    remap_config:
      - from: "http://compress.example/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
        plugins:
          - name: 'compress.so'
            args: ['compress-etag.config']
      - from: "http://uncached.example/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
        plugins:
          - name: 'compress.so'
            args: ['compress-etag-cache-false.config']

sessions:
- transactions:

  #############################################################################
  # A strong origin ETag becomes weak once the body is compressed: the bytes
  # no longer match the origin's, but the content is semantically the same.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, strong-compressed ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=3600" ]
        - [ ETag, '"abc123"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"abc123"', as: equal } ]

  #############################################################################
  # If-None-Match compares weakly, so the cached compressed copy validates.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ If-None-Match, 'W/"abc123"' ]
        - [ uuid, strong-if-none-match ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: 'W/"abc123"', as: equal } ]

  #############################################################################
  # If-Range compares strongly, so a weak validator never matches: the Range
  # is ignored and the full compressed body is returned.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ Range, bytes=0-9 ]
        - [ If-Range, 'W/"abc123"' ]
        - [ uuid, strong-if-range ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ Content-Range, { as: absent } ]

  #############################################################################
  # Uncompressed responses keep the origin's strong ETag.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /identity
      headers:
        fields:
        - [ Host, compress.example ]
        - [ uuid, identity ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ ETag, '"abc123"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { as: absent } ]
        - [ ETag, { value: '"abc123"', as: equal } ]

  #############################################################################
  # An origin ETag that is already weak passes through unchanged.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, weak-compressed ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ ETag, 'W/"weak1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"weak1"', as: equal } ]

  #############################################################################
  # A stale compressed copy revalidates at the origin with the unweakened tag.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /revalidate
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, revalidate-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=1" ]
        - [ ETag, '"rev1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"rev1"', as: equal } ]

  #############################################################################
  # The origin's 304 carries its strong ETag; the compressed copy must stay weak.
  #############################################################################
  - client-request:
      delay: 3s
      method: "GET"
      version: "1.1"
      url: /revalidate
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, revalidate-stale ]

    proxy-request:
      headers:
        fields:
        - [ If-None-Match, { value: '"rev1"', as: equal } ]

    server-response:
      status: 304
      reason: Not Modified
      headers:
        fields:
        - [ Cache-Control, "public, max-age=3600" ]
        - [ ETag, '"rev1"' ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"rev1"', as: equal } ]

  #############################################################################
  # The refreshed cached copy keeps the weak ETag.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /revalidate
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, revalidate-after ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"rev1"', as: equal } ]

  #############################################################################
  # An identity copy's weak ETag is the origin's own, so a 304 may upgrade it.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /identity-upgrade
      headers:
        fields:
        - [ Host, compress.example ]
        - [ uuid, identity-upgrade-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=1" ]
        - [ ETag, 'W/"v1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { as: absent } ]
        - [ ETag, { value: 'W/"v1"', as: equal } ]

  - client-request:
      delay: 3s
      method: "GET"
      version: "1.1"
      url: /identity-upgrade
      headers:
        fields:
        - [ Host, compress.example ]
        - [ uuid, identity-upgrade-stale ]

    proxy-request:
      headers:
        fields:
        - [ If-None-Match, { value: '"v1"', as: equal } ]

    server-response:
      status: 304
      reason: Not Modified
      headers:
        fields:
        - [ Cache-Control, "public, max-age=3600" ]
        - [ ETag, '"v1"' ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { as: absent } ]
        - [ ETag, { value: '"v1"', as: equal } ]

  #############################################################################
  # No cache entry: ATS answers a client's weak If-None-Match from the
  # origin's 200, so the 304 must carry the weak tag the compressed 200 had.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /private
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, private-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "private, max-age=1" ]
        - [ ETag, '"p1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"p1"', as: equal } ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /private
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ If-None-Match, 'W/"p1"' ]
        - [ uuid, private-conditional ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "private, max-age=1" ]
        - [ ETag, '"p1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: 'W/"p1"', as: equal } ]

  #############################################################################
  # A request ATS won't cache forwards its conditional. With nothing stored to
  # judge by, an origin 304 whose strong tag the client holds in weak form must
  # go out weak.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /private
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ Authorization, "Bearer token" ]
        - [ If-None-Match, 'W/"p1"' ]
        - [ uuid, private-forwarded-conditional ]

    proxy-request:
      headers:
        fields:
        - [ If-None-Match, { value: 'W/"p1"', as: equal } ]

    server-response:
      status: 304
      reason: Not Modified
      headers:
        fields:
        - [ Cache-Control, "private, max-age=1" ]
        - [ ETag, '"p1"' ]

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: 'W/"p1"', as: equal } ]

  #############################################################################
  # An origin that issues weak tags itself gets its 304 passed through as is.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /private-weak-origin
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ Authorization, "Bearer token" ]
        - [ If-None-Match, 'W/"w1"' ]
        - [ uuid, weak-origin-forwarded-conditional ]

    proxy-request:
      headers:
        fields:
        - [ If-None-Match, { value: 'W/"w1"', as: equal } ]

    server-response:
      status: 304
      reason: Not Modified
      headers:
        fields:
        - [ Cache-Control, "private, max-age=1" ]
        - [ ETag, 'W/"w1"' ]

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: 'W/"w1"', as: equal } ]

  #############################################################################
  # Preconditions on unsafe methods reach the origin untouched, so a matching
  # If-None-Match still prevents the operation.
  #############################################################################
  - client-request:
      method: "POST"
      version: "1.1"
      url: /private-post
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ If-None-Match, 'W/"p1"' ]
        - [ Content-Length, 0 ]
        - [ uuid, post-conditional ]

    proxy-request:
      headers:
        fields:
        - [ If-None-Match, { value: 'W/"p1"', as: equal } ]

    server-response:
      status: 412
      reason: Precondition Failed
      headers:
        fields:
        - [ Content-Length, 0 ]

    proxy-response:
      status: 412

  #############################################################################
  # A response the plugin wouldn't compress keeps the origin's strong tag on
  # its 304, even when the client sends a weak validator.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /private-image
      headers:
        fields:
        - [ Host, compress.example ]
        - [ Accept-Encoding, gzip ]
        - [ If-None-Match, 'W/"i1"' ]
        - [ uuid, private-image-conditional ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, image/png ]
        - [ Cache-Control, "private, max-age=1" ]
        - [ ETag, '"i1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: '"i1"', as: equal } ]

  #############################################################################
  # cache false stores the identity copy with the origin's strong tag. A fresh
  # conditional hit from a client that would get the compressed 200 gets the
  # weak tag, whichever form of the validator it sent.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /cache-false
      headers:
        fields:
        - [ Host, uncached.example ]
        - [ Accept-Encoding, gzip ]
        - [ uuid, cache-false-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=3600" ]
        - [ ETag, '"c1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Encoding, { value: gzip, as: equal } ]
        - [ ETag, { value: 'W/"c1"', as: equal } ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /cache-false
      headers:
        fields:
        - [ Host, uncached.example ]
        - [ Accept-Encoding, gzip ]
        - [ If-None-Match, 'W/"c1"' ]
        - [ uuid, cache-false-conditional ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: 'W/"c1"', as: equal } ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /cache-false
      headers:
        fields:
        - [ Host, uncached.example ]
        - [ Accept-Encoding, gzip ]
        - [ If-None-Match, '"c1"' ]
        - [ uuid, cache-false-strong-conditional ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: 'W/"c1"', as: equal } ]

  #############################################################################
  # A client that doesn't accept compression holds the identity copy, so its
  # 304 keeps the origin's strong tag.
  #############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /private
      headers:
        fields:
        - [ Host, compress.example ]
        - [ If-None-Match, 'W/"p1"' ]
        - [ uuid, private-identity-conditional ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "private, max-age=1" ]
        - [ ETag, '"p1"' ]
        - [ Content-Length, 1024 ]
      <<: *compressible-body

    proxy-response:
      status: 304
      headers:
        fields:
        - [ ETag, { value: '"p1"', as: equal } ]
