meta:
  version: "1.0"

sessions:
  - transactions:
      - client-request:
          method: "GET"
          url: &global_path "/global"
          version: "1.1"
          headers:
            fields:
              - [Host, example.com]
              - [&global_request_probe "@Client-Test", spoofed-value]
              - [X-Normal, keep-me]
              - [uuid, at-header-global-client]

        proxy-request:
          method: "GET"
          url: *global_path
          headers:
            fields:
              - [*global_request_probe, {as: absent}]
              - [&request_added "@Plugin-Request", {as: absent}]
              - [X-Normal, {value: keep-me, as: equal}]

        server-response:
          status: 200
          reason: "OK"
          headers:
            fields:
              - [&response_probe "@Origin-Test", spoofed-response]
              - [Content-Length, "0"]

        proxy-response:
          status: 200
          headers:
            fields:
              - [*response_probe, {as: absent}]
              - [&response_added "@Plugin-Response", {as: absent}]
              - [&client_stripped_header X-Client-At-Headers-Stripped, {value: "1", as: equal}]
              - [&origin_stripped_header X-Origin-At-Headers-Stripped, {value: "1", as: equal}]

      - client-request:
          method: "GET"
          url: &remap_path "/remap"
          version: "1.1"
          headers:
            fields:
              - [Host, example.com]
              - [&remap_request_probe "@Client-Remap-Test", spoofed-value]
              - [X-Normal, keep-me]
              - [uuid, at-header-remap-client]

        proxy-request:
          method: "GET"
          url: *remap_path
          headers:
            fields:
              - [*remap_request_probe, {as: absent}]
              - [*request_added, {as: absent}]
              - [X-Normal, {value: keep-me, as: equal}]

        server-response:
          status: 200
          reason: "OK"
          headers:
            fields:
              - [*response_probe, spoofed-remap-response]
              - [Content-Length, "0"]

        proxy-response:
          status: 200
          headers:
            fields:
              - [*response_probe, {as: absent}]
              - [*response_added, {as: absent}]
              - [*client_stripped_header, {value: "2", as: equal}]
              - [*origin_stripped_header, {value: "2", as: equal}]
