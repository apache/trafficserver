meta:
  version: "1.0"

autest:
  description: 'Verify ip_allow.yaml can deny the QUERY method'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'ip_allow'
    ip_allow_yaml:
      ip_allow:
        - apply: in
          ip_addrs: 0/0
          action: deny
          methods:
            - QUERY
        - apply: in
          ip_addrs: "::/0"
          action: deny
          methods:
            - QUERY
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
- transactions:

  # QUERY is denied by ip_allow, so it never reaches the origin.
  - client-request:
      method: QUERY
      url: /denied
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Content-Type, application/sql]
        - [Content-Length, "8"]
        - [uuid, ip-allow-denied]
      content:
        data: "select-a"

    proxy-request:
      expect: absent

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 403

  # Methods other than QUERY are unaffected.
  - client-request:
      method: GET
      url: /allowed
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, ip-allow-permitted]

    proxy-request:
      method: GET

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "2"]
      content:
        data: "ok"

    proxy-response:
      status: 200
