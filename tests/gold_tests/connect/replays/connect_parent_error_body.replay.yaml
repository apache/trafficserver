#
# ATS sends these requests to a parent proxy. The CONNECT error response has a
# body and keeps the parent connection alive. ATS must consume that body before
# reusing the parent connection for the follow-up request.
#
meta:
  version: '1.0'

sessions:
- transactions:
  - client-request:
      method: CONNECT
      version: '1.1'
      url: www.example.com:443
      headers:
        fields:
        - [ Host, www.example.com:443 ]
        - [ Proxy-Connection, keep-alive ]
        - [ uuid, connect-error ]

    server-response:
      status: 403
      reason: Forbidden
      headers:
        fields:
        - [ Content-Length, 18 ]
        - [ Connection, keep-alive ]
      content:
        encoding: plain
        data: "connect forbidden\n"

    proxy-response:
      status: 403
      content:
        encoding: plain
        data: "connect forbidden\n"
        verify: { as: equal }

  - client-request:
      delay: 100ms
      method: GET
      version: '1.1'
      url: http://www.example.com/next
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Proxy-Connection, close ]
        - [ uuid, follow-up ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 19 ]
        - [ Connection, close ]
      content:
        encoding: plain
        data: "follow-up response\n"

    proxy-response:
      status: 200
      content:
        encoding: plain
        data: "follow-up response\n"
        verify: { as: equal }
