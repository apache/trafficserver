# RFC 9112 requires chunked to be the final transfer coding. Verify that ATS
# rejects requests where chunked is not the last Transfer-Encoding value, and
# handles responses correctly.

meta:
  version: "1.0"

autest:
  description: 'Verify chunked must be the last Transfer-Encoding value'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http'

    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:

# --- Request-side tests ---

# Test 1: chunked is NOT last in request Transfer-Encoding — reject with 501
- transactions:
  - client-request:
      method: POST
      version: '1.1'
      url: /req/chunked-not-last
      headers:
        fields:
        - [Host, example.com]
        - [Transfer-Encoding, "chunked, gzip"]
        - [uuid, req-chunked-not-last]
      content:
        size: 0

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 501

# Test 2: single chunked in request Transfer-Encoding — accept (baseline)
- transactions:
  - client-request:
      method: POST
      version: '1.1'
      url: /req/chunked-only
      headers:
        fields:
        - [Host, example.com]
        - [Transfer-Encoding, chunked]
        - [uuid, req-chunked-only]
      content:
        transfer: chunked
        data: hello

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "2"]
      content:
        encoding: plain
        data: ok

    proxy-response:
      status: 200

# --- Response-side tests ---

# Test 3: chunked is NOT last in response Transfer-Encoding — origin violates RFC 9112.
# ATS should reject with 502 Bad Gateway.
- transactions:
  - client-request:
      method: GET
      version: '1.1'
      url: /resp/chunked-not-last
      headers:
        fields:
        - [Host, example.com]
        - [uuid, resp-chunked-not-last]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Transfer-Encoding, "chunked, gzip"]
        - [Connection, close]
      content:
        size: 16

    proxy-response:
      status: 502

# Test 4: single chunked in response Transfer-Encoding — baseline
- transactions:
  - client-request:
      method: GET
      version: '1.1'
      url: /resp/chunked-only
      headers:
        fields:
        - [Host, example.com]
        - [uuid, resp-chunked-only]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Transfer-Encoding, chunked]
        - [Connection, keep-alive]
      content:
        size: 16

    proxy-response:
      status: 200
      content:
        size: 16

# --- Duplicate field tests ---

# Test 5: chunked followed by gzip in separate request Transfer-Encoding fields
- transactions:
  - client-request:
      method: POST
      version: '1.1'
      url: /req/chunked-dup-not-last
      headers:
        fields:
        - [Host, example.com]
        - [Transfer-Encoding, chunked]
        - [Transfer-Encoding, gzip]
        - [uuid, req-chunked-dup-not-last]
      content:
        size: 0

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 501

# Test 6: chunked followed by gzip in separate response Transfer-Encoding fields
- transactions:
  - client-request:
      method: GET
      version: '1.1'
      url: /resp/chunked-dup-not-last
      headers:
        fields:
        - [Host, example.com]
        - [uuid, resp-chunked-dup-not-last]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Transfer-Encoding, chunked]
        - [Transfer-Encoding, gzip]
        - [Connection, close]
      content:
        size: 16

    proxy-response:
      status: 502
