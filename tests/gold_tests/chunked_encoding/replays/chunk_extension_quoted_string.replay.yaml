# Origin-side replay. The verifier server parses chunked requests correctly and
# serves the legitimate POST with 200, keeping the connection alive. If the proxy
# ever forwards the embedded GET /second (the smuggle), the server answers it with
# a distinctive body so the client side can detect it.

meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: "POST"
      version: "1.1"
      url: /
      headers:
        fields:
        - [ Host, localhost ]
        - [ uuid, 1 ]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 2 ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /second
      headers:
        fields:
        - [ Host, localhost ]
        - [ uuid, 2 ]
    server-response:
      status: 200
      reason: OK
      content:
        data: "SECOND-ENDPOINT"
      headers:
        fields:
        - [ Content-Length, 15 ]
