# Deny the cache write lock to any request carrying X-Fail-Cache-Write. With no
# write retries left, HttpCacheSM::open_write() reports the write failure
# without going to the cache at all, which makes the write lock loss
# deterministic instead of dependent upon a race between two transactions.
cond %{REMAP_PSEUDO_HOOK}
cond %{CLIENT-HEADER:X-Fail-Cache-Write} =1
set-config proxy.config.http.cache.max_open_write_retries 0 [L]
