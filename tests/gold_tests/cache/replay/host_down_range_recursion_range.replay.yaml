#
# Phase 2: after the origin host has been marked DOWN, send an out-of-order
# multi-range request against the cached resource. The Range parser marks
# this as NOT_HANDLED, so the cache cannot satisfy the request and ATS must
# fall back to the origin; with the host DOWN it should return 502 Bad
# Gateway. This is a regression test for an unbounded recursion between
# build_response_from_cache, CallOSDNSLookup, and
# handle_server_connection_not_open that crashed the proxy via stack
# overflow.
#
meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: GET
      version: "1.1"
      url: /cached
      headers:
        fields:
        - [ Host, backend.example.com ]
        - [ uuid, range-down ]
        # Out-of-order multi-range: second range starts before first ends.
        - [ Range, "bytes=5-9,0-4" ]
    proxy-request:
      # Host is DOWN; ATS must not forward this to origin.
      expect: absent
    server-response:
      # Unused; included because replay format requires it.
      status: 500
      reason: "Internal Server Error"
    proxy-response:
      # Cache cannot satisfy the range and the host is DOWN, so ATS returns
      # 502 Bad Gateway rather than re-entering the cache fallback path.
      status: 502
