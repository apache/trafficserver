meta:
  version: "1.0"

autest:
  description: 'Verify exact URL cache.config matching'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'cache_control|matcher'
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
    cache_config:
      - "url=http://127.0.0.1:{SERVER_HTTP_PORT}/exact action=never-cache"

sessions:
- transactions:
  - client-request:
      method: GET
      url: /exact
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, exact-first]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "0"]
        - [Cache-Control, "max-age=300"]

    proxy-response:
      status: 200

  - client-request:
      delay: 100ms
      method: GET
      url: /exact
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, exact-second]

    server-response:
      status: 201
      reason: Created
      headers:
        fields:
        - [Content-Length, "0"]
        - [Cache-Control, "max-age=300"]

    proxy-response:
      status: 201

  - client-request:
      method: GET
      url: /other
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, other-first]

    server-response:
      status: 202
      reason: Accepted
      headers:
        fields:
        - [Content-Length, "0"]
        - [Cache-Control, "max-age=300"]

    proxy-response:
      status: 202

  - client-request:
      delay: 100ms
      method: GET
      url: /other
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, other-second]

    proxy-request:
      expect: absent

    server-response:
      status: 404
      reason: Not Found
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 202
