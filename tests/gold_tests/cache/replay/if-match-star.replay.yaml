meta:
  version: "1.0"

  blocks:
  # Served if a request that should be answered from cache reaches the origin.
  - unexpected-origin-response: &unexpected-origin-response
      status: 500
      reason: Unexpected
      headers:
        fields:
        - [ Content-Length, 0 ]

autest:
  description: 'Verify If-Match: * matches cached and origin responses whatever their ETag'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'

    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
- transactions:

  ##############################################################################
  # If-Match: * matches any current representation (RFC 9110 13.1.1), even one
  # with a weak ETag, which can never match a specific tag strongly.
  ##############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, weak-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=3600" ]
        - [ ETag, 'W/"w1"' ]
        - [ Content-Length, 10 ]
      content:
        encoding: plain
        size: 10

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '*' ]
        - [ uuid, weak-if-match-star ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '"other", *' ]
        - [ uuid, weak-if-match-list-star ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, 'W/"w1"' ]
        - [ uuid, weak-if-match-weak ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 412

  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '"w1"' ]
        - [ uuid, weak-if-match-strong ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 412

  ##############################################################################
  # A strong ETag matches * and itself.
  ##############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, strong-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=3600" ]
        - [ ETag, '"s1"' ]
        - [ Content-Length, 10 ]
      content:
        encoding: plain
        size: 10

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '*' ]
        - [ uuid, strong-if-match-star ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '"s1"' ]
        - [ uuid, strong-if-match-same ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '"other"' ]
        - [ uuid, strong-if-match-other ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 412

  ##############################################################################
  # A response without an ETag still has a current representation for * to match.
  ##############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /no-etag
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, no-etag-fill ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "public, max-age=3600" ]
        - [ Content-Length, 10 ]
      content:
        encoding: plain
        size: 10

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /no-etag
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '*' ]
        - [ uuid, no-etag-if-match-star ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /no-etag
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '"other"' ]
        - [ uuid, no-etag-if-match-tag ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 412

  ##############################################################################
  # With nothing stored, ATS evaluates the condition against the origin's 200.
  ##############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /private-weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, '*' ]
        - [ uuid, uncached-weak-if-match-star ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "private" ]
        - [ ETag, 'W/"p1"' ]
        - [ Content-Length, 10 ]
      content:
        encoding: plain
        size: 10

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /private-weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ If-Match, 'W/"p1"' ]
        - [ uuid, uncached-weak-if-match-tag ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, text/plain ]
        - [ Cache-Control, "private" ]
        - [ ETag, 'W/"p1"' ]
        - [ Content-Length, 10 ]
      content:
        encoding: plain
        size: 10

    proxy-response:
      status: 412

  ##############################################################################
  # If-Range is unaffected: a weak validator never satisfies it.
  ##############################################################################
  - client-request:
      method: "GET"
      version: "1.1"
      url: /weak
      headers:
        fields:
        - [ Host, example.com ]
        - [ Range, bytes=0-4 ]
        - [ If-Range, 'W/"w1"' ]
        - [ uuid, weak-if-range ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Range, { as: absent } ]

  - client-request:
      method: "GET"
      version: "1.1"
      url: /strong
      headers:
        fields:
        - [ Host, example.com ]
        - [ Range, bytes=0-4 ]
        - [ If-Range, '"s1"' ]
        - [ uuid, strong-if-range ]

    server-response:
      <<: *unexpected-origin-response

    proxy-response:
      status: 206
      headers:
        fields:
        - [ Content-Range, { as: present } ]

