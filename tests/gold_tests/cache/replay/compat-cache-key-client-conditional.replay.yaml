#
# A compatibility-key object cannot consume a 304, so it has to be revalidated
# with no conditional headers at all. build_request() already removes the
# client's conditionals for a request it expects to cache, but it deliberately
# forwards them in two cases: when the request does not look cacheable, and when
# proxy.config.http.cache.when_to_revalidate is 4. In those the origin could
# still answer 304, so issue_revalidate() drops them for itself.
#
# This exercises the when_to_revalidate case, which is a global switch and so
# needs a TS of its own rather than sharing one with compat-cache-key.
#
# As in compat-cache-key.replay.yaml, "/cc;" addresses the same key ATS 9.2
# produced for "/cc", which is how a legacy object gets into the cache.
#

meta:
  version: "1.0"

autest:
  description: 'Verify a compatibility hit strips client-supplied conditional headers'

  dns:
    name: 'dns-compat-cache-key-client-conditional'

  server:
    name: 'proxy-verifier-server'

  client:
    name: 'proxy-verifier-client'

  ats:
    name: 'ts-for-proxy-verifier'
    process_config:
      enable_cache: true

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http|http_cache'
      proxy.config.http.insert_age_in_response: 0
      proxy.config.http.cache.try_compat_key_read: 1
      # Forward the client's conditionals rather than stripping them.
      proxy.config.http.cache.when_to_revalidate: 4

    remap_config:
      - from: "http://example.com/"
        to: "http://backend.example.com:{SERVER_HTTP_PORT}/"

    metric_checks:
      # One compatibility hit: the stale revalidation in test 2.
      - metric: proxy.process.http.cache.compat_key_reads
        value: 1

sessions:
- transactions:

  #
  # Test 1: Prime the cache under the legacy key.
  #
  - client-request:
      method: "GET"
      version: "1.1"
      scheme: "http"
      url: /cc;
      headers:
        fields:
        - [ uuid, 1-prime-legacy-key ]
        - [ Host, example.com ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 16 ]
        - [ Cache-Control, max-age=300 ]
        - [ ETag, '"legacy-object"' ]

    proxy-response:
      status: 200

  #
  # Test 2: The client's own conditional is stripped for the migration.
  #
  # The object is stale, so this is a compatibility hit that revalidates. The
  # client sent an ETag of its own and when_to_revalidate 4 would forward it,
  # which would let the origin answer 304 -- a response this transaction cannot
  # apply to a legacy-key object.
  #
  - client-request:
      method: "GET"
      version: "1.1"
      scheme: "http"
      url: /cc
      headers:
        fields:
        - [ uuid, 2-client-conditional-stripped ]
        - [ Host, example.com ]
        - [ If-None-Match, '"something-the-client-has"' ]
        # when_to_revalidate 4 is "stale if IMS", so this both forces the
        # revalidation and supplies a second conditional to be stripped. No
        # waiting for the object to age out.
        - [ If-Modified-Since, 'Tue, 01 Jan 2030 00:00:00 GMT' ]
      delay: 100ms

    proxy-request:
      headers:
        fields:
        - [ If-None-Match, { as: absent } ]
        - [ If-Modified-Since, { as: absent } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 16 ]
        - [ Cache-Control, max-age=300 ]
        - [ ETag, '"migrated-object"' ]

    proxy-response:
      status: 200

  #
  # Test 3: The object really did migrate to the current key.
  #
  # Had the origin been allowed to answer 304, the write would have been
  # aborted and this would go back to the origin instead.
  #
  - client-request:
      method: "GET"
      version: "1.1"
      scheme: "http"
      url: /cc
      headers:
        fields:
        - [ uuid, 3-migrated-to-current-key ]
        - [ Host, example.com ]
      delay: 100ms

    proxy-request:
      expect: absent

    server-response:
      status: 400
      reason: "Bad Request"
      headers:
        fields:
        - [ Content-Length, 0 ]

    proxy-response:
      status: 200
