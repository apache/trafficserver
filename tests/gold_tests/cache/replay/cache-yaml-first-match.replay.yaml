meta:
  version: "1.0"

autest:
  description: 'Verify cache.yaml applies only the first matching rule'

  dns:
    name: 'dns'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'cache_control|http|cache'
      proxy.config.http.cache.required_headers: 0
      proxy.config.http.insert_age_in_response: 0

    cache_yaml:
      cache:
        - match:
            dest_domain: backend.example.com
            suffix: php
          action:
            cache: standard
        - match:
            dest_domain: backend.example.com
          action:
            ignore_server_no_cache: true

    remap_config:
      - from: "http://example.com/"
        to: "http://backend.example.com:{SERVER_HTTP_PORT}/"

sessions:
  - transactions:
      # Both rules match PHP requests. YAML applies only standard-cache from
      # the first rule, so the origin no-store response is not cached.
      - client-request:
          method: GET
          url: /object.php
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, php-1]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, "0"]
              - [Cache-Control, "no-store"]
        proxy-response:
          status: 200

      - client-request:
          delay: 100ms
          method: GET
          url: /object.php
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, php-2]
        proxy-request:
          headers:
            fields:
              - [uuid, {value: php-2, as: equal}]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, "0"]
              - [Cache-Control, "no-store"]
        proxy-response:
          status: 200

      # Only the general ignore-server-no-cache rule matches CSS requests, so
      # its origin no-store response is cached.
      - client-request:
          method: GET
          url: /object.css
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, css-1]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, "0"]
              - [Cache-Control, "no-store"]
        proxy-response:
          status: 200

      - client-request:
          delay: 100ms
          method: GET
          url: /object.css
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, css-2]
        proxy-request:
          expect: absent
        server-response:
          status: 404
          reason: Not Found
        proxy-response:
          status: 200
