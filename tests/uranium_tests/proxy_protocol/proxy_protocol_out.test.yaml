meta:
  version: "1.0"

urtest:
  description: "Verify outgoing Proxy Protocol for HTTP, TLS, and blind tunnels"
  replay: replay/proxy_protocol_out.replay.yaml
  dns: {name: proxy-protocol-dns, process_config: {default: 127.0.0.1}}
  server: {name: proxy-protocol-origin}
  client: {name: proxy-protocol-client}
  ats:
    name: proxy-protocol-ts
    process_config: {enable_tls: true, enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http|proxyprotocol
      proxy.config.http.proxy_protocol_out: -1
      proxy.config.ssl.client.verify.server.policy: PERMISSIVE
    remap_config:
      - "map / http://backend.pp.origin.com:{SERVER_HTTP_PORT}/"

  variants:
    - name: none-http-origin
      server:
        log_validation:
          contains: [{expression: "No valid PROXY header found"}]

    - name: v1-http-origin
      server: &v1_server
        log_validation:
          contains:
            - {expression: 'PROXY TCP4 127\.0\.0\.1 127\.0\.0\.1 \d+ \d+'}
            - {expression: "Received PROXY header v1"}
      ats: {records_config: {proxy.config.http.proxy_protocol_out: 1}}

    - name: v2-http-origin
      server: &v2_server
        log_validation:
          contains:
            - {expression: 'PROXY TCP4 127\.0\.0\.1 127\.0\.0\.1 \d+ \d+'}
            - {expression: "Received PROXY header v2"}
      ats: {records_config: {proxy.config.http.proxy_protocol_out: 2}}

    - name: none-https-origin
      server:
        log_validation:
          contains: [{expression: "No valid PROXY header found"}]
      ats:
        remap_config:
          - "map / https://backend.pp.origin.com:{SERVER_HTTPS_PORT}/"

    - name: v1-https-origin
      server: *v1_server
      ats:
        records_config: {proxy.config.http.proxy_protocol_out: 1}
        remap_config:
          - "map / https://backend.pp.origin.com:{SERVER_HTTPS_PORT}/"

    - name: v2-https-origin
      server: *v2_server
      ats:
        records_config: {proxy.config.http.proxy_protocol_out: 2}
        remap_config:
          - "map / https://backend.pp.origin.com:{SERVER_HTTPS_PORT}/"

    - name: v1-tunnel
      server: *v1_server
      ats:
        records_config:
          proxy.config.http.proxy_protocol_out: 1
          proxy.config.http.connect_ports: "{SERVER_HTTPS_PORT}"
        ip_allow_yaml: &allow_connect
          ip_allow:
            - {apply: in, ip_addrs: 0/0, action: allow, methods: [CONNECT]}
            - {apply: in, ip_addrs: "::/0", action: allow, methods: [CONNECT]}
        sni_yaml:
          sni:
            - fqdn: pp.origin.com
              tunnel_route: "backend.pp.origin.com:{SERVER_HTTPS_PORT}"
        log_validation:
          traffic_out:
            contains: [{expression: "CONNECT tunnel://backend.pp.origin.com"}]

    - name: v2-tunnel
      server: *v2_server
      ats:
        records_config:
          proxy.config.http.proxy_protocol_out: 2
          proxy.config.http.connect_ports: "{SERVER_HTTPS_PORT}"
        ip_allow_yaml: *allow_connect
        sni_yaml:
          sni:
            - fqdn: pp.origin.com
              tunnel_route: "backend.pp.origin.com:{SERVER_HTTPS_PORT}"
        log_validation:
          traffic_out:
            contains: [{expression: "CONNECT tunnel://backend.pp.origin.com"}]
