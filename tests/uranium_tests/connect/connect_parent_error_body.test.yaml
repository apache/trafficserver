urtest:
  description: "Verify CONNECT error response bodies from parent proxies"
  replay: "replays/connect_parent_error_body.replay.yaml"
  server:
    name: "connect-parent"
    log_validation:
      contains:
        - expression: "CONNECT www.example.com:443 HTTP/1.1"
          description: "ATS must forward CONNECT to the parent"
        - expression: "GET http://www.example.com/next HTTP/1.1"
          description: "ATS must reuse the parent connection"
        - expression: "GET http://other.example.org/page HTTP/1.1"
          description: "ATS must forward the different host on the same session"
  client:
    name: "connect-parent-client"
  ats:
    name: "connect-parent-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|parent"
      proxy.config.http.connect_ports: "443"
      proxy.config.http.no_dns_just_forward_to_parent: 1
      proxy.config.http.parent_proxy.self_detect: 0
      proxy.config.http.server_session_sharing.pool: "global"
      proxy.config.url_remap.remap_required: 0
    parent_config:
      - 'dest_domain=. parent="127.0.0.1:{SERVER_HTTP_PORT}|1" go_direct=false parent_is_proxy=true'
    ip_allow_yaml:
      ip_allow:
        - apply: in
          ip_addrs: ["127.0.0.1", "::1"]
          action: allow
          methods: ALL
        - apply: out
          ip_addrs: "0/0"
          action: allow
          methods: [CONNECT, GET]
