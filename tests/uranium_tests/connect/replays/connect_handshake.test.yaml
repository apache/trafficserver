meta:
  version: '1.0'

sessions:
  - transactions:
      - client-request:
          method: CONNECT
          version: '1.1'
          url: 127.0.0.1:{UNUSED_PORT}
          headers:
            fields:
              - [Host, '127.0.0.1:{UNUSED_PORT}']
              - [uuid, connect-refused]

        # ATS must report the refused origin connection rather than claim the
        # tunnel was established.
        proxy-response:
          status: 502

urtest:
  description: Verify CONNECT waits for the origin TCP handshake
  template_replay: true
  server: {enabled: false}
  dns: {name: connect-handshake-dns, process_config: {default: 127.0.0.1}}
  client: {name: connect-handshake-client}
  ats:
    name: connect-handshake-ts
    process_config: {enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http|iocore_net
      proxy.config.http.connect_ports: '{UNUSED_PORT}'
    ip_allow_yaml:
      ip_allow:
      - apply: in
        ip_addrs: [127.0.0.1, '::1']
        action: allow
        methods: ALL
      - apply: out
        ip_addrs: 0/0
        action: allow
        methods: CONNECT
    remap_config:
    - map / http://127.0.0.1:{UNUSED_PORT}
