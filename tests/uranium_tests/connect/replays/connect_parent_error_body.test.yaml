#
# ATS sends these requests to a parent proxy. The CONNECT error response has a
# body and keeps the parent connection alive. ATS must consume that body before
# reusing the parent connection for the follow-up request.
#
meta:
  version: '1.0'

urtest:
  description: "Verify CONNECT error response bodies from parent proxies"
  server:
    name: "connect-parent"
    log_validation:
      contains:
        - expression: "CONNECT www.example.com:443 HTTP/1.1"
          description: "ATS must forward CONNECT to the parent"
        - expression: "GET http://www.example.com/next HTTP/1.1"
          description: "ATS must reuse the parent connection"
        - expression: "GET http://other.example.org/page HTTP/1.1"
          description: "ATS must forward the different host on the same session"
  client:
    name: "connect-parent-client"
  ats:
    name: "connect-parent-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|parent"
      proxy.config.http.connect_ports: "443"
      proxy.config.http.no_dns_just_forward_to_parent: 1
      proxy.config.http.parent_proxy.self_detect: 0
      proxy.config.http.server_session_sharing.pool: "global"
      proxy.config.url_remap.remap_required: 0
    parent_config:
      - 'dest_domain=. parent="127.0.0.1:{SERVER_HTTP_PORT}|1" go_direct=false parent_is_proxy=true'
    ip_allow_yaml:
      ip_allow:
        - apply: in
          ip_addrs: ["127.0.0.1", "::1"]
          action: allow
          methods: ALL
        - apply: out
          ip_addrs: "0/0"
          action: allow
          methods: [CONNECT, GET]


sessions:
- transactions:
  - client-request:
      method: CONNECT
      version: '1.1'
      url: www.example.com:443
      headers:
        fields:
        - [ Host, www.example.com:443 ]
        - [ Proxy-Connection, keep-alive ]
        - [ uuid, connect-error ]

    server-response:
      status: 403
      reason: Forbidden
      headers:
        fields:
        - [ Content-Length, 18 ]
        - [ Connection, keep-alive ]
      content:
        encoding: plain
        data: "connect forbidden\n"

    proxy-response:
      status: 403
      content:
        encoding: plain
        data: "connect forbidden\n"
        verify: { as: equal }

  - client-request:
      delay: 100ms
      method: GET
      version: '1.1'
      url: http://www.example.com/next
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Proxy-Connection, keep-alive ]
        - [ uuid, follow-up ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 19 ]
        - [ Connection, keep-alive ]
      content:
        encoding: plain
        data: "follow-up response\n"

    proxy-response:
      status: 200
      content:
        encoding: plain
        data: "follow-up response\n"
        verify: { as: equal }

  # Third transaction with a different host. Each no-DNS-forward request
  # must reach the parent for that request's host. If a stale dns_info.addr
  # from an earlier transaction were reused, this request would either
  # short-circuit to the wrong destination or fail to reach the parent.
  - client-request:
      delay: 100ms
      method: GET
      version: '1.1'
      url: http://other.example.org/page
      headers:
        fields:
        - [ Host, other.example.org ]
        - [ Proxy-Connection, close ]
        - [ uuid, third-host ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 20 ]
        - [ Connection, close ]
      content:
        encoding: plain
        data: "third host response\n"

    proxy-response:
      status: 200
      content:
        encoding: plain
        data: "third host response\n"
        verify: { as: equal }
