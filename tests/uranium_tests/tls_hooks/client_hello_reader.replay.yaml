# The origin side of test_tls_client_hello_reader.py: the request must carry
# the JA4 fingerprint that jax_fingerprint computed from the ClientHello.

meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: GET
      version: "1.1"
      url: /
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, client-hello-reader ]

    proxy-request:
      headers:
        fields:
        - [ uuid, { value: client-hello-reader, as: equal } ]
        - [ x-jax, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ Connection, close ]

    proxy-response:
      status: 200
