meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: GET
      url: /
      version: "1.1"
      headers:
        fields:
        - [Host, www.example.com]
        # curl strips leading whitespace from its -H argument before sending.
        - [foo, bar]
        - [uuid, leading-space]
    server-response: &success_response
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
    proxy-response: {status: 200}

  - client-request:
      method: GET
      url: /
      version: "1.1"
      headers:
        fields:
        - [Host, www.example.com]
        - ['foo ', bar]
        - [uuid, one-space]
    server-response: *success_response
    proxy-response: {status: 400}

  - client-request:
      method: GET
      url: /
      version: "1.1"
      headers:
        fields:
        - [Host, www.example.com]
        - ['foo  ', bar]
        - [uuid, two-spaces]
    server-response: *success_response
    proxy-response: {status: 400}

  - client-request:
      method: POST
      url: /
      version: "1.1"
      headers:
        fields:
        - [Host, www.example.com]
        - [Content-Length, 11]
        - [Content-Length, 10]
        - [Content-Length, 9]
        - [uuid, conflicting-content-length]
      content:
        encoding: plain
        data: hello world
    server-response: *success_response
    proxy-response: {status: 400}

  - client-request:
      method: POST
      url: /
      version: "1.1"
      headers:
        fields:
        - [Host, www.example.com]
        - [Content-Length, 11]
        - [Content-Length, 11]
        - [Content-Length, 11]
        - [uuid, identical-content-length]
      content:
        encoding: plain
        data: hello world
    server-response: *success_response
    proxy-response: {status: 200}

  - client-request:
      method: POST
      url: /
      version: "1.1"
      headers:
        fields:
        - [Host, www.example.com]
        - [Transfer-Encoding, chunked]
        - [Content-Length, 11]
        - [Content-Length, 10]
        - [Content-Length, 9]
        - [uuid, chunked-overrides-content-length]
      content:
        encoding: plain
        data: hello world
    server-response: *success_response
    proxy-response: {status: 200}

urtest:
  description: Verify whitespace and duplicate Content-Length header syntax
  server: {name: syntax-origin}
  client: {name: syntax-client}
  ats:
    name: syntax-ts
    process_config: {enable_cache: false}
    remap_config:
    - map http://www.example.com http://127.0.0.1:{SERVER_HTTP_PORT}
