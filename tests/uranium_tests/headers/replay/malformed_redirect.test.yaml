meta:
  version: "1.0"

urtest:
  description: 'Verify a response the proxy cannot parse is refused whatever status it claims.'

  server:
    name: 'server'

  client:
    name: 'client'
    # Every transaction here is verified, and a violation is what a regression
    # looks like, so the client must come back clean.
    return_code: 0
    # The client logs the response headers as it received them. A Content-Length
    # absence rule cannot express this, because the proxy's own error page
    # carries one; what must never appear is the length the origin hid. The
    # other hidden fields are checked with absence rules below, which do not
    # need this because no legitimate response here carries them.
    log_validation:
      excludes:
        - expression: '[Cc]ontent-[Ll]ength: 11'
          description: 'The hidden origin Content-Length must never reach the client.'

  ats:
    name: 'ts'
    process_config:
      enable_cache: false

    records_config:
      # Small enough that one filler field passes it, so the oversized case
      # below can show the limit is applied to a redirect like anything else.
      proxy.config.http.response_header_max_size: 2048

    remap_config:
      - from: "http://www.example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:

  # Two Content-Length values that disagree, with no Transfer-Encoding.
  # The body boundary is ambiguous, so the next recipient is free to end
  # the body somewhere else than the proxy did.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /conflicting-cl-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, conflicting-cl-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5" ]
        - [ Content-Length, "11" ]
      content:
        encoding: plain
        data: "hello world"
    proxy-response:
      status: 502
      headers:
        fields:
        - [ Location, { as: absent } ]

  # The same ambiguous framing on a status code that was never given
  # special treatment. This is the control for the ordinary path.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /conflicting-cl-200
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, conflicting-cl-200 ]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, "5" ]
        - [ Content-Length, "11" ]
      content:
        encoding: plain
        data: "hello world"
    proxy-response:
      status: 502

  # A single Content-Length that is not a number, which leaves the body
  # boundary ambiguous for the same reason.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /non-numeric-cl-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, non-numeric-cl-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5abc" ]
      content:
        encoding: plain
        data: "hello"
    proxy-response:
      status: 502
      headers:
        fields:
        - [ Location, { as: absent } ]

  # The header block is rejected part way through, so the bytes after the
  # bad field are not header to the proxy. Relaying this hands the client
  # some prefix of the remaining header text as the body.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /bad-field-name-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, bad-field-name-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5" ]
        - [ "X-Bad(Name", "value" ]
        - [ Connection, "close" ]
      content:
        encoding: plain
        data: "hello"
    proxy-response:
      status: 502
      headers:
        fields:
        - [ Location, { as: absent } ]

  # A second, disagreeing Content-Length hidden behind the bad field.
  # Only the first value survives parsing, so checking the surviving header
  # alone would see nothing wrong while the origin framed eleven bytes.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /bad-field-between-cl-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, bad-field-between-cl-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5" ]
        - [ "X-Bad(Name", "value" ]
        - [ Content-Length, "11" ]
      content:
        encoding: plain
        data: "hello world"
    proxy-response:
      status: 502
      headers:
        fields:
        - [ Location, { as: absent } ]

  # A Transfer-Encoding hidden behind the bad field. The origin frames the
  # body with chunked encoding while the surviving header claims five bytes.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /bad-field-before-te-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, bad-field-before-te-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5" ]
        - [ "X-Bad(Name", "value" ]
        - [ Transfer-Encoding, "chunked" ]
      content:
        encoding: plain
        data: "hello world"
    proxy-response:
      status: 502
      headers:
        fields:
        - [ Location, { as: absent } ]
        - [ Transfer-Encoding, { as: absent } ]

  # The same header bytes as the 302 above apart from the status line. The
  # status code used to decide whether a broken response was relayed, so
  # this pins that the two are now treated alike.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /bad-field-name-301
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, bad-field-name-301 ]
    server-response:
      status: 301
      reason: Moved Permanently
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5" ]
        - [ "X-Bad(Name", "value" ]
        - [ Connection, "close" ]
      content:
        encoding: plain
        data: "hello"
    proxy-response:
      status: 502
      headers:
        fields:
        - [ Location, { as: absent } ]

  # A header block past the configured limit. The limit is a deliberate
  # refusal, so being a redirect must not buy a way around it.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /oversized-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, oversized-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ X-Filler, "" ]
        - [ Content-Length, "0" ]
    proxy-response:
      status: 502
      headers:
        fields:
        - [ X-Filler, { as: absent } ]

  # A redirect with nothing wrong with it, which parses and is relayed.
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /well-formed-302
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ uuid, well-formed-302 ]
    server-response:
      status: 302
      reason: Found
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere" ]
        - [ Content-Length, "5" ]
      content:
        encoding: plain
        data: "hello"
    proxy-response:
      status: 302
      headers:
        fields:
        - [ Location, "http://www.example.com/elsewhere", equal ]
