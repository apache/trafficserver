meta:
  version: "1.0"

urtest:
  description: "Verify ttl-in-cache does not extend a negative response beyond negative_caching_lifetime"

  dns:
    name: "negative-caching-ttl-dns"

  server:
    name: "negative-caching-ttl-origin"

  client:
    name: "negative-caching-ttl-client"

  ats:
    name: "negative-caching-ttl-ts"
    process_config:
      enable_cache: true

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http
      proxy.config.http.insert_age_in_response: 0
      proxy.config.http.negative_caching_enabled: 1
      proxy.config.http.negative_caching_lifetime: 2

    cache_config:
      - "dest_domain=backend.example.com ttl-in-cache=30d"

    remap_config:
      - from: "/"
        to: "http://backend.example.com:{SERVER_HTTP_PORT}/"

sessions:
  - transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /path/404
          headers:
            fields:
              - [Host, example.com]
              - [uuid, cache-negative-response-with-ttl]

        server-response:
          status: 404
          reason: "Not Found"
          headers:
            fields:
              - [Content-Length, 8]

        proxy-response:
          status: 404

      - client-request:
          delay: 100ms
          method: GET
          version: "1.1"
          url: /path/404
          headers:
            fields:
              - [Host, example.com]
              - [uuid, verify-negative-cache-hit-with-ttl]

        proxy-request:
          expect: absent

        server-response:
          status: 500
          reason: "Cached response expected"

        proxy-response:
          status: 404

      - client-request:
          delay: 3s
          method: GET
          version: "1.1"
          url: /path/404
          headers:
            fields:
              - [Host, example.com]
              - [uuid, verify-negative-cache-expired-with-ttl]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 0]

        proxy-response:
          status: 200
