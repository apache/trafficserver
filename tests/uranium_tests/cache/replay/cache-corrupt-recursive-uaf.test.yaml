meta:
  version: "1.0"

urtest:
  description: "Verify recursive corrupt-document reads do not use a freed CacheVC"

  requires:
    ats_features: [TS_HAS_TESTS]

  server:
    name: "corrupt-document-origin"

  client:
    name: "corrupt-document-client"

  ats:
    name: "corrupt-document-ts"
    process_config:
      enable_cache: true

    environment:
      ATS_TEST_FORCE_CORRUPT_DOC: "1"

    records_config:
      proxy.config.http.wait_for_cache: 1
      proxy.config.cache.target_fragment_size: 8192

    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

    log_validation:
      diags_log:
        contains:
          - expression: "Doc magic does not match"
            description: "The forced-corrupt earliest-read path must run"
        excludes:
          - expression: "FATAL:"
            description: "ATS must not crash on the recursive corrupt-document path"

sessions:
  - transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /obj
          headers:
            fields:
              - [Host, example.com]
              - [uuid, populate-corrupt-object]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 65536]
              - [Cache-Control, "max-age=3600"]
          content:
            size: 65536

        proxy-response:
          status: 200

      - client-request:
          delay: 200ms
          method: GET
          version: "1.1"
          url: /obj
          headers:
            fields:
              - [Host, example.com]
              - [uuid, read-corrupt-object]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 65536]
              - [Cache-Control, "max-age=3600"]
          content:
            size: 65536

        proxy-response:
          status: 200
