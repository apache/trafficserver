meta:
  version: "1.0"
  blocks:
    - origin-not-expected: &origin-not-expected
        proxy-request:
          expect: absent
        server-response:
          status: 500
          reason: "Generator remap should handle this request"

urtest:
  description: "Verify wait_for_cache preserves disjoint cache generations during startup"

  server:
    name: "disjoint-wait-for-cache-unused-origin"

  client:
    name: "disjoint-wait-for-cache-client"

  ats:
    name: "disjoint-wait-for-cache-ts"
    process_config:
      enable_cache: true

    records_config:
      proxy.config.body_factory.enable_customizations: 3
      proxy.config.http.cache.generation: -1
      proxy.config.http.wait_for_cache: 3

    plugin_config:
      - "xdebug.so --enable=x-cache,x-cache-key,via,x-cache-generation"

    remap_config:
      - "map /default/ http://127.0.0.1/ @plugin=generator.so"
      - "map /generation1/ http://127.0.0.1/ @plugin=conf_remap.so @pparam=proxy.config.http.cache.generation=1 @plugin=generator.so"
      - "map /generation2/ http://127.0.0.1/ @plugin=conf_remap.so @pparam=proxy.config.http.cache.generation=2 @plugin=generator.so"

sessions:
  - transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /default/cache/10/generation-object
          headers:
            fields:
              - [Host, generation.example.com]
              - [x-debug, "x-cache,x-cache-key,via,x-cache-generation"]
              - [uuid, default-miss]
        <<: *origin-not-expected
        proxy-response:
          status: 200
          headers:
            fields:
              - [X-Cache, {value: miss, as: equal}]
              - [X-Cache-Generation, {value: "-1", as: equal}]

      - client-request:
          delay: 100ms
          method: GET
          version: "1.1"
          url: /generation1/cache/10/generation-object
          headers:
            fields:
              - [Host, generation.example.com]
              - [x-debug, "x-cache,x-cache-key,via,x-cache-generation"]
              - [uuid, generation-1-miss]
        <<: *origin-not-expected
        proxy-response:
          status: 200
          headers:
            fields:
              - [X-Cache, {value: miss, as: equal}]
              - [X-Cache-Generation, {value: "1", as: equal}]

      - client-request:
          delay: 100ms
          method: GET
          version: "1.1"
          url: /generation2/cache/10/generation-object
          headers:
            fields:
              - [Host, generation.example.com]
              - [x-debug, "x-cache,x-cache-key,via,x-cache-generation"]
              - [uuid, generation-2-miss]
        <<: *origin-not-expected
        proxy-response:
          status: 200
          headers:
            fields:
              - [X-Cache, {value: miss, as: equal}]
              - [X-Cache-Generation, {value: "2", as: equal}]

      - client-request:
          delay: 100ms
          method: GET
          version: "1.1"
          url: /default/cache/10/generation-object
          headers:
            fields:
              - [Host, generation.example.com]
              - [x-debug, "x-cache,x-cache-key,via,x-cache-generation"]
              - [uuid, default-hit]
        <<: *origin-not-expected
        proxy-response:
          status: 200
          headers:
            fields:
              - [X-Cache, {value: hit-fresh, as: equal}]
              - [X-Cache-Generation, {value: "-1", as: equal}]

      - client-request:
          delay: 100ms
          method: GET
          version: "1.1"
          url: /generation1/cache/10/generation-object
          headers:
            fields:
              - [Host, generation.example.com]
              - [x-debug, "x-cache,x-cache-key,via,x-cache-generation"]
              - [uuid, generation-1-hit]
        <<: *origin-not-expected
        proxy-response:
          status: 200
          headers:
            fields:
              - [X-Cache, {value: hit-fresh, as: equal}]
              - [X-Cache-Generation, {value: "1", as: equal}]

      - client-request:
          delay: 100ms
          method: GET
          version: "1.1"
          url: /generation2/cache/10/generation-object
          headers:
            fields:
              - [Host, generation.example.com]
              - [x-debug, "x-cache,x-cache-key,via,x-cache-generation"]
              - [uuid, generation-2-hit]
        <<: *origin-not-expected
        proxy-response:
          status: 200
          headers:
            fields:
              - [X-Cache, {value: hit-fresh, as: equal}]
              - [X-Cache-Generation, {value: "2", as: equal}]
