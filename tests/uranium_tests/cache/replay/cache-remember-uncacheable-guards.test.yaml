# Only the origin's response may mark a URL as uncacheable. Each URL first
# answers no-store once, which a second such answer would turn into a memory.
# A response that then goes unstored because the client said no-store, because
# the request was a Range request, because a plugin refused the store, or
# because the origin answered an error must not count as that second answer:
# the next plain GET on the same URL takes the write lock as any miss does,
# stores the response, and the one after it is a hit. The sessions run one
# after another.

meta:
  version: "1.0"

urtest:
  description: 'Client, Range, plugin and error reasons for not storing do not mark a URL uncacheable'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    copy_to_config_dir:
      - 'cache-remember-server-no-store.conf'
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
      proxy.config.http.cache.remember_uncacheable: 60
      # The default of 1 ignores a client no-store, so honor it here for the no-store guard to matter.
      proxy.config.http.cache.ignore_client_no_cache: 0
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
      # Same origin URL, so the same cache key, with a plugin refusing the store.
      - from: "http://plugin.example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
        plugins:
          - name: header_rewrite.so
            args: ['cache-remember-server-no-store.conf']

    # Four URLs, each: an origin no-store, an unstored response for a reason
    # that is not the origin's, a plain GET that must take the lock and store,
    # and a hit.
    metric_checks:
      - metric: proxy.process.http.cache_open_write_deferred
        value: 0
      - metric: proxy.process.http.cache.remember_uncacheable.admits
        value: 0
      - metric: proxy.process.http.cache_hit_fresh
        value: 4
        delay: 0

sessions:
- transactions:
  - client-request:
      method: GET
      url: /client-no-store
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, client-no-store-prime]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, prime]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: prime, as: equal}]

  - client-request:
      method: GET
      url: /client-no-store
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Cache-Control, no-store]
        - [uuid, client-no-store-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      delay: 200ms
      method: GET
      url: /client-no-store
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, client-no-store-second]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]

  - client-request:
      delay: 500ms
      method: GET
      url: /client-no-store
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, client-no-store-third]
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]

- transactions:
  - client-request:
      method: GET
      url: /range
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, range-prime]
    server-response:
      status: 200
      reason: OK
      headers:
