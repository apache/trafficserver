  - client-request:
      method: GET
      url: /range
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Range, bytes=0-1]
        - [uuid, range-first]
    server-response:
      status: 206
      reason: Partial Content
      headers:
        fields:
        - [Content-Length, "2"]
        - [Content-Range, bytes 0-1/3]
        - [Cache-Control, "max-age=300"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xx
    proxy-response:
      status: 206
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

