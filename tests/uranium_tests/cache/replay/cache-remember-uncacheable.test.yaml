# A URL that answered no-store twice is remembered: later misses on it go to
# the origin without taking the cache write lock, so concurrent requests do not
# wait on each other. A cacheable URL is still collapsed and served from cache.
#
# The same sessions run twice. With the memory on, the overlapping no-store
# requests neither lose the write lock nor wait behind a writer. With it off,
# the third request waits behind the second as a busy reader and then loses
# the lock, as a miss does whenever another request holds the lock for an
# uncacheable response longer than its retries wait.

meta:
  version: "1.0"

urtest:
  description: 'Misses on a URL that answered no-store twice skip the cache write lock'

  server:
    name: 'server'

  client:
    name: 'client'
    # The sessions below overlap on purpose.
    process_config:
      run_parallel: true

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

  variants:
    # The first two /nostore requests take the write lock and learn, twice,
    # that the response cannot be stored. The two that follow overlap on a slow
    # origin; neither takes the lock, so the third neither loses it nor waits
    # behind the second as a busy reader. The two /cacheable requests check
    # that collapsing and caching still work, and a last /nostore request, once
    # the others are done, still reaches the origin, so the answers fetched
    # without the lock were not stored. It is the third remember_uncacheable
    # hit.
    - name: memo-on
      ats:
        records_config:
          proxy.config.http.cache.remember_uncacheable: 60
        metric_checks:
          - metric: proxy.process.http.cache.remember_uncacheable.admits
            value: 1
          - metric: proxy.process.http.cache.remember_uncacheable.hits
            value: 3
          - metric: proxy.process.http.cache_open_write_fail_count
            value: 0
          - metric: proxy.process.cache.read_busy.failure
            value: 0
          - metric: proxy.process.http.cache_hit_fresh
            value: 1
        log_validation:
          traffic_out:
            excludes:
              - expression: "retrying cache open write|retrying cache open read"
                description: "No request waits on a cache lock retry timer"
            contains:
              - expression: "built the uncacheable memo with 65536 entries"
                description: "The build is logged, which shows the memo-off exclude can match"
              - expression: '\A(?:(?!START HttpTransact::StartRemapRequest).)*built the uncacheable memo with 65536 entries'
                multiline: true
                description: "Startup builds the memory before the first transaction"

    # Sets nothing, so it also checks that the default leaves the memory off
    # and never builds it: every miss takes the lock before the origin. The
    # third /nostore request finds the second writing, retries the read until
    # its retries run out, then loses the write lock. The last /nostore request
    # shows that the second's answer, fetched under the lock, was not stored.
    - name: memo-off
      ats:
        metric_checks:
          - metric: proxy.process.http.cache.remember_uncacheable.admits
            value: 0
          - metric: proxy.process.http.cache.remember_uncacheable.hits
            value: 0
          - metric: proxy.process.http.cache_open_write_fail_count
            value: 1
          - metric: proxy.process.cache.read_busy.failure
            value: 1
          - metric: proxy.process.http.cache_hit_fresh
            value: 1
        log_validation:
          traffic_out:
            excludes:
              - expression: "built the uncacheable memo"
                description: "With the memory off it is never built"
              - expression: "uncacheable key seen once|remembering the key as uncacheable|uncacheable memo forgot it"
                description: "With the memory off nothing is remembered or forgotten"
              - expression: "deferring the cache write until the response arrives"
                description: "With the memory off no miss defers its cache write"

sessions:
- transactions:
  - client-request:
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-first]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]

  - client-request:
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-first-again]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, first-again]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first-again, as: equal}]

- transactions:
  - client-request:
      delay: 1500ms
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-second]

    server-response:
      delay: 2s
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]

- transactions:
  - client-request:
      delay: 1700ms
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-third]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, third]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: third, as: equal}]

- transactions:
  - client-request:
      delay: 4500ms
      method: GET
      url: /cacheable
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, cacheable-first]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, cacheable-origin]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: cacheable-origin, as: equal}]

  - client-request:
      delay: 300ms
      method: GET
      url: /cacheable
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, cacheable-second]

    # Must not reach the origin.
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: cacheable-origin, as: equal}]

- transactions:
  - client-request:
      delay: 6s
      method: GET
      url: /nostore
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, nostore-fourth]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, fourth]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: fourth, as: equal}]
