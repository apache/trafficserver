#
# Phase 1: prime the cache with a full 11-byte response to /cached.
#
meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: GET
      version: "1.1"
      url: /cached
      headers:
        fields:
        - [ Host, backend.example.com ]
        - [ uuid, prime ]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 11 ]
        - [ Cache-Control, "max-age=300" ]
        - [ Last-Modified, "Thu, 10 Feb 2022 00:00:00 GMT" ]
        - [ ETag, range ]
      content:
        encoding: plain
        data: "0123456789\n"
    proxy-response:
      status: 200
