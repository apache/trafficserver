# A remembered URL is forgotten once a response for it is stored. The first
# two /flip misses answer no-store, so it is remembered; the third is deferred,
# gets a cacheable response and stores it. After a PURGE the next miss must
# take the write lock before the origin again, as a URL that was never
# remembered does, so only the third miss counts as deferred. Without the
# forget it would still be remembered and deferred a second time.

meta:
  version: "1.0"

urtest:
  description: 'Storing a response forgets that its URL was uncacheable'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
      proxy.config.http.cache.remember_uncacheable: 60
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

    # The PURGE's own lookup counts as a fresh hit, as does the last GET.
    metric_checks:
      - metric: proxy.process.http.cache_open_write_deferred
        value: 1
      - metric: proxy.process.http.cache.remember_uncacheable.admits
        value: 1
      - metric: proxy.process.http.cache_hit_fresh
        value: 2
        delay: 0

sessions:
- transactions:
  - client-request:
      method: GET
      url: /flip
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, flip-prime]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, prime]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: prime, as: equal}]

  - client-request:
      method: GET
      url: /flip
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, flip-nostore]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]
  - client-request:
      delay: 500ms
      method: GET
      url: /flip
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, flip-stored]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]
  - client-request:
      delay: 500ms
      method: PURGE
      url: /flip
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [Content-Length, "0"]
        - [uuid, flip-purge]
    # A purge is answered from the cache and never reaches the origin.
    proxy-request:
      expect: absent
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
  - client-request:
      delay: 500ms
      method: GET
      url: /flip
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, flip-after-purge]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, third]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: third, as: equal}]
  - client-request:
      delay: 500ms
      method: GET
      url: /flip
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, flip-hit]
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: third, as: equal}]
