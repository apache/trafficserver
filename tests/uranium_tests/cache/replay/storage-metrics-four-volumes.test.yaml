meta:
  version: "1.0"

urtest:
  description: "Verify metrics for four equally sized cache volumes"

  server:
    name: "storage-metrics-four-volumes-origin"

  client:
    name: "storage-metrics-four-volumes-client"

  ats:
    name: "storage-metrics-four-volumes-ts"
    process_config:
      enable_cache: true

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: cache

    storage_yaml:
      cache:
        spans:
          - name: disk.0
            path: storage
            size: 1G
        volumes:
          - id: 1
            size: 25%
          - id: 2
            size: 25%
          - id: 3
            size: 25%
          - id: 4
            size: 25%

    metric_checks:
      - metric: "proxy.process.cache.stripes"
        value: 4
      - metric: "proxy.process.cache.span.online"
        value: 1
      - metric: "proxy.process.cache.volume_1.stripes"
        value: 1
      - metric: "proxy.process.cache.volume_2.stripes"
        value: 1
      - metric: "proxy.process.cache.volume_3.stripes"
        value: 1
      - metric: "proxy.process.cache.volume_4.stripes"
        value: 1

    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
  - transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /storage-metrics
          headers:
            fields:
              - [Host, storage.example.com]
              - [uuid, storage-metrics-four-volumes-request]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 0]

        proxy-response:
          status: 200
