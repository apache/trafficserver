# The size setting is read at startup and the memory's stats are counted. With four
# entries the memory is a single set, so where every URL goes is known.
#
# /a to /d each answer no-store twice and fill the set with remembered URLs.
# /e then answers once: nothing is empty, expired or seen once, so the
# remembered URL closest to expiry, /a, makes room (set_full). /f answers once
# and takes the place of /e, seen once and still live (evictions). /a was
# pushed out, so its next miss takes the lock and its answer takes the place of
# /f (evictions again); one more answer remembers /a again (a fifth admit). /b
# was not pushed out, so its miss skips the lock (hits) and its answer renews
# it. Had /b been pushed out instead, /a would hit twice, /b would not be
# remembered, and the totals would be two hits and four admits.

meta:
  version: "1.0"

urtest:
  description: 'The uncacheable memory size is read at startup and its stats are counted'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
      proxy.config.http.cache.remember_uncacheable: 60
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

  variants:
    - name: one-set
      ats:
        records_config:
          proxy.config.http.cache.remember_uncacheable_entries: 4
        metric_checks:
          - metric: proxy.process.http.cache.remember_uncacheable.admits
            value: 5
          - metric: proxy.process.http.cache.remember_uncacheable.set_full
            value: 1
          - metric: proxy.process.http.cache.remember_uncacheable.evictions
            value: 2
          - metric: proxy.process.http.cache.remember_uncacheable.hits
            value: 1
        log_validation:
          diags_log:
            excludes:
              - expression: 'is not a power of two'
                description: 'A power of two is used as given'
          traffic_out:
            contains:
              - expression: 'a remembered key in a full uncacheable memo set made room'
                description: 'The set_full case is traced'
              - expression: 'a seen-once key in the uncacheable memo made room'
                description: 'The evictions case is traced'
              - expression: 'still uncacheable, remembered for another 60 s'
                description: 'A renewal after a miss that skipped the lock is traced'

    # Rounded up to 8 with a warning. Two sets, so where each URL lands depends
    # on its hash. Four URLs always fit, so at least four are admitted.
    - name: rounded
      ats:
        records_config:
          proxy.config.http.cache.remember_uncacheable_entries: 5
        metric_checks:
          - metric: proxy.process.http.cache.remember_uncacheable.admits
            min: 4
        log_validation:
          diags_log:
            contains:
              - expression: 'remember_uncacheable_entries 5 is not a power of two; using 8'
                description: 'A size that is not a power of two is rounded up with a warning'

sessions:
- transactions:
  - client-request:
      method: GET
      url: /a
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, a-1]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "no-store"]
        - [X-Response, a-1]
      content:
        encoding: plain
        data: xxx

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: a-1, as: equal}]

