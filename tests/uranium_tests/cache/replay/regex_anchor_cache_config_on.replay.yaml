meta:
  version: '1.0'

autest:
  description: 'anchor_policy_rules=1 makes an unanchored cache.config url_regex rule inert'

  # Distinct process names: both replays run in one sandbox.
  dns:
    name: 'dns-enforcing'

  server:
    name: 'server-enforcing'

  client:
    name: 'client-enforcing'

  ats:
    name: 'ts-enforcing'

    records_config:
      proxy.config.diags.debug.enabled: 0
      proxy.config.url_remap.remap_required: 1
      proxy.config.http.cache.required_headers: 0
      proxy.config.regex.anchor_policy_rules: 1

    remap_config:
      - 'map http://cache.example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/'

    cache_config:
      # The same unanchored rule. Under enforcement it cannot match the whole URL, so
      # the never-cache action never fires and the response is cached instead.
      - 'url_regex=private action=never-cache'

    log_validation:
      diags_log:
        contains:
        # Enforcing still names the rule, at NOTE severity, so a rule added after the
        # migration is visible rather than silently inert.
        - expression: 'NOTE: \[regex-anchor\] \[CacheControl\] url_regex at .*cache\.config:[0-9]+ pattern .private.'
          description: 'The anchored rule is recorded, not warned about'
        excludes:
        - expression: 'WARNING: \[regex-anchor\]'
          description: 'Enforcing reports at NOTE severity, not WARNING'

sessions:
- transactions:

  - client-request:
      method: GET
      url: /private/report.pdf
      version: '1.1'
      headers:
        fields:
        - [Host, cache.example.com]
        - [uuid, inert-rule-first]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 16]
        - [Cache-Control, max-age=300]

    proxy-response:
      status: 200

  # The never-cache rule is inert, so this is served from cache and the origin is not
  # contacted a second time. That the rule stopped applying is the whole point of the
  # migration guidance.
  - client-request:
      delay: 100ms
      method: GET
      url: /private/report.pdf
      version: '1.1'
      headers:
        fields:
        - [Host, cache.example.com]
        - [uuid, inert-rule-second]

    proxy-request:
      expect: absent

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 16]
        - [Cache-Control, max-age=300]

    proxy-response:
      status: 200
