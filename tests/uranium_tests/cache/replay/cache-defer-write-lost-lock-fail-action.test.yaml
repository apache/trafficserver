# A deferred miss that loses the cache write lock serves the response it
# already has, whatever open_write_fail_action says. With the lock eagerly
# taken, fail action 1 answers that miss with a 502; here it must not. The
# first /lost miss is denied the lock by the X-Fail-Cache-Write rule, which
# reports the loss without going to the cache, so both variants reach the
# same lost-lock case. The next miss stores the URL and the one after hits.

meta:
  version: "1.0"

urtest:
  description: 'A deferred miss that loses the write lock ignores open_write_fail_action'

  server:
    name: 'server'

  client:
    name: 'client'

  ats:
    name: 'ts'
    process_config:
      enable_cache: true
    copy_to_config_dir:
      - 'cache-write-lock-fail-write.conf'
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_trans|http_cache'
      proxy.config.http.cache.defer_write_on_miss: 1
      proxy.config.http.cache.max_open_read_retries: 2
    remap_config:
      - from: "http://example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
        plugins:
          - name: header_rewrite.so
            args: ['cache-write-lock-fail-write.conf']

    # Both misses are deferred; the third request is a hit.
    metric_checks:
      - metric: proxy.process.http.cache_open_write_deferred
        value: 2
      - metric: proxy.process.http.cache_open_write_fail_count
        value: 1
        delay: 0
      - metric: proxy.process.http.cache_hit_fresh
        value: 1
        delay: 0

  variants:
    - name: error-on-miss
      ats:
        records_config:
          proxy.config.http.cache.open_write_fail_action: 1
    - name: read-retry
      ats:
        records_config:
          proxy.config.http.cache.open_write_fail_action: 5

sessions:
- transactions:
  - client-request:
      method: GET
      url: /lost
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [X-Fail-Cache-Write, "1"]
        - [uuid, lost-first]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, first]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: first, as: equal}]
  - client-request:
      delay: 500ms
      method: GET
      url: /lost
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, lost-second]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, "3"]
        - [Cache-Control, "max-age=300"]
        - [X-Response, second]
      content:
        encoding: plain
        data: xxx
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]
  - client-request:
      delay: 500ms
      method: GET
      url: /lost
      version: '1.1'
      headers:
        fields:
        - [Host, example.com]
        - [uuid, lost-third]
    server-response:
      status: 400
      reason: Bad Request
      headers:
        fields:
        - [Content-Length, "0"]
    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Response, {value: second, as: equal}]
