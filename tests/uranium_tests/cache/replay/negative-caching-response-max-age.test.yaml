meta:
  version: "1.0"

urtest:
  description: "Verify response max-age overrides negative_caching_lifetime"

  server:
    name: "negative-caching-max-age-origin"

  client:
    name: "negative-caching-max-age-client"

  ats:
    name: "negative-caching-max-age-ts"
    process_config:
      enable_cache: true

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http
      proxy.config.http.insert_age_in_response: 0
      proxy.config.http.negative_caching_enabled: 1
      proxy.config.http.negative_caching_lifetime: 2

    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
  - transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /path/404-with-max-age
          headers:
            fields:
              - [Host, example.com]
              - [uuid, cache-negative-response-with-max-age]

        server-response:
          status: 404
          reason: "Not Found"
          headers:
            fields:
              - [Transfer-Encoding, chunked]
              - [Cache-Control, "max-age=300"]
          content:
            size: 0

        proxy-response:
          status: 404

      - client-request:
          delay: 4s
          method: GET
          version: "1.1"
          url: /path/404-with-max-age
          headers:
            fields:
              - [Host, example.com]
              - [uuid, verify-response-max-age]

        proxy-request:
          expect: absent

        server-response:
          status: 403
          reason: "Cached response expected"

        proxy-response:
          status: 404
