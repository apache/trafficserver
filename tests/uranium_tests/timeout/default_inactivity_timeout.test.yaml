urtest:
  description: "Verify the default network inactivity timeout"
  replay: "replay/default_inactivity_timeout.replay.yaml"
  server:
    name: "default-inactivity-origin"
  client:
    name: "default-inactivity-client"
    return_code: 1
    process_config:
      allow_errors: true
      poll_timeout: 12000
    log_validation:
      contains:
        - expression: "PARSE_INCOMPLETE"
          description: "The timed-out response must be incomplete"
        - expression: "Failed HTTP/1 transaction with key: timeout2"
          description: "The delayed transaction must fail"
  ats:
    name: "default-inactivity-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|cache|socket|net_queue|inactivity_cop|conf_remap"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
    log_validation:
      traffic_out:
        contains:
          - expression: "timed out due to default inactivity timeout"
            description: "ATS must apply the inactivity timeout"
  variants:
    - name: "global"
      ats:
        records_config:
          proxy.config.net.default_inactivity_timeout: 2
    - name: "conf-remap"
      ats:
        remap_config:
          - from: "/"
            to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
            plugins:
              - name: "conf_remap.so"
                args: ["proxy.config.net.default_inactivity_timeout=2"]
