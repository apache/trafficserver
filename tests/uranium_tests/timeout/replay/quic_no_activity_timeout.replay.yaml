# The client is tests/uranium_tests/h3/py_h3_client/h3_idle_client.py, not
# Proxy Verifier. It sends this GET zero, one or two times depending on the
# case. Only the server response and the client-request uuid key are used.

meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: GET
      url: /py-get-small
      version: "1.1"
      headers:
        fields:
        - [ uuid, py-get-small ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, application/octet-stream ]
        - [ Content-Length, "100" ]
      content:
        size: 100
