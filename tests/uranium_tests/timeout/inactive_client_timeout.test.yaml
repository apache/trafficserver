urtest:
  description: "Verify a slow origin does not trigger the client inactivity timeout"
  replay: "slow_server.yaml"
  server:
    name: "inactive-client-origin"
  client:
    name: "inactive-client-client"
    timeout: 45
    log_validation:
      contains:
        - {expression: "x-response: 1", description: "Response 1 must arrive"}
        - {expression: "x-response: 2", description: "Response 2 must arrive"}
        - {expression: "x-response: 3", description: "Response 3 must arrive"}
        - {expression: "x-response: 4", description: "Response 4 must arrive"}
        - {expression: "x-response: 5", description: "Response 5 must arrive"}
        - {expression: "x-response: 6", description: "Response 6 must arrive"}
  ats:
    name: "inactive-client-ts"
    process_config:
      enable_tls: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http"
      proxy.config.url_remap.remap_required: 1
      proxy.config.http.transaction_no_activity_timeout_in: 2
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
    remap_config:
      - from: "https://www.tls.com/"
        to: "https://127.0.0.1:{SERVER_HTTPS_PORT}/"
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
