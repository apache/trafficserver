urtest:
  description: "Verify HTTP/2 inbound and outbound inactivity timeouts"
  replay: "replay/http2_no_activity_timeout.replay.yaml"
  server:
    name: "http2-inactivity-origin"
  client:
    name: "http2-inactivity-client"
  ats:
    name: "http2-inactivity-ts"
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|socket|inactivity_cop"
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
      proxy.config.ssl.client.alpn_protocols: "h2,http/1.1"
    remap_config:
      - from: "/"
        to: "https://127.0.0.1:{SERVER_HTTPS_PORT}/"
  variants:
    - name: "default"
    - name: "client-side"
      client:
        process_config:
          keys: ["no_delay", "3_second_request_delay"]
        log_validation:
          contains:
            - {expression: "SSL_read error", description: "The client must observe ATS closing the idle session"}
      ats:
        records_config:
          proxy.config.http2.no_activity_timeout_in: 1
        log_validation:
          traffic_out:
            contains:
              - {expression: "http2_cs.*Closing event:.*TIMEOUT", description: "ATS must detect the client-side timeout"}
    - name: "server-side"
      client:
        process_config:
          keys: ["no_delay", "3_second_request_delay"]
      server:
        log_validation:
          contains:
            - expression: "Negotiated ALPN from client ALPN.*Negotiated ALPN from client ALPN"
              multiline: true
              description: "ATS must open a second origin connection after timeout"
      ats:
        records_config:
          proxy.config.http2.no_activity_timeout_out: 1
        log_validation:
          traffic_out:
            contains:
              - {expression: "http2_cs.*Closing event:.*TIMEOUT", description: "ATS must detect the server-side timeout"}
