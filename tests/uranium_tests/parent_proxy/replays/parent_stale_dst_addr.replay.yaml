#
# The object that only the healthy third parent holds. The first parent answers
# 503 from the test's own HTTP server and the second parent's name never
# resolves, so this replay is the healthy parent's response and the client's
# verification of the result:
#
#   * proxy-response.status 200 and the X-Served-By field prove the client was
#     served by the parent this replay belongs to, not by the 503 that the
#     first parent returns.
#
# The 503 is a simple parent retry (parent_retry=simple_retry,
# simple_server_retry_responses="503"); the retry's failed lookup then moves
# selection to this parent, whose address must be resolved and contacted.
#

meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: GET
      version: "1.1"
      url: /object
      headers:
        fields:
        - [ Host, origin.test ]
        - [ uuid, stale-parent-retry ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 16 ]
        - [ X-Served-By, from-parent-c ]
      content:
        encoding: plain
        data: "parent-c object\n"

    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Served-By, { value: "from-parent-c", as: equal } ]
