meta:
  version: '1.0'

sessions:
- transactions:
  - client-request:
      method: GET
      version: '1.1'
      url: /
      headers:
        fields:
        - [Host, www.example.com]
        - [uuid, null-transform]
    proxy-request:
      method: GET
      version: '1.1'
      url: /
      headers:
        fields:
        - [Host, www.example.com]
        - [uuid, null-transform]
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Connection, close]
      content:
        encoding: plain
        data: This is expected response.
    proxy-response:
      status: 200
      content:
        encoding: plain
        data: This is expected response.

urtest:
  description: Pass a response through the null_transform plugin
  requires: {plugins: [null_transform.so]}
  server: {name: null-transform-origin}
  client: {name: null-transform-client}
  ats:
    name: null-transform-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.show_location: 0
      proxy.config.diags.debug.tags: null_transform
      proxy.config.url_remap.pristine_host_hdr: 1
    plugin_config: [null_transform.so]
    remap_config:
    - map http://www.example.com http://127.0.0.1:{SERVER_HTTP_PORT}
    log_validation:
      traffic_out:
        gold_file: gold/null_transform-tag.gold
