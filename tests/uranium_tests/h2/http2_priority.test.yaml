meta:
  version: "1.0"

urtest:
  description: "Proxy a large HTTP/2 response with stream priority enabled"
  server:
    name: "origin"
  client:
    name: "h2-client"
  ats:
    name: "ts"
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.http2.stream_priority_enabled: 1
      proxy.config.http2.no_activity_timeout_in: 3
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http2"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"

sessions:
  - protocol:
      stack: http2
      tls:
        sni: example.com
    transactions:
      - client-request:
          version: "2"
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", www.example.com]
              - [":path", /bigfile]
              - [uuid, priority-large-response]
        proxy-request:
          headers:
            fields:
              - [uuid, {value: priority-large-response, as: equal}]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 1048576]
          content:
            size: 1048576
        proxy-response:
          status: 200
          headers:
            fields:
              - [Content-Length, {value: 1048576, as: equal}]
          content:
            size: {value: 1048576, as: equal}
