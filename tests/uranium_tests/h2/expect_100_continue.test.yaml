meta:
  version: "1.0"

urtest:
  description: "Proxy an empty HTTP/2 POST with Expect: 100-continue"
  replay: "expect_100_continue.yaml"
  server:
    name: "expect-origin"
  client:
    name: "expect-client"
  ats:
    name: "expect-ts"
    process_config:
      enable_tls: true
    records_config:
      proxy.config.ssl.client.alpn_protocols: "h2,http/1.1"
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
      proxy.config.http.server_session_sharing.pool: "thread"
      proxy.config.http.server_session_sharing.match: "ip,sni,cert"
    remap_config:
      - from: "/expect"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}"

sessions: []
