meta:
  version: "1.0"

urtest:
  description: "Verify HTTP/2 connections update the client IP version metrics"
  server:
    name: "http2-metrics-origin"
  client:
    name: "http2-metrics-client"
  ats:
    name: "http2-metrics-ts"
    process_config:
      enable_cache: false
      enable_tls: true
    remap_config:
      - from: "https://http2-metrics.test/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
    metric_checks:
      - {metric: "proxy.process.http2.total_client_connections", value: 1}
      - {metric: "proxy.process.http.total_client_connections_ipv4", value: 1}
      - {metric: "proxy.process.http.total_client_connections_ipv6", value: 0}

sessions:
  - protocol:
      stack: http2
      tls:
        sni: http2-metrics.test
    transactions:
      - client-request:
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", http2-metrics.test]
              - [":path", /]
              - [Content-Length, 0]
              - [uuid, http2-client-connection-metric]
        proxy-request:
          headers:
            fields:
              - [uuid, {value: http2-client-connection-metric, as: equal}]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 0]
        proxy-response:
          status: 200
