meta:
  version: '1.0'

sessions:
- protocol:
    stack: http2
    tls:
      sni: delay-txn-start.test
  transactions:
  - client-request:
      frames:
      - HEADERS:
          headers:
            fields:
            - [:method, POST]
            - [:scheme, https]
            - [:authority, delay-txn-start.test]
            - [:path, /read-gate]
            - [Content-Length, '12']
            - [uuid, '1']
      - DATA:
          content:
            encoding: plain
            data: request-body
            size: 12

    proxy-request:
      content:
        encoding: plain
        data: request-body
        verify: {as: equal}

    server-response:
      status: 200
      reason: OK
      content:
        encoding: plain
        data: response-body
        size: 13

    proxy-response:
      status: 200
      content:
        encoding: plain
        data: response-body
        verify: {as: equal}
