#
# This replay file assumes that caching is enabled and
# proxy.config.http.cache.ignore_client_cc_max_age is set to 0 so that we can
# test max-age in the client requests.
#


meta:
  version: '1.0'

urtest:
  description: "Verify an HTTP/2 GET request can carry a body"
  requires:
    proxy_verifier: "2.8.0"
  server:
    name: "h2-get-body-origin"
    log_validation:
      contains:
        - expression: 'Equals Success: Key: "1", Content Data: "body", Value: "client_test"'
          description: "The origin must receive the request body"
  client:
    name: "h2-get-body-client"
    log_validation:
      contains:
        - expression: 'Equals Success: Key: "1", Content Data: "body", Value: "server_test"'
          description: "The client must receive the response body"
  ats:
    name: "h2-get-body-ts"
    process_config:
      enable_tls: true
      enable_cache: true
    records_config:
      proxy.config.http.background_fill_active_timeout: 0
      proxy.config.http.background_fill_completed_threshold: 0.0
      proxy.config.http.cache.required_headers: 0
      proxy.config.http.insert_response_via_str: 2
      proxy.config.http.server_session_sharing.pool: "thread"
      proxy.config.http.server_session_sharing.match: "ip,sni,cert"
      proxy.config.exec_thread.autoconfig.enabled: 0
      proxy.config.exec_thread.limit: 1
      proxy.config.ssl.client.alpn_protocols: "h2,http/1.1"
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
      proxy.config.diags.debug.enabled: 3
      proxy.config.diags.debug.tags: "http"
    remap_config:
      - from: "/"
        to: "https://127.0.0.1:{SERVER_HTTPS_PORT}/"

sessions:
- protocol:
    stack: http2
    tls:
      sni: test_sni
  transactions:
  - client-request:
      frames:
      - HEADERS:
          headers:
            fields:
            - [":method", GET]
            - [":scheme", https]
            - [":authority", example.data.com]
            - [":path", /a/path]
            - [Content-Type, text/html]
            - [uuid, 1]
      - DATA:
          delay: 1s
          content:
            encoding: plain
            data: client_test
            size: 11

    proxy-request:
      content:
        encoding: plain
        data: client_test
        verify: {as: equal}

    server-response:
      frames:
      - HEADERS:
          headers:
            fields:
            - [":status", 200]
            - [Content-Type, text/html]
            - [Content-Length, '11']
      - DATA:
          delay: 2s
          content:
            encoding: plain
            data: server_test
            size: 11

    proxy-response:
      content:
        encoding: plain
        data: server_test
        verify: {as: equal}
