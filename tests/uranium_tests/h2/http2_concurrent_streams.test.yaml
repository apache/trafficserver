urtest:
  description: "Verify concurrent HTTP/2 stream handling"
  replay: "replay/http2_concurrent_streams.replay.yaml"
  server:
    name: "concurrent-streams-origin"
  client:
    name: "concurrent-streams-client"
  ats:
    name: "concurrent-streams-ts"
    process_config:
      enable_tls: true
      enable_cache: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http2"
      proxy.config.http.insert_response_via_str: 2
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
