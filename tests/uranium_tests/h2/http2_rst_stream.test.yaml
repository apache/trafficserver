urtest:
  description: "Verify HTTP/2 RST_STREAM handling"
  requires:
    openssl: "1.1.1"
    proxy_verifier: "2.8.0"
  server:
    name: "rst-stream-origin"
  client:
    name: "rst-stream-client"
  ats:
    name: "rst-stream-ts"
    process_config:
      enable_tls: true
    records_config:
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
      proxy.config.diags.debug.enabled: 3
      proxy.config.diags.debug.tags: "http"
      proxy.config.exec_thread.autoconfig.enabled: 0
      proxy.config.exec_thread.limit: 4
      proxy.config.ssl.client.alpn_protocols: "h2,http/1.1"
      proxy.config.http.server_session_sharing.pool: "thread"
      proxy.config.http.server_session_sharing.match: "ip,sni,cert"
    remap_config:
      - from: "/"
        to: "https://127.0.0.1:{SERVER_HTTPS_PORT}/"

  variants:
    - name: "client-after-data"
      replay: "replay_rst_stream/http2_rst_stream_client_after_data.yaml"
      client:
        log_validation:
          contains:
            - expression: "Submitting RST_STREAM frame for key 1 after DATA frame with error code INTERNAL_ERROR"
              description: "The client must detect the abort directive"
            - expression: "Submitted RST_STREAM frame for key 1 on stream 1"
              description: "The client must send RST_STREAM"
      server:
        log_validation:
          excludes:
            - {expression: "RST_STREAM", description: "The origin must not see the downstream reset"}
      ats:
        log_validation:
          traffic_out:
            contains:
              - {expression: "Received HEADERS frame", description: "ATS must receive HEADERS"}
              - {expression: "Received DATA frame", description: "ATS must receive DATA"}
              - {expression: "Received RST_STREAM frame", description: "ATS must receive RST_STREAM"}
              - {expression: "Parsed RST_STREAM frame: Error Code: 2", description: "ATS must parse INTERNAL_ERROR"}

    - name: "client-after-headers"
      replay: "replay_rst_stream/http2_rst_stream_client_after_headers.yaml"
      client:
        log_validation:
          contains:
            - expression: "Submitting RST_STREAM frame for key 1 after HEADERS frame with error code STREAM_CLOSED"
              description: "The client must detect the abort directive"
            - expression: "Submitted RST_STREAM frame for key 1 on stream 1"
              description: "The client must send RST_STREAM"
      server:
        log_validation:
          excludes:
            - {expression: "RST_STREAM", description: "The origin must not see the downstream reset"}
      ats:
        log_validation:
          traffic_out:
            contains:
              - {expression: "Received HEADERS frame", description: "ATS must receive HEADERS"}
              - {expression: "Received RST_STREAM frame", description: "ATS must receive RST_STREAM"}
              - {expression: "Parsed RST_STREAM frame: Error Code: 5", description: "ATS must parse STREAM_CLOSED"}
            excludes:
              - {expression: "Received DATA frame", description: "ATS must not receive DATA after the headers reset"}

    - name: "server-after-headers"
      replay: "replay_rst_stream/http2_rst_stream_server_after_headers.yaml"
      client:
        log_validation:
          contains:
            - expression: "Received RST_STREAM frame with stream id 1, error code 0"
              description: "The client must receive the origin reset"
      server:
        log_validation:
          gold_file: "gold/server_after_headers.gold"
      ats:
        records_config:
          proxy.config.exec_thread.limit: 1
        log_validation:
          traffic_out:
            contains:
              - {expression: "Received RST_STREAM frame", description: "ATS must receive the origin reset"}
              - {expression: "Parsed RST_STREAM frame: Error Code: 11", description: "ATS must parse ENHANCE_YOUR_CALM"}
              - {expression: "Send RST_STREAM frame: Error Code: 0", description: "ATS must reset the client stream"}
