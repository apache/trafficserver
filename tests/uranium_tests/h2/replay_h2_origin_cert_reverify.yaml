meta:
  version: '1.0'

sessions:
  - protocol:
      stack: http2
      tls:
        version: TLSv1.3
        sni: foo.com
        proxy-verify-mode: 1
        proxy-provided-cert: false
    transactions:
      - all: { headers: { fields: [[ uuid, foo ]]}}

        proxy-request: &foo-request
          protocol:
            stack: http2
            tls:
              sni: foo.com
              proxy-verify-mode: 1
              proxy-provided-cert: false
          version: '2'
          headers:
            encoding: esc_json
            fields:
              - [":method", {value: GET, as: equal}]
              - [":scheme", {value: https, as: equal}]
              - [":path", {value: /foo, as: equal}]
              - [ ":authority", {value: foo.com, as: equal} ]
          content:
            encoding: plain
            size: 0

        server-response: &response
          version: '2'
          status: 200
          headers:
            encoding: esc_json
            fields:
              - [ Content-Length, 12 ]
          content:
            encoding: plain
            data: foo-response
            size: 12

      # Permissive session reuse sends the second authority over the same
      # TLS connection. A distinct key verifies that request independently.
      - all: {headers: {fields: [[uuid, bar]]}}
        proxy-request:
          <<: *foo-request
          headers:
            fields:
              - [":method", {value: GET, as: equal}]
              - [":scheme", {value: https, as: equal}]
              - [":path", {value: /foo, as: equal}]
              - [":authority", {value: bar.com, as: equal}]
        server-response: *response
