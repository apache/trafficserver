meta:
  version: '1.0'

sessions:
  - protocol:
      stack: http2
      tls:
        version: TLSv1.3
        sni: foo.com
        proxy-verify-mode: 1
        proxy-provided-cert: false
    transactions:
      - all: { headers: { fields: [[ uuid, foo ]]}}

        proxy-request:
          protocol:
            stack: http2
            tls:
              sni: foo.com
              proxy-verify-mode: 1
              proxy-provided-cert: false
          version: '2'
          scheme: https
          method: GET
          url: /foo
          headers:
            encoding: esc_json
            fields:
              - [ Host, foo.com ]
          content:
            encoding: plain
            size: 0

        server-response:
          version: '2'
          status: 200
          headers:
            encoding: esc_json
            fields:
              - [ Content-Length, 12 ]
          content:
            encoding: plain
            data: foo-response
            size: 12
