meta:
  version: "1.0"

urtest:
  description: "Verify basic, large, chunked, and header-only HTTP/2 responses"
  server: {name: basic-h2-origin}
  client: {name: basic-h2-client}
  ats:
    name: basic-h2-ats
    process_config: {enable_tls: true, enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http
      proxy.config.http2.active_timeout_in: 3
      proxy.config.http2.max_concurrent_streams_in: 65535
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}"

sessions:
  - protocol:
      stack: http2
      tls: {sni: www.example.com}
    transactions:
      - client-request:
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", www.example.com]
              - [":path", /]
              - [uuid, basic]
        server-response:
          status: 200
          headers:
            fields: [[Content-Length, 0]]
        proxy-response:
          status: 200

      - client-request:
          await: basic
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", www.example.com]
              - [":path", /bigfile]
              - [uuid, bigfile-1]
        server-response:
          status: 200
          headers:
            fields:
              - [Cache-Control, max-age=3600]
              - [Content-Length, 191414]
          content: {size: 191414}
        proxy-response:
          status: 200
          content: {size: 191414}

      - client-request:
          await: bigfile-1
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", www.example.com]
              - [":path", /bigfile]
              - [uuid, bigfile-2]
        server-response:
          status: 200
          headers:
            fields:
              - [Cache-Control, max-age=3600]
              - [Content-Length, 191414]
          content: {size: 191414}
        proxy-response:
          status: 200
          content: {size: 191414}

      - client-request:
          await: bigfile-2
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", www.example.com]
              - [":path", /test2]
              - [uuid, chunked]
        server-response:
          status: 200
          headers:
            fields: [[Transfer-Encoding, chunked]]
        proxy-response:
          status: 200

      - client-request:
          await: chunked
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", www.example.com]
              - [":path", /status/204]
              - [uuid, no-content]
        server-response:
          status: 204
        proxy-response:
          status: 204
