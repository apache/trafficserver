meta:
  version: '1.0'

urtest:
  description: "Verify HTTP/2 reads do not bypass an asynchronous TXN_START hook"

  requires:
    proxy_verifier: "2.8.0"

  server:
    name: "txn-start-gate-origin"
    log_validation:
      contains:
        - expression: 'Equals Success: Key: "1", Content Data: "body", Value: "request-body"'
          description: "The origin must receive the request body"

  client:
    name: "txn-start-gate-client"
    log_validation:
      contains:
        - expression: 'Equals Success: Key: "1", Content Data: "body", Value: "response-body"'
          description: "The client must receive the response body"

  ats:
    name: "txn-start-gate-ts"
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "delay_txn_start"
    copy_custom_plugin:
      - "{AtsTestPluginsDir}/delay_txn_start.so"
    plugin_config:
      - "delay_txn_start.so 500"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
    log_validation:
      traffic_out:
        contains:
          - expression: "delayed TXN_START reenable"
            description: "The test plugin must delay and resume TXN_START"
        excludes:
          - expression: "READ_REQUEST_HDR before delayed TXN_START reenable"
            description: "READ_REQUEST_HDR must wait for TXN_START reenable"


sessions:
- protocol:
    stack: http2
    tls:
      sni: delay-txn-start.test
  transactions:
  - client-request:
      frames:
      - HEADERS:
          headers:
            fields:
            - [":method", POST]
            - [":scheme", https]
            - [":authority", delay-txn-start.test]
            - [":path", /read-gate]
            - [Content-Length, '12']
            - [uuid, '1']
      - DATA:
          content:
            encoding: plain
            data: request-body
            size: 12

    proxy-request:
      content:
        encoding: plain
        data: request-body
        verify: {as: equal}

    server-response:
      status: 200
      reason: OK
      content:
        encoding: plain
        data: response-body
        size: 13

    proxy-response:
      status: 200
      content:
        encoding: plain
        data: response-body
        verify: {as: equal}
