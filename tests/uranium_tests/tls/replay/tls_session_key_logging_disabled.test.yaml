meta:
  version: "1.0"

urtest:
  description: "Verify TLS session secrets are not logged by default"
  server:
    name: "keylog-disabled-origin"
  client:
    name: "keylog-disabled-client"
  ats:
    name: "keylog-disabled-ts"
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "ssl_keylog"
      proxy.config.ssl.keylog_file: null
    remap_config:
      - from: "/"
        to: "https://127.0.0.1:{SERVER_HTTPS_PORT}/"
    file_checks:
      - path: "{LOG_DIR}/tls_secrets.txt"
        exists: false


sessions:
- protocol:
    stack: https
  transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /for/tls
      headers:
        fields:
        - [ Host, example.com ]
        - [ Connection, keep-alive ]
        - [ Content-Length, 16 ]
        - [ uuid, 2 ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 32 ]

    proxy-response:
      status: 200
