urtest:
  description: "Verify stale TLS accept timeouts do not crash a deferred SSN_START hook"
  replay: "tls_accept_timeout_crash.replay.yaml"
  server:
    name: "accept-timeout-origin"
  client:
    name: "accept-timeout-client"
  ats:
    name: "accept-timeout-ts"
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.ssl.handshake_timeout_in: 1
      proxy.config.http.accept_no_activity_timeout: 1
      proxy.config.http2.accept_no_activity_timeout: 1
      proxy.config.url_remap.remap_required: 0
    copy_custom_plugin:
      - "{AtsTestPluginsDir}/hook_add_plugin.so"
    plugin_config:
      - "hook_add_plugin.so -delay-ms=3000"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
    log_validation:
      traffic_out:
        excludes:
          - expression: 'failed assertion `event == NET_EVENT_ACCEPT'
            description: "Session acceptors must ignore stale inactivity timeouts"
      diags_log:
        excludes:
          - expression: "FATAL.*Assertion"
            description: "ATS must not abort on the stale timeout"
