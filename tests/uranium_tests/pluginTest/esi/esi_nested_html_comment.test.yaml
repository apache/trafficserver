urtest:
  description: "Verify ESI HTML comment nesting validation"
  requires:
    plugins: ["esi.so"]
  server:
    name: "esi-comment-origin"
    process_config:
      other_args: '--format "{url}"'
  client:
    name: "esi-comment-client"
    process_config:
      other_args: '--format "{url}"'
  ats:
    name: "esi-comment-ts"
    process_config:
      disable_log_checks: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|plugin_esi|plugin_esi_procesor"
    plugin_config:
      - "esi.so"
    remap_config:
      - from: "http://www.example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}"
  variants:
    - name: "single-level"
      server:
        log_validation:
          contains:
            - {expression: "GET /esi-html-comment.php", description: "The origin must receive the ESI document request"}
      client:
        process_config:
          keys: ["/esi-html-comment.php"]
        log_validation:
          contains:
            - {expression: "www.example.com", description: "The client must receive the expanded ESI body"}
      ats:
        log_validation:
          diags_log:
            excludes:
              - {expression: 'Nested <!--esi \.\.\.--> inside <!--esi \.\.\.-->', description: "A single wrapper must not trip the nested guard"}
    - name: "nested-rejected"
      replay: "esi_nested_html_comment_reject.replay.yaml"
      server:
        log_validation:
          contains:
            - {expression: "GET /esi-nested-reject.php", description: "The origin must receive the nested-wrapper request"}
      client:
        process_config:
          keys: ["/esi-nested-reject.php"]
      ats:
        log_validation:
          diags_log:
            contains:
              - {expression: 'Nested <!--esi \.\.\.--> inside <!--esi \.\.\.--> is not allowed', description: "The nested-wrapper guard must reject nested ESI comments"}

sessions:

- transactions:

  # Origin returns an HTML comment wrapper (<!--esi ... -->) around an
  # <esi:vars> tag. The ESI processor must strip the wrapper, expand the
  # inner ESI markup, and produce the expanded body.
  - client-request:
      method: GET
      url: /esi-html-comment.php
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Accept, "*/*" ]

    server-response:
      status: 200
      headers:
        fields:
        - [ X-Esi, "1" ]
        - [ Cache-Control, "private" ]
        - [ Content-Type, "text/html" ]
        - [ Connection, "close" ]
        - [ Transfer-Encoding, "chunked" ]
      content:
        encoding: plain
        data: "<body>start-<!--esi <esi:vars>$(HTTP_HOST)</esi:vars> -->-end</body>"
