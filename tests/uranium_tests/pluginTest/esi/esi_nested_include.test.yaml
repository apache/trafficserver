
urtest:
  description: "Verify the ESI maximum nested-include depth"
  requires:
    plugins: ["esi.so"]
  server:
    name: "esi-nested-origin"
    process_config:
      other_args: '--format "{url}"'
    log_validation:
      contains:
        - {expression: "GET /main.php", description: "The origin must receive the top-level request"}
        - {expression: "GET /esi-nested-include.html", description: "The origin must receive the nested include"}
  client:
    name: "esi-nested-client"
    process_config:
      other_args: '--format "{url}"'
      keys: ["/main.php"]
    log_validation:
      contains:
        - {expression: "Received an HTTP/1 chunked body", description: "The client must receive the transformed response"}
        - {expression: 'esi:include src="http://www.example.com/esi-nested-include.html"/>', description: "The maximum-depth include must remain in the body"}
  ats:
    name: "esi-nested-ts"
    process_config:
      disable_log_checks: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|plugin_esi"
    plugin_config:
      - "esi.so"
    remap_config:
      - from: "http://www.example.com/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}"
    log_validation:
      diags_log:
        contains:
          - expression: 'The current esi inclusion depth \(3\) is larger than or equal to the max \(3\)'
            description: "ESI must report the maximum inclusion depth"

