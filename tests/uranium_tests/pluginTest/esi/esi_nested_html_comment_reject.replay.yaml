sessions:

- transactions:

  # Origin returns an outer <!--esi ...--> whose content includes a nested
  # <!--esi ...--> hidden inside <esi:try>/<esi:attempt>. The top-level scan
  # in the previous fix missed this case because the nested wrapper lives in
  # attempt_node->child_nodes; this test locks in the deeper-nesting reject.
  - client-request:
      method: GET
      url: /esi-nested-reject.php
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Accept, "*/*" ]

    server-response:
      status: 200
      headers:
        fields:
        - [ X-Esi, "1" ]
        - [ Cache-Control, "private" ]
        - [ Content-Type, "text/html" ]
        - [ Connection, "close" ]
        - [ Transfer-Encoding, "chunked" ]
      content:
        encoding: plain
        data: "<body>start-<!--esi <esi:try><esi:attempt><!--esi <esi:vars>$(HTTP_HOST)</esi:vars>--></esi:attempt><esi:except>fallback</esi:except></esi:try> -->-end</body>"
