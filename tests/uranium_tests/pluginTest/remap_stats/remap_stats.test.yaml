meta: {version: "1.0"}

urtest:
  description: "Verify remap_stats counts response classes by remap host"
  requires: {plugins: [remap_stats.so]}
  server: {name: "remap-stats-origin"}
  client: {name: "remap-stats-client"}
  ats:
    name: "remap-stats-ts"
    plugin_config: ["remap_stats.so"]
    remap_config:
      - "map http://one http://127.0.0.1:{SERVER_HTTP_PORT}"
      - "map http://two http://127.0.0.1:{SERVER_HTTP_PORT}"
    records_config:
      proxy.config.http.transaction_active_timeout_out: 2
      proxy.config.http.transaction_no_activity_timeout_out: 2
      proxy.config.http.connect_attempts_timeout: 2
    metric_checks:
      - {metric: plugin.remap_stats.one.status_2xx, value: "1", delay: 0}
      - {metric: plugin.remap_stats.two.status_4xx, value: "1", delay: 0}
  variants:
    - name: "pre-remap-host"
    - name: "post-remap-host"
      ats:
        plugin_config: ["remap_stats.so --post-remap-host"]
        metric_checks:
          - {metric: plugin.remap_stats.127.0.0.1.status_2xx, value: "1", delay: 0}
          - {metric: plugin.remap_stats.127.0.0.1.status_4xx, value: "1", delay: 0}


sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, remap-stats-one]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, one]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: {status: 200}

      - all: {headers: {fields: [[uuid, remap-stats-two]]}}
        client-request:
          method: GET
          url: /badpath
          version: "1.1"
          headers: {fields: [[Host, two]]}
        server-response:
          status: 404
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: {status: 404}
