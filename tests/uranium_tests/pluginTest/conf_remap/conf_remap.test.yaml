urtest:
  description: "Verify per-remap negative caching configuration"
  replay: "replay/conf_remap.replay.yaml"
  requires:
    plugins: ["conf_remap.so"]
  server:
    name: "conf-remap-origin"
  client:
    name: "conf-remap-client"
  ats:
    name: "conf-remap-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|conf_remap"
      proxy.config.http.insert_response_via_str: 2
      proxy.config.http.negative_caching_enabled: 0
    copy_to_config_dir:
      - "etc/negative_caching_list.yaml"
    remap_config:
      - "map /default_negative_caching_list/ http://127.0.0.1:{SERVER_HTTP_PORT}/default_negative_caching_list/ @plugin=conf_remap.so @pparam=proxy.config.http.negative_caching_enabled=1"
      - "map /custom_negative_caching_list/ http://127.0.0.1:{SERVER_HTTP_PORT}/custom_negative_caching_list/ @plugin=conf_remap.so @pparam={CONFIG_DIR}/etc/negative_caching_list.yaml"
