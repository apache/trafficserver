meta: {version: "1.0"}

urtest:
  description: "Verify client_context_dump reports all loaded client certificates"
  requires: {plugins: [client_context_dump.so]}
  server: {name: "client-context-origin"}
  client: {name: "client-context-client"}
  ats:
    name: "client-context-ts"
    process_config: {enable_tls: true, enable_cache: false}
    copy_to_ssl_dir: ["ssl/one.com.pem", "ssl/two.com.pem"]
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "client_context_dump"
      proxy.config.ssl.server.cert.path: "{ATS_SSL_DIR}"
      proxy.config.ssl.server.private_key.path: "{ATS_SSL_DIR}"
      proxy.config.ssl.client.cert.path: "{ATS_SSL_DIR}"
      proxy.config.ssl.client.private_key.path: "{ATS_SSL_DIR}"
    ssl_multicert_yaml:
      ssl_multicert:
        - dest_ip: "*"
          ssl_cert_name: one.com.pem
          ssl_key_name: one.com.pem
    sni_yaml:
      sni:
        - {fqdn: "*one.com", client_cert: one.com.pem}
        - {fqdn: "*two.com", client_cert: two.com.pem}
    plugin_config: ["client_context_dump.so"]
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}/"
    post_client_commands:
      - "traffic_ctl plugin msg client_context_dump.t 1"
    file_checks:
      - {path: "{LOG_DIR}/client_context_dump.log", contains: "CN=two.com"}
      - {path: "{LOG_DIR}/client_context_dump.log", contains: "CN=one.com"}


sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, client-context-dump]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: {status: 200}
