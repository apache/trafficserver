urtest:
  description: "Verify prefetch path arithmetic and optional capture handling"
  replay: "prefetch_patterns.replay.yaml"
  requires: {plugins: [cachekey.so, prefetch.so]}
  server:
    name: "prefetch-origin"
    process_config: {other_args: "--format {url}"}
  client: {name: "prefetch-client"}
  ats:
    name: "prefetch-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|prefetch"
  variants:
    - name: "simple"
      client: {process_config: {keys: "prefetch-simple"}}
      ats:
        remap_config:
          - 'map http://domain.in http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=cachekey.so @pparam=--remove-all-params=true @plugin=prefetch.so @pparam=--front=true @pparam=--fetch-policy=simple @pparam=--fetch-path-pattern=/(.*-)(\d+)(.*)/$1{$2+1}$3/ @pparam=--fetch-count=3'
        file_checks:
          - {path: "{LOG_DIR}/traffic.out", contains: "demo-4.txt", timeout: 15}

    - name: "overflow-64"
      client: {process_config: {keys: "prefetch-overflow"}}
      ats:
        remap_config:
          - 'map http://domain.in http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=cachekey.so @pparam=--remove-all-params=true @plugin=prefetch.so @pparam=--front=true @pparam=--fetch-policy=simple @pparam=--fetch-path-pattern=/(.*-)(\d+)(.*)/$1{$2+1}$3/ @pparam=--fetch-count=3 @pparam=--fetch-overflow=64'
        file_checks:
          - {path: "{LOG_DIR}/traffic.out", contains: "3594967639394", timeout: 15}

    - name: "arbitrary-precision"
      client: {process_config: {keys: "prefetch-bignum"}}
      ats:
        remap_config:
          - 'map http://domain.in http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=cachekey.so @pparam=--remove-all-params=true @plugin=prefetch.so @pparam=--front=true @pparam=--fetch-policy=simple @pparam=--fetch-path-pattern=/(.*-)(\d+)(.*)/$1{$2+1}$3/ @pparam=--fetch-count=3 @pparam=--fetch-overflow=bignum'
        file_checks:
          - {path: "{LOG_DIR}/traffic.out", contains: "3842948374928374982374982377", timeout: 15}

    - name: "optional-group"
      client: {process_config: {keys: "prefetch-optional"}}
      ats:
        remap_config:
          - 'map http://domain.in http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=cachekey.so @pparam=--remove-all-params=true @plugin=prefetch.so @pparam=--front=true @pparam=--fetch-policy=simple @pparam=--fetch-path-pattern=/(.*-)(\d+)(\?.*)?$/$1{$2+1}$3/ @pparam=--fetch-count=3'
        file_checks:
          - {path: "{LOG_DIR}/traffic.out", contains: "demo-4", timeout: 15}
        log_validation:
          traffic_out:
            excludes:
              - {expression: "invalid reference", description: "An unmatched optional group expands to an empty string"}

    - name: "empty-replacement"
      client: {process_config: {keys: "prefetch-empty"}}
      ats:
        process_config: {disable_log_checks: true}
        remap_config:
          - 'map http://domain.in http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=cachekey.so @pparam=--remove-all-params=true @plugin=prefetch.so @pparam=--front=true @pparam=--fetch-policy=simple @pparam=--fetch-path-pattern=/(.*-)(\d+)(\?.*)?$/$3/ @pparam=--fetch-count=3'
        file_checks:
          - {path: "{LOG_DIR}/diags.log", contains: "produced an empty path", timeout: 15}
        log_validation:
          traffic_out:
            excludes:
              - {expression: "failed to process the pattern", description: "The empty expansion is skipped without self-prefetch"}
