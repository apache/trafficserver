meta: {version: "1.0"}

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, prefetch-simple]]}}
        client-request:
          method: GET
          url: /texts/demo-1.txt
          version: "1.1"
          headers: {fields: [[Host, domain.in]]}
        server-response: &cacheable
          status: 200
          headers: {fields: [[Cache-Control, "max-age=85000"], [Content-Length, 0], [Connection, close]]}
        proxy-response: {status: 200}

      - all: {headers: {fields: [[uuid, prefetch-overflow]]}}
        client-request:
          method: GET
          url: /texts/demo-3594967639391.txt
          version: "1.1"
          headers: {fields: [[Host, domain.in]]}
        server-response: *cacheable
        proxy-response: {status: 200}

      - all: {headers: {fields: [[uuid, prefetch-bignum]]}}
        client-request:
          method: GET
          url: /texts/demo-3842948374928374982374982374.txt
          version: "1.1"
          headers: {fields: [[Host, domain.in]]}
        server-response: *cacheable
        proxy-response: {status: 200}

      - all: {headers: {fields: [[uuid, prefetch-optional]]}}
        client-request:
          method: GET
          url: /texts/demo-1
          version: "1.1"
          headers: {fields: [[Host, domain.in]]}
        server-response: *cacheable
        proxy-response: {status: 200}

      - all: {headers: {fields: [[uuid, prefetch-empty]]}}
        client-request:
          method: GET
          url: /texts/demo-empty-1
          version: "1.1"
          headers: {fields: [[Host, domain.in]]}
        server-response: *cacheable
        proxy-response: {status: 200}

      - client-request: {method: GET, url: /texts/demo-2.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, simple-2]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-3.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, simple-3]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-4.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, simple-4]]}}
        server-response: *cacheable

      - client-request: {method: GET, url: /texts/demo-3594967639392.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, overflow-2]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-3594967639393.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, overflow-3]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-3594967639394.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, overflow-4]]}}
        server-response: *cacheable

      - client-request: {method: GET, url: /texts/demo-3842948374928374982374982375.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, bignum-2]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-3842948374928374982374982376.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, bignum-3]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-3842948374928374982374982377.txt, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, bignum-4]]}}
        server-response: *cacheable

      - client-request: {method: GET, url: /texts/demo-2, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, optional-2]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-3, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, optional-3]]}}
        server-response: *cacheable
      - client-request: {method: GET, url: /texts/demo-4, version: "1.1", headers: {fields: [[Host, domain.in], [uuid, optional-4]]}}
        server-response: *cacheable
