
urtest:
  description: "Verify access_control plugin token and cookie behavior"
  requires:
    plugins: ["access_control.so"]
  server:
    name: "access-control-origin"
  client:
    name: "access-control-client"
  ats:
    name: "access-control-ts"
    process_config:
      enable_tls: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|access_control"
      proxy.config.http.insert_response_via_str: 2
      proxy.config.ssl.client.alpn_protocols: "http/1.1"
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
    copy_to_config_dir:
      - "etc/hmac_keys.txt"
    remap_config:
      - from: "/"
        to: "https://127.0.0.1:{SERVER_HTTPS_PORT}/"
        plugins:
          - name: "access_control.so"
            args:
              - "--symmetric-keys-map={CONFIG_DIR}/etc/hmac_keys.txt"
              - "--check-cookie=TokenCookie"
              - "--extract-subject-to-header=@TokenSubject"
              - "--extract-tokenid-to-header=@TokenId"
              - "--extract-status-to-header=@TokenStatus"
              - "--token-response-header=TokenRespHdr"

