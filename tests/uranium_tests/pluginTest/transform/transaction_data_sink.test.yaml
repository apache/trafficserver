meta:
  version: "1.0"

urtest:
  description: "Verify transaction data sink response-body logging"
  requires:
    plugins: ["txn_data_sink.so"]
  dns:
    name: "txn-data-sink-dns"
    process_config:
      default: "127.0.0.1"
  server:
    name: "txn-data-sink-origin"
  client:
    name: "txn-data-sink-client"
  ats:
    name: "txn-data-sink-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "txn_data_sink"
    plugin_config:
      - "txn_data_sink.so"
    remap_config:
      - from: "/"
        to: "http://localhost:{SERVER_HTTP_PORT}/"
    log_validation:
      traffic_out:
        contains:
          - expression: '"http1.1_response_body"'
            description: "The response body should be printed by the plugin"

sessions:
- transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: "/test/http11"
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, 1 ]
        - [ Content-Length, 20 ]
        # The example plugin only prints bodies with responses to requests
        # containing The TS-Agent header.
        - [ TS-Agent, 1 ]
      content:
        data: "http1.1_request_body"

    proxy-request:
      headers:
        fields:
        - [ TS-Agent, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 21 ]
      content:
        data: "http1.1_response_body"

    proxy-response:
      status: 200
