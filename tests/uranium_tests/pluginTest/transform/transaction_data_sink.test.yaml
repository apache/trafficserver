meta:
  version: "1.0"

urtest:
  description: "Verify transaction data sink body selection"
  requires:
    plugins: ["txn_data_sink.so"]
  dns:
    name: "txn-data-sink-dns"
    process_config:
      default: "127.0.0.1"
  server:
    name: "txn-data-sink-origin"
  client:
    name: "txn-data-sink-client"
  ats:
    name: "txn-data-sink-ts"
    process_config:
      enable_cache: false
      enable_tls: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|txn_data_sink"
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
    plugin_config:
      - "txn_data_sink.so"
    remap_config:
      - from: "/"
        to: "http://localhost:{SERVER_HTTP_PORT}/"
    log_validation:
      traffic_out:
        contains:
          - {expression: "http1.1_cl_response_body_dumped", description: "The HTTP/1.1 Content-Length response body must be dumped"}
          - {expression: "http1.1_chunked_response_body_dumped", description: "The HTTP/1.1 chunked response body must be dumped"}
          - {expression: "http1.1_cl_request_body_dumped", description: "The HTTP/1.1 Content-Length request body must be dumped"}
          - {expression: "http1.1_chunked_request_body_dumped", description: "The HTTP/1.1 chunked request body must be dumped"}
          - {expression: '"http2_response_body_dumped"', description: "The HTTP/2 response body must be dumped"}
          - {expression: "http2_request_body_dumped", description: "The HTTP/2 request body must be dumped"}
        excludes:
          - {expression: "body_not_dumped", description: "Unselected bodies must not be dumped"}


sessions:
- transactions:

  #---------------------------------------------------------------------------
  # Verify that Content-Length response bodies can be consumed.
  #---------------------------------------------------------------------------
  - client-request:
      method: "POST"
      version: "1.1"
      url: "/test/http11_response"
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, 10 ]
        - [ X-Dump-Response, 1 ]
        - [ Content-Length, 31 ]
      content:
        data: "http1.1_request_body_not_dumped"

    proxy-request:
      headers:
        fields:
        - [ X-Dump-Response, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Length, 31 ]
      content:
        data: "http1.1_cl_response_body_dumped"

    proxy-response:
      status: 200

  #---------------------------------------------------------------------------
  # Verify that chunked response bodies can be consumed.
  #---------------------------------------------------------------------------
  - client-request:
      method: "POST"
      version: "1.1"
      url: "/test/http11_response"
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, 11 ]
        - [ X-Dump-Response, 1 ]
        - [ Content-Length, 31 ]
      content:
        data: "http1.1_request_body_not_dumped"

    proxy-request:
      headers:
        fields:
        - [ X-Dump-Response, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Transfer-Encoding, chunked ]
      content:
        data: "http1.1_chunked_response_body_dumped"

    proxy-response:
      status: 200

  #---------------------------------------------------------------------------
  # Verify that Content-Length request bodies can be consumed.
  #---------------------------------------------------------------------------
  - client-request:
      method: "POST"
      version: "1.1"
      url: "/test/http11_request"
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, 12 ]
        # The example plugin only prints bodies with responses to requests
        # containing The TS-Agent header.
        - [ X-Dump-Request, 1 ]
        - [ Content-Length, 30 ]
      content:
        data: "http1.1_cl_request_body_dumped"

    proxy-request:
      headers:
        fields:
        - [ X-Dump-Request, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Transfer-Encoding, chunked ]
      content:
        data: "http1.1_response_body_not_dumped"

    proxy-response:
      status: 200

  #---------------------------------------------------------------------------
  # Verify that chunked request bodies can be consumed.
  #---------------------------------------------------------------------------
  - client-request:
      method: "POST"
      version: "1.1"
      url: "/test/http11_request"
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, 13 ]
        # The example plugin only prints bodies with responses to requests
        # containing The TS-Agent header.
        - [ X-Dump-Request, 1 ]
        - [ Transfer-Encoding, chunked ]
      content:
        data: "http1.1_chunked_request_body_dumped"

    proxy-request:
      headers:
        fields:
        - [ X-Dump-Request, { as: present } ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Transfer-Encoding, chunked ]
      content:
        data: "http1.1_response_body_not_dumped"

    proxy-response:
      status: 200

- protocol:
    stack: http2
    tls:
      sni: test_sni
  transactions:

  #---------------------------------------------------------------------------
  # Verify that HTTP/2 response bodies can be consumed.
  #---------------------------------------------------------------------------
  - client-request:
      headers:
        fields:
        - [ ":method", POST ]
        - [ ":scheme", https ]
        - [ ":authority", www.example.com ]
        - [ ":path", /test/http2_response ]
        - [ uuid, 20 ]
        - [ X-Dump-Response, 1 ]
      content:
        data: "http2_request_body_not_dumped"

    proxy-request:
      headers:
        fields:
        - [ X-Dump-Response, { as: present } ]

    server-response:
      headers:
        fields:
        - [ ":status", 200 ]
      content:
        data: "http2_response_body_dumped"

    proxy-response:
      status: 200

  #---------------------------------------------------------------------------
  # Verify that HTTP/2 request bodies can be consumed.
  #---------------------------------------------------------------------------
  - client-request:
      headers:
        fields:
        - [ ":method", POST ]
        - [ ":scheme", https ]
        - [ ":authority", www.example.com ]
        - [ ":path", /test/http2_response ]
        - [ uuid, 21 ]
        - [ X-Dump-Request, 1 ]
      content:
        data: "http2_request_body_dumped"

    proxy-request:
      headers:
        fields:
        - [ X-Dump-Request, { as: present } ]

    server-response:
      headers:
        fields:
        - [ ":status", 200 ]
      content:
        data: "http2_response_body_not_dumped"

    proxy-response:
      status: 200
