meta:
  version: "1.0"

urtest:
  description: "Verify the JA4 fingerprint plugin"
  requires: {plugins: [ja4_fingerprint.so]}
  server:
    name: "ja4-origin"
    process_config: {other_args: "--format '{url}'"}
  client: {name: "ja4-client"}
  ats:
    name: "ja4-ts"
    process_config: {enable_cache: false, enable_tls: true}
    records_config:
      proxy.config.proxy_name: "test.proxy.com"
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "ja4_fingerprint|http"
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}"
    plugin_config: ["ja4_fingerprint.so"]
    file_checks:
      - path: "{LOG_DIR}/ja4_fingerprint.log"
        contains: "JA4"
        timeout: 15
    log_validation:
      traffic_out:
        contains:
          - {expression: "JA4 fingerprint:", description: "JA4 fingerprint should be logged"}
  variants:
    - name: "new-headers"
      server: {replay: "ja4_fingerprint_basic_server.replay.yaml"}
      client: {process_config: {keys: "no-existing-headers"}}

    - name: "preserve-existing-headers"
      server: {replay: "ja4_fingerprint.replay.yaml"}
      ats:
        plugin_config: ["ja4_fingerprint.so --preserve"]

sessions:
  - protocol:
      stack: https
      tls:
        sni: localhost
    transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /resource
          headers:
            fields:
              - [Host, localhost]
              - [Content-Length, 0]
              - [uuid, no-existing-headers]
        proxy-response:
          status: 200

  - protocol:
      stack: https
      tls:
        sni: localhost
    transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /resource-with-headers
          headers:
            fields:
              - [Host, localhost]
              - [Content-Length, 0]
              - [uuid, existing-ja4-headers]
              - [ja4, upstream-fingerprint]
              - [x-ja4-via, upstream.proxy.com]
        proxy-response:
          status: 200

  - protocol:
      stack: https
      tls:
        sni: localhost
    transactions:
      - client-request:
          method: GET
          version: "1.1"
          url: /resource-via-only
          headers:
            fields:
              - [Host, localhost]
              - [Content-Length, 0]
              - [uuid, existing-via-only]
              - [x-ja4-via, upstream.proxy.com]
        proxy-response:
          status: 200
