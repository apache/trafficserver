meta: {version: "1.0"}

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, money-remap-00]]}}
        client-request: {method: GET, url: /path, version: "1.1", headers: {fields: [[Host, none]]}}
        server-response: &ok {status: 200, headers: {fields: [[Content-Length, 0], [Connection, close]]}}
        proxy-response: &proxy-ok {status: 200}
      - all: {headers: {fields: [[uuid, money-remap-01]]}}
        client-request: {method: GET, url: /path, version: "1.1", headers: {fields: [[Host, basic]]}}
        server-response: *ok
        proxy-response: *proxy-ok
      - all: {headers: {fields: [[uuid, money-remap-02]]}}
        client-request:
          method: GET
          url: /path
          version: "1.1"
          headers: {fields: [[Host, basic], [X-MoneyTrace, "trace-id=basic;parent-id=foo;span-id=bar"]]}
        server-response: *ok
        proxy-response: *proxy-ok
      - all: {headers: {fields: [[uuid, money-remap-03]]}}
        client-request:
          method: GET
          url: /path
          version: "1.1"
          headers: {fields: [[Host, header], [mt, "trace-id=header;parent-id=foo;span-id=bar"]]}
        server-response: *ok
        proxy-response: *proxy-ok
      - all: {headers: {fields: [[uuid, money-remap-04]]}}
        client-request: {method: GET, url: /path, version: "1.1", headers: {fields: [[Host, pregen]]}}
        server-response: *ok
        proxy-response: *proxy-ok
      - all: {headers: {fields: [[uuid, money-remap-05]]}}
        client-request:
