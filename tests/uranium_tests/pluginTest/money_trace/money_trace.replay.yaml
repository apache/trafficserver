      - all: {headers: {fields: [[uuid, money-remap-07]]}}
        client-request: {method: GET, url: /path, version: "1.1", headers: {fields: [[Host, create]]}}
        server-response: *ok
        proxy-response: *proxy-ok
      - all: {headers: {fields: [[uuid, money-remap-08]]}}
