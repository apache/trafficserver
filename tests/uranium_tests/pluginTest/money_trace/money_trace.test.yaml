      - all: {headers: {fields: [[uuid, money-remap-20]]}}
        client-request: {method: GET, url: /path, version: "1.1", headers: {fields: [[Host, cpregen], [X-MoneyTrace, "trace-id=traceonly"]]}}
        server-response: *ok
