urtest:
  description: "Verify xdebug probe response transformation"
  replay: "x_probe.replay.yaml"
  requires:
    plugins: ["xdebug.so"]
  server:
    name: "x-probe-origin"
  client:
    name: "x-probe-client"
    log_validation:
      contains:
        - {expression: "ATS xDebug Probe Injection Boundary", description: "The multipart probe boundary must be present"}
        - {expression: "xDebugProbeAt", description: "The probe timestamp must be present"}
        - {expression: "'x-no-value' : ''", description: "Headers without values must be represented"}
  ats:
    name: "x-probe-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "xdebug"
    plugin_config:
      - "xdebug.so --enable=probe"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}"
