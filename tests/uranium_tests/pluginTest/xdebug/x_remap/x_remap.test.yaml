meta: {version: "1.0"}

urtest:
  description: "Verify xdebug X-Remap, Probe, and fwd request-header behavior"
  requires: {plugins: [xdebug.so]}
  server: {name: "x-remap-origin"}
  client: {name: "x-remap-client"}
  ats:
    name: "x-remap-ts"
    process_config: {enable_cache: false}
    records_config:
      proxy.config.url_remap.remap_required: 0
      proxy.config.diags.debug.enabled: 0
    plugin_config: ["xdebug.so --enable=x-remap,probe"]
    remap_config:
      - "map http://one http://127.0.0.1:{SERVER_HTTP_PORT}"
      - "map http://two http://127.0.0.1:{SERVER_HTTP_PORT}"
      - "regex_map http://three[0-9]+ http://127.0.0.1:{SERVER_HTTP_PORT}"


sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, x-remap-none]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, none], [X-Debug, "X-Remap, Probe"]]}
        server-response: {status: 599}
        proxy-response:
          status: 500
          headers: {fields: [[X-Remap, "from=Not-Found, to=Not-Found"]]}

      - all: {headers: {fields: [[uuid, x-remap-one]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, one], [X-Debug, "X-Remap, probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, {as: absent}]]}
        server-response: &ok
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response:
          status: 200
          headers: {fields: [[X-Remap, {value: "from=http://one/", as: contains}]]}
          content: &probe {data: "xDebugProbeAt", verify: {as: contains}}

      - all: {headers: {fields: [[uuid, x-remap-two]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "PROBE, X-Remap"]]}
        proxy-request:
          headers: {fields: [[X-Debug, {as: absent}]]}
        server-response: *ok
        proxy-response:
          status: 200
          headers: {fields: [[X-Remap, {value: "from=http://two/", as: contains}]]}
          content: *probe

      - all: {headers: {fields: [[uuid, x-remap-three]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, three123], [X-Debug, "X-Remap, Probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, {as: absent}]]}
        server-response: *ok
        proxy-response:
          status: 200
          headers: {fields: [[X-Remap, {value: "from=http://three[0-9]+/", as: contains}]]}
          content: *probe

      - all: {headers: {fields: [[uuid, x-remap-four]]}}
        client-request:
          method: GET
          url: /not_there
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "X-Remap, Probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, {as: absent}]]}
        server-response:
          status: 404
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response:
          status: 404
          headers: {fields: [[X-Remap, {value: "from=http://two/", as: contains}]]}
          content: *probe

      - all: {headers: {fields: [[uuid, x-remap-fwd-default]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "X-Remap, fwd, Probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, "X-Remap, fwd, Probe"]]}
        server-response: *ok
        proxy-response: {status: 200, content: *probe}

      - all: {headers: {fields: [[uuid, x-remap-fwd-zero]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "X-Remap, fwd=0, Probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, {as: absent}]]}
        server-response: *ok
        proxy-response: {status: 200, content: *probe}

      - all: {headers: {fields: [[uuid, x-remap-fwd-one]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "X-Remap, fwd= 1, Probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, "X-Remap, fwd=0, Probe"]]}
        server-response: *ok
        proxy-response: {status: 200, content: *probe}

      - all: {headers: {fields: [[uuid, x-remap-fwd-large]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "PROBE, X-Remap, fwd = 999999"]]}
        proxy-request:
          headers: {fields: [[X-Debug, "PROBE, X-Remap, fwd=999998"]]}
        server-response: *ok
        proxy-response: {status: 200, content: *probe}

      - all: {headers: {fields: [[uuid, x-remap-fwd-invalid]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, two], [X-Debug, "X-Remap, fwd = 999999xxx, Probe"]]}
        proxy-request:
          headers: {fields: [[X-Debug, {as: absent}]]}
        server-response: *ok
        proxy-response: {status: 200, content: *probe}
