# This replay file tests the stale response plugin when no
# --stale-while-revalidate-default and no --stale-if-error-default are
# specified.

sessions:

- transactions:

  - client-request:
      method: GET
      url: /
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn1 ]
        - [ uuid, 1 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 19, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: |
          small body content
        verify: { as: equal }

  - client-request:
      method: GET
      url: /path
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn1 ]
        - [ uuid, 2 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 404
      headers:
        fields:
        - [ Cache-Control, { value: no-store, as: equal } ]
        - [ Content-Type, { value: text/html, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: Error
        verify: { as: contains }

  - client-request:
      method: GET
      url: /
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn2 ]
        - [ uuid, 3 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 19, as: equal } ]
        - [ Cache-Control, { value: max-age=123, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: |
          small body content
        verify: { as: equal }

  - client-request:
      method: GET
      url: /path
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn3 ]
        - [ uuid, 4 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 19, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: |
          small body content
        verify: { as: equal }

  - client-request:
      method: GET
      url: /
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn4 ]
        - [ uuid, 5 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 412
      headers:
        fields:
        - [ Server, { value: ATS, as: contains } ]

  - client-request:
      method: GET
      url: /
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn5 ]
        - [ uuid, 6 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 10917, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: application/json, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: http://en.wikipedia.org/wiki/Main_Page
        verify: { as: contains }

  - client-request:
      method: GET
      url: /
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn6 ]
        - [ uuid, 7 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 0, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]

  - client-request:
      method: GET
      url: /path
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn7 ]
        - [ uuid, 8 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 19, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: |
          small body content
        verify: { as: equal }

  - client-request:
      method: GET
      url: /path
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn8 ]
        - [ uuid, 8 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 19, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: |
          small body content
        verify: { as: equal }

  - client-request:
      method: GET
      url: /small_body.txt
      version: '1.1'
      headers:
        fields:
        - [ Host, fqdn9 ]
        - [ uuid, 9 ]

    proxy-request:
      expect: absent

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: 19, as: equal } ]
        - [ Cache-Control, { value: no-cache, as: equal } ]
        - [ Content-Type, { value: text/plain, as: equal } ]
        - [ Server, { value: ATS, as: contains } ]
      content:
        encoding: plain
        data: |
          small body content
        verify: { as: equal }
