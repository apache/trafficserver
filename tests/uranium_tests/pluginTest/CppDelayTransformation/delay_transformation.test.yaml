meta: {version: "1.0"}
urtest:
  description: The C++ delayed transformation preserves every response byte.
  requires: {plugins: [DelayTransformationPlugin.so]}
  server: {name: origin}
  client: {name: client}
  ats:
    name: ts
    plugin_config: [DelayTransformationPlugin.so]
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: delay_transformation
    remap_config:
      - "map http://xyz/ http://127.0.0.1:{SERVER_HTTP_PORT}/"
sessions:
  - transactions:
      - client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, xyz], [uuid, delayed]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 51], [Connection, close]]}
          content: {encoding: plain, data: "12345678901234567890123456789012345678901234567890\n"}
        proxy-response:
          status: 200
          content: {encoding: plain, data: "12345678901234567890123456789012345678901234567890\n", verify: {as: equal}}
