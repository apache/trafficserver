urtest:
  description: "Verify TSHttpTxnServerAddrSet redirects the origin connection"
  replay: "test_TSHttpTxnServerAddrSet.replay.yaml"
  dns:
    name: "server-addr-dns"
    process_config:
      default: ["127.0.0.1"]
  server:
    name: "server-addr-origin"
    log_validation:
      contains:
        - {expression: "redirect-succeeded", description: "The origin must send the redirected response"}
  client:
    name: "server-addr-client"
    log_validation:
      contains:
        - {expression: "redirect-succeeded", description: "The client must receive the redirected response"}
  ats:
    name: "server-addr-ts"
    copy_custom_plugin:
      - "{AtsBuildUraniumTestsDir}/pluginTest/tsapi/.libs/test_TSHttpTxnServerAddrSet.so"
    plugin_config:
      - "test_TSHttpTxnServerAddrSet.so 127.0.0.1 {SERVER_HTTP_PORT}"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|dns|hostdb|test_plugin"
    remap_config:
      - from: "/"
        to: "http://non.existent.server.com:{UNUSED_PORT}"
