urtest:
  description: "Verify TSHttpTxnVerifiedAddrSet supplies the inbound address to header_rewrite"
  replay: "test_TSHttpTxnVerifiedAddr.replay.yaml"
  requires: {plugins: [header_rewrite.so]}
  server: {name: "verified-address-origin"}
  client: {name: "verified-address-client"}
  ats:
    name: "verified-address-ts"
    process_config: {enable_cache: false}
    copy_custom_plugin:
      - "{AtsBuildUraniumTestsDir}/pluginTest/tsapi/.libs/test_TSHttpTxnVerifiedAddr.so"
    copy_to_config_dir: ["hrw_verified_addr.conf"]
    plugin_config:
      - "test_TSHttpTxnVerifiedAddr.so"
      - "header_rewrite.so --inbound-ip-source=PLUGIN {CONFIG_DIR}/hrw_verified_addr.conf"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|test_TSHttpTxnVerifiedAddr"
    remap_config:
      - "map /get http://127.0.0.1:{SERVER_HTTP_PORT}/get"
