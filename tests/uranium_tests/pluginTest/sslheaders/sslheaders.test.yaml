meta: {version: "1.0"}

urtest:
  description: "Verify sslheaders removes a forged client-certificate header"
  requires: {plugins: [sslheaders.so]}
  server: {name: "sslheaders-origin"}
  client: {name: "sslheaders-client"}
  ats:
    name: "sslheaders-ts"
    process_config: {enable_tls: true, enable_cache: false}
    records_config:
      proxy.config.proxy_name: "Poxy_Proxy"
      proxy.config.diags.debug.enabled: 0
      proxy.config.diags.debug.tags: "http"
    plugin_config: ["sslheaders.so SSL-Client-ID=client.subject"]
    remap_config:
      - "map https://bar.com http://127.0.0.1:{SERVER_HTTP_PORT}"


sessions:
  - protocol: {stack: https}
    transactions:
      - all: {headers: {fields: [[uuid, sslheaders-forged-id]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, bar.com], [SSL-Client-ID, "My Fake Client ID"]]}
        proxy-request:
          headers: {fields: [[SSL-Client-ID, {as: absent}]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: {status: 200}
