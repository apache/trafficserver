meta: {version: "1.0"}

urtest:
  description: "Verify focused Lua remap APIs"
  requires: {plugins: [tslua.so]}
  server: {name: "origin"}
  client: {name: "client"}
  ats:
    name: "ts"
    process_config: {enable_cache: false, command: traffic_manager}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "ts_lua"
  variants:
    - name: "watermark"
      client:
        process_config: {keys: "lua-watermark"}
      ats:
        copy_to_config_dir: ["watermark.lua"]
        remap_config:
          - "map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=tslua.so @pparam={CONFIG_DIR}/watermark.lua"
        file_checks:
          - {path: "{LOG_DIR}/traffic.out", contains: 'WMbytes\(31337\)'}

    - name: "remap-after-hook"
      client:
        process_config: {keys: "lua-remap-after-hook"}
      ats:
        copy_to_config_dir: ["remap_after_hook.lua"]
        remap_config:
          - "map http://www.example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=tslua.so @pparam={CONFIG_DIR}/remap_after_hook.lua"

    - name: "header-table"
      server: {enabled: false}
      client:
        process_config: {keys: "lua-header-table"}
      ats:
        copy_to_config_dir: ["header_table.lua"]
        remap_config:
          - "map / http://127.0.0.1 @plugin=tslua.so @pparam={CONFIG_DIR}/header_table.lua"

    - name: "debug-tags"
      server: {enabled: false}
      client:
        process_config: {keys: "lua-debug-tags"}
      ats:
        records_config:
          proxy.config.diags.debug.tags: "foo|ts_lua"
        copy_to_config_dir: ["tags.lua"]
        remap_config:
          - "map http://test/ http://127.0.0.1/ @plugin=tslua.so @pparam={CONFIG_DIR}/tags.lua"

    - name: "states-and-stats"
      server: {enabled: false}
      client:
        process_config: {keys: "lua-states-stats"}
      ats:
        environment:
          URTEST_TEST_DIR: "{TEST_DIR}"
          PROXY_CONFIG_LOG_LOGFILE_DIR: "{LOG_DIR}"
        records_config:
          proxy.config.plugin.lua.max_states: 4
        copy_to_config_dir: ["hello.lua", "global.lua"]
        plugin_config:
          - "tslua.so {CONFIG_DIR}/global.lua"
        remap_config:
          - "map http://hello/ http://127.0.0.1/ @plugin=tslua.so @pparam={CONFIG_DIR}/hello.lua"
        pre_client_commands:
          - 'traffic_ctl config match lua | grep -F "proxy.config.plugin.lua.max_states: 4"'
        post_client_commands:
          - 'bash "{TEST_DIR}/metrics.sh"'
          - 'bash "{TEST_DIR}/lifecycle_stats.sh"'

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, lua-watermark]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 0]]}
        proxy-response: {status: 200}

      - all: {headers: {fields: [[uuid, lua-remap-after-hook]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 2]]}
          content: {data: "ok", size: 2}
        proxy-response:
          status: 200
          headers:
            fields:
              - [Remap-From-Host, {value: www.example.com, as: equal}]
              - [Hook-From-Host, {value: "<nil>", as: equal}]

      - all: {headers: {fields: [[uuid, lua-header-table]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers:
            fields:
              - [Host, example.com]
              - [X-Test, test1]
              - [X-Test, test2]
        server-response: {status: 599}
        proxy-response:
          status: 200
          content: {data: "test1test2", verify: {as: equal}}

      - all: {headers: {fields: [[uuid, lua-debug-tags]]}}
        client-request:
          method: GET
          url: /test.html
          version: "1.1"
          headers: {fields: [[Host, test]]}
        server-response: {status: 599}
        proxy-response:
          status: 200
          content: {data: " default foo ts_lua", verify: {as: equal}}

      - all: {headers: {fields: [[uuid, lua-states-stats]]}}
        client-request:
          method: GET
          url: /hello
          version: "1.1"
          headers: {fields: [[Host, hello]]}
        server-response: {status: 599}
        proxy-response:
          status: 200
          content: {data: "Hello, World", verify: {as: equal}}
