meta: {version: "1.0"}

urtest:
  description: "Verify ts.fetch completes an inner request with an IPv6 client address"
  requires: {plugins: [tslua.so]}
  server:
    name: origin
    process_config:
      other_args: '--format "{url}"'
  client:
    name: client
    process_config:
      keys: "/"
      other_args: '--format "{url}"'
  ats:
    name: ts
    copy_to_config_dir: ["fetch_ipv6_cliaddr.lua"]
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=tslua.so @pparam={CONFIG_DIR}/fetch_ipv6_cliaddr.lua"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "ts_lua"

sessions:
  - transactions:
      - client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 5]]}
          content: {data: "outer", size: 5}
        proxy-response:
          status: 200
          headers:
            fields:
            - - Sub-Status
              - value: '200'
                as: equal
            - - Sub-Body-Len
              - value: '5'
                as: equal
      - client-request:
          method: GET
          url: /inner.txt
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 5]]}
          content: {data: "AAAAA", size: 5}
