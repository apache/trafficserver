meta: {version: "1.0"}

urtest:
  description: "Verify ts.server_request APIs fail safely before a server request exists"
  requires: {plugins: [tslua.so]}
  server: {name: "lua-server-request-origin"}
  client: {name: "lua-server-request-client"}
  ats:
    name: "lua-server-request-ts"
    process_config: {enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "ts_lua"
    copy_to_config_dir: ["server_request_guard.lua"]
    remap_config:
      - "map http://www.example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=tslua.so @pparam=server_request_guard.lua"

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, lua-server-request-guard]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 2], [Connection, close]]}
          content: {data: "ok", size: 2}
        proxy-response:
          status: 200
          headers:
            fields:
              - [Early-Server-Header, {value: "<nil>", as: equal}]
              - [Early-Server-Header-Table, {value: "<nil>", as: equal}]
              - [Early-Server-Headers, {value: "<nil>", as: equal}]
              - [Early-Server-Uri, {value: "<nil>", as: equal}]
              - [Early-Server-Uri-Args, {value: "<nil>", as: equal}]
              - [Early-Server-Method, {value: "<nil>", as: equal}]
              - [Early-Server-Url-Host, {value: "<nil>", as: equal}]
              - [Early-Server-Url-Scheme, {value: "<nil>", as: equal}]
              - [Early-Server-Version, {value: "<nil>", as: equal}]
