meta:
    version: '1.0'

urtest:
  description: "Verify Lua can replace an error response"
  requires:
    plugins: ["tslua.so"]
  dns:
    name: "lua-error-dns"
    process_config:
      default: "127.0.0.1"
  server:
    name: "lua-error-origin"
  client:
    name: "lua-error-client"
    log_validation:
      contains:
        - {expression: "HTTP/1.1 418", description: "The client must receive the replacement status"}
        - {expression: "bad luck", description: "The client must receive the replacement body"}
  ats:
    name: "lua-error-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "ts_lua|http"
    copy_to_config_dir:
      - "set_error_response.lua"
    remap_config:
      - "map / http://backend.example.com:{SERVER_HTTP_PORT}/ @plugin=tslua.so @pparam={CONFIG_DIR}/set_error_response.lua"


sessions:

- transactions:
  - client-request:
      method: GET
      url: /some/path/flower.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Type, image/jpeg ]
        - [ Content-Length, '0' ]
        - [ uuid, first-request ]

    server-response:
        status: 200
        reason: OK
        headers:
          fields:
          - [ Date, "Sat, 16 Mar 2019 03:11:36 GMT" ]
          - [ Content-Type, image/jpeg ]
          - [ Transfer-Encoding, chunked ]
          - [ Connection, keep-alive ]
        content:
          size: 3432

    # The lua script modifies the response to be a 418.
    proxy-response:
      status: 418
      content:
        verify: {value: 'bad luck :(', as: equal}
