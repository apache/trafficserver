meta:
  version: "1.0"

urtest:
  description: Verify a GCP bearer token longer than the former stack buffer reaches the origin intact
  requires:
    plugins: [origin_server_auth.so]
  server:
    name: origin
  client:
    name: client
  ats:
    name: ts
    process_config:
      enable_cache: false
    remap_config:
      - from: "http://www.example.com/long-gcp-token"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/long-gcp-token"
        plugins:
          - name: origin_server_auth.so
            args:
              - --access_key
              - "1234567"
              - --session_token
              - "gcp-token--tail-after-stack-buffer"
              - --version
              - gcpv1

sessions:
  - transactions:
      - client-request:
          method: GET
          url: /long-gcp-token
          version: "1.1"
          headers:
            fields:
              - [Host, www.example.com]
              - [uuid, long-gcp-token]
        proxy-request:
          headers:
            fields:
              - [Authorization, {value: "Bearer gcp-token--tail-after-stack-buffer", as: equal}]
        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 8]
          content:
            encoding: plain
            data: success!
        proxy-response:
          status: 200
          headers:
            fields:
              - [Content-Length, {value: 8, as: equal}]
          content:
            encoding: plain
            data: success!
            verify: {as: equal}
