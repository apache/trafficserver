urtest:
  description: "Verify global, session, transaction, and TLS hooks"
  replay: "hooks.replay.yaml"
  server: {name: "hooks-origin"}
  client:
    name: "hooks-client"
    process_config: {keys: "hook-cleartext"}
  ats:
    name: "hooks-ts"
    process_config: {enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "test"
      proxy.config.diags.show_location: 0
      proxy.config.url_remap.remap_required: 0
    remap_config:
      - "map http://one http://127.0.0.1:{SERVER_HTTP_PORT}"
  variants:
    - name: "add-hooks"
      ats:
        copy_custom_plugin: ["{AtsTestPluginsDir}/hook_add_plugin.so"]
        plugin_config: ["hook_add_plugin.so"]
        log_validation:
          traffic_out: {gold_file: "hook_add.gold"}

    - name: "reschedule-session-start"
      ats:
        copy_custom_plugin: ["{AtsTestPluginsDir}/hook_add_plugin.so"]
        plugin_config: ["hook_add_plugin.so -delay"]
        log_validation:
          traffic_out: {gold_file: "ssn_delay.gold"}
