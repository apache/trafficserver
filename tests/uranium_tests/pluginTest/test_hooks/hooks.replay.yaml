meta: {version: "1.0"}

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, hook-cleartext]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, one]]}
        server-response: &ok
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: {status: 200}

  - protocol:
      stack: http2
      tls: {sni: one}
    transactions:
      - all: {headers: {fields: [[uuid, hook-http2]]}}
        client-request:
          headers:
            fields:
              - [":method", GET]
              - [":scheme", https]
              - [":authority", one]
              - [":path", /argh]
        server-response: *ok
        proxy-response: {status: 200}

  - protocol:
      stack: https
      tls: {sni: one}
    transactions:
      - all: {headers: {fields: [[uuid, hook-https]]}}
        client-request:
          method: GET
          url: /argh
          version: "1.1"
          headers: {fields: [[Host, one]]}
        server-response: *ok
        proxy-response: {status: 200}
