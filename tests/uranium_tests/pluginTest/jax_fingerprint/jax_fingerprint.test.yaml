      logging_yaml:
        logging:
          formats:
          - name: jax_custom
            format: 'JA4H: %<jaxja4h>'
          logs:
          - filename: jax_log_field
            format: jax_custom
      file_checks:
      - path: '{LOG_DIR}/jax_fingerprint.log'
        contains: 'JA4H: [a-z0-9_-]+'
      - path: '{LOG_DIR}/jax_log_field.log'
        contains: 'JA4H: [a-z0-9]'
