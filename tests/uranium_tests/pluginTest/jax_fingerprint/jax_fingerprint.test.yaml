meta:
  version: '1.0'
urtest:
  description: Verify jax_fingerprint setup, methods, modes, protocols, and SNI filtering
  requires:
    plugins:
    - jax_fingerprint.so
  dns:
    name: dns
    process_config:
      default: 127.0.0.1
  server:
    name: origin
  client:
    name: client
  ats:
    name: ts
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.ssl.client.verify.server.policy: PERMISSIVE
      proxy.config.proxy_name: test.proxy.test
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: jax_fingerprint|http
      proxy.config.log.max_secs_per_buffer: 1
  variants:
  - name: global-ja4h-overwrite
    replay: jax_fingerprint_global.replay.yaml
    ats:
      plugin_config:
      - jax_fingerprint.so jax_fingerprint.yaml
      remap_config:
      - map http://jax.server.test http://jax.backend.test:{SERVER_HTTP_PORT}
      file_checks:
      - path: '{LOG_DIR}/jax_fingerprint.log'
        contains: 'JA4H: [a-z0-9_-]+'
      inline_config_files:
        jax_fingerprint.yaml: |
          jax_fingerprint:
            fingerprints:
            - method: JA4H
              header: x-jax
              via_header: x-jax-via
              log_filename: jax_fingerprint
              standalone: true
    server:
      log_validation:
        contains:
        - expression: '(?i)x-jax:'
          description: The expected fingerprinted request reaches the origin.
  - name: global-ja3-overwrite
    replay: jax_fingerprint_tls.replay.yaml
    ats:
      plugin_config:
      - jax_fingerprint.so jax_fingerprint.yaml
      remap_config:
      - map https://jax.server.test https://jax.backend.test:{SERVER_HTTPS_PORT}
      file_checks:
      - path: '{LOG_DIR}/jax_fingerprint.log'
        contains: 'JA3: [a-z0-9_-]+'
      inline_config_files:
        jax_fingerprint.yaml: |
          jax_fingerprint:
            fingerprints:
            - method: JA3
              header: x-jax
              via_header: x-jax-via
              log_filename: jax_fingerprint
              standalone: true
    server:
      log_validation:
        contains:
        - expression: '(?i)x-jax:'
          description: The expected fingerprinted request reaches the origin.
  - name: remap-ja4h
    replay: jax_fingerprint_remap.replay.yaml
    ats:
      remap_config:
      - map http://jax-no-plugin.server.test http://jax.backend.test:{SERVER_HTTP_PORT}
      - map http://jax.server.test http://jax.backend.test:{SERVER_HTTP_PORT} @plugin=jax_fingerprint.so @pparam=jax_fingerprint_remap.yaml
      file_checks:
      - path: '{LOG_DIR}/jax_fingerprint.log'
        contains: 'JA4H: [a-z0-9_-]+'
      inline_config_files:
        jax_fingerprint_remap.yaml: |
          jax_fingerprint:
            fingerprints:
            - method: JA4H
              header: x-jax
              via_header: x-jax-via
              log_filename: jax_fingerprint
    server:
      log_validation:
        contains:
        - expression: '(?i)x-jax:'
          description: The expected fingerprinted request reaches the origin.
        - expression: remap-plugin-request
          description: The expected fingerprinted request reaches the origin.
  - name: remap-ja3-standalone
    replay: jax_fingerprint_remap_tls.replay.yaml
    ats:
      remap_config:
      - map https://jax-no-plugin.server.test https://jax.backend.test:{SERVER_HTTPS_PORT}
      - map https://jax.server.test https://jax.backend.test:{SERVER_HTTPS_PORT} @plugin=jax_fingerprint.so @pparam=jax_fingerprint_remap.yaml
