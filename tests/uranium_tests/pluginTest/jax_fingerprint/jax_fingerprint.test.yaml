      - jax_fingerprint.so jax_fingerprint.yaml
      remap_config:
      - map https://jax.server.test https://jax.backend.test:{SERVER_HTTPS_PORT}
      file_checks:
      - path: '{LOG_DIR}/traffic.out'
        contains: 'Using shared user_arg: type=txn, name=test.jax.registry, method=JA4H, index=[0-9]+'
        matches:
        - expression: 'Reserved shared user_arg slot: type=vconn, name=test.jax.registry, index=[0-9]+'
          min: 1
          max: 1
        - expression: 'Reserved shared user_arg slot: type=txn, name=test.jax.registry, index=[0-9]+'
          min: 1
          max: 1
        - expression: 'Using shared user_arg: type=vconn, name=test.jax.registry, method=JA3, index=([0-9]+)[\s\S]*Using shared
            user_arg: type=vconn, name=test.jax.registry, method=JA4, index=\1'
          min: 1
          max: 1
      inline_config_files:
        jax_fingerprint.yaml: |
          jax_fingerprint:
            fingerprints:
            - method: JA3
              header: x-ja3
              standalone: true
              export: test.jax.registry
            - method: JA4
              header: x-ja4
              standalone: true
              export: test.jax.registry
            - method: JA4H
              header: x-ja4h
              standalone: true
              export: test.jax.registry
      log_validation:
        diags_log:
          excludes:
          - expression: multiple loading of plugin
            description: A multi-method YAML file loads the plugin only once.
    server:
      log_validation:
        contains:
        - expression: '(?i)x-ja3:'
          description: The expected fingerprinted request reaches the origin.
        - expression: '(?i)x-ja4:'
          description: The expected fingerprinted request reaches the origin.
