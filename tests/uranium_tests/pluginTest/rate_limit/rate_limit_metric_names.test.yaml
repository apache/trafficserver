meta: {version: "1.0"}

urtest:
  description: "Verify rate_limit metrics use prefix.type.tag names"
  requires: {plugins: [rate_limit.so]}
  server: {name: "rate-limit-metric-origin"}
  client: {name: "rate-limit-metric-client"}
  ats:
    name: "rate-limit-metric-ts"
    process_config: {enable_cache: false}
    copy_to_config_dir: ["rate_limit_metric_names.yaml"]
    plugin_config: ["rate_limit.so {CONFIG_DIR}/rate_limit_metric_names.yaml"]
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}/"
    post_client_commands:
      - 'traffic_ctl metric match sni > "{ATS_ROOT}/metrics.txt"'
    file_checks:
      - {path: "{ATS_ROOT}/metrics.txt", contains: "myprefix.sni.mytag.queued"}
      - {path: "{ATS_ROOT}/metrics.txt", excludes: "mytag.sni.myprefix"}
      - {path: "{ATS_ROOT}/metrics.txt", contains: "plugin.rate_limiter.sni.onlytag.queued"}
      - {path: "{ATS_ROOT}/metrics.txt", excludes: "onlytag.sni.plugin.rate_limiter"}
      - {path: "{ATS_ROOT}/metrics.txt", contains: "onlyprefix.sni.prefixonly.example.com.queued"}
      - {path: "{ATS_ROOT}/metrics.txt", excludes: "prefixonly.example.com.sni.onlyprefix"}

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, rate-limit-metric-names]]}}
        client-request:
          method: GET
          url: /health
          version: "1.1"
          headers: {fields: [[Host, metrics.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 2], [Connection, close]]}
          content: {data: "OK", size: 2}
        proxy-response: {status: 200}
