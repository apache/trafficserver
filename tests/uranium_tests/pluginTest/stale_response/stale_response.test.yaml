# This replay file tests the stale response plugin when no
# --stale-while-revalidate-default and no --stale-if-error-default are
# specified.

urtest:
  description: "Verify stale_response plugin options"
  requires:
    plugins: ["stale_response.so"]
  server:
    name: "stale-response-origin"
  client:
    name: "stale-response-client"
  ats:
    name: "stale-response-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|stale_response"
      proxy.config.http.server_session_sharing.pool: "global"
      proxy.config.http.negative_revalidating_enabled: 0
      proxy.config.log.rolling_enabled: 0
  variants:
    - name: "global-no-defaults"
      ats:
        plugin_config: ["stale_response.so --log-all --log-filename stale_responses"]
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-while-revalidate:.*stale.jpeg"}
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-if-error:.*error.jpeg"}
    - name: "global-default-directives"
      replay: "stale_response_with_defaults.replay.yaml"
      ats:
        plugin_config: ["stale_response.so --log-all --log-filename stale_responses --stale-while-revalidate-default 30 --stale-if-error-default 30"]
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-while-revalidate:.*stale.jpeg"}
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-if-error:.*error.jpeg"}
    - name: "global-force-swr"
      replay: "stale_response_with_force_swr.replay.yaml"
      ats:
        plugin_config: ["stale_response.so --log-all --log-filename stale_responses --force-stale-while-revalidate 30"]
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-while-revalidate:.*stale.jpeg"}
    - name: "global-force-sie"
      replay: "stale_response_with_force_sie.replay.yaml"
      ats:
        plugin_config: ["stale_response.so --log-all --log-filename stale_responses --force-stale-if-error 30"]
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-if-error:.*error.jpeg"}
    - name: "global-max-memory"
      replay: "stale_response_max_memory.replay.yaml"
      ats:
        plugin_config: ["stale_response.so --log-all --log-filename stale_responses --max-memory-usage 256"]
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/"]
        log_validation:
          traffic_out:
            contains:
              - {expression: "response exceeded memory limit; sending stale data", description: "The plugin must use stale data after exceeding its memory limit"}
    - name: "remap-no-defaults"
      ats:
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=stale_response.so @pparam=--log-all @pparam=--log-filename @pparam=stale_responses"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-while-revalidate:.*stale.jpeg"}
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-if-error:.*error.jpeg"}
    - name: "remap-default-directives"
      replay: "stale_response_with_defaults.replay.yaml"
      ats:
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=stale_response.so @pparam=--log-all @pparam=--log-filename @pparam=stale_responses @pparam=--stale-while-revalidate-default @pparam=30 @pparam=--stale-if-error-default @pparam=30"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-while-revalidate:.*stale.jpeg"}
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-if-error:.*error.jpeg"}
    - name: "remap-force-swr"
      replay: "stale_response_with_force_swr.replay.yaml"
      ats:
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=stale_response.so @pparam=--log-all @pparam=--log-filename @pparam=stale_responses @pparam=--force-stale-while-revalidate @pparam=30"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-while-revalidate:.*stale.jpeg"}
    - name: "remap-force-sie"
      replay: "stale_response_with_force_sie.replay.yaml"
      ats:
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=stale_response.so @pparam=--log-all @pparam=--log-filename @pparam=stale_responses @pparam=--force-stale-if-error @pparam=30"]
        file_checks:
          - {path: "{LOG_DIR}/stale_responses.log", contains: "stale-if-error:.*error.jpeg"}
    - name: "remap-max-memory"
      replay: "stale_response_max_memory.replay.yaml"
      ats:
        remap_config: ["map / http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=stale_response.so @pparam=--log-all @pparam=--log-filename @pparam=stale_responses @pparam=--max-memory-usage @pparam=256"]
        log_validation:
          traffic_out:
            contains:
              - {expression: "response exceeded memory limit; sending stale data", description: "The remap plugin must use stale data after exceeding its memory limit"}

sessions:

- transactions:

  - client-request:
      method: GET
      url: /pictures/stale.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Type, image/jpeg ]
        - [ uuid, first-request ]

    # Note: only a 1 second max-age.
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, image/jpeg ]
        - [ Content-Length, 100 ]
        - [ Connection, keep-alive ]
        - [ Cache-Control, max-age=1 ]
        - [ X-Response, first-response ]

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Cache-Control, { value: max-age=1, as: equal } ]
        - [ X-Response, { value: first-response, as: equal } ]

  - client-request:

      # Now age it out.
      delay: 2s

      method: GET
      url: /pictures/stale.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Type, image/jpeg ]
        - [ uuid, second-request ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, image/jpeg ]
        - [ Content-Length, 100 ]
        - [ Connection, keep-alive ]
        # Note the stale-while-revalidate for the third response (not this).
        # Also, verify that we can use comma separated directives.
        - [ Cache-Control, "max-age=1, stale-while-revalidate=30" ]
        - [ X-Response, second-response ]

    # We better have gone back to the origin and gotten second-response.
    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: second-response, as: equal } ]

  - client-request:

      # Now age it out, but expect stale-while-revalidate to override.
      delay: 2s

      method: GET
      url: /pictures/stale.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Type, image/jpeg ]
        - [ uuid, third-request ]

    # We don't expect the request to go to the origin.
    server-response:
      status: 404
      reason: Not Found
      headers:
        fields:
        - [ X-Response, third-response ]

    # Expect the stale second response because of stale-while-revalidate.
    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: second-response, as: equal } ]

  # Test stale-if-error.
  - client-request:

      method: GET
      url: /pictures/error.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Type, image/jpeg ]
        - [ uuid, fourth-request ]

    # Populate a cached response for error.jpeg with stale-if-error.
    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, image/jpeg ]
        - [ Content-Length, 100 ]
        - [ Connection, keep-alive ]
        - [ Cache-Control, "max-age=1, stale-if-error=30" ]
        - [ X-Response, fourth-response ]

    # We better have gone back to the origin and gotten second-response.
    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: fourth-response, as: equal } ]

  # Now, age out the error.jpeg but reply with a 500. Expect the stale cached response.
  - client-request:

      delay: 2s

      method: GET
      url: /pictures/error.jpeg
      version: '1.1'
      headers:
        fields:
        - [ Host, www.example.com ]
        - [ Content-Type, image/jpeg ]
        - [ uuid, fifth-request ]

    # Populate a cached response for error.jpeg with stale-if-error.
    server-response:
      status: 500
      reason: Internal Server Error
      headers:
        fields:
        - [ X-Response, fifth-response ]

    # Expect the stale response due to stale-if-error.
    proxy-response:
      status: 200
      headers:
        fields:
        - [ X-Response, { value: fourth-response, as: equal } ]
