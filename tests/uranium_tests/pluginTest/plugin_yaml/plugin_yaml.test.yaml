urtest:
  description: "Verify plugin.yaml inline configuration and disabled plugin entries"
  replay: "plugin_yaml.replay.yaml"
  requires: {plugins: [header_rewrite.so, xdebug.so]}
  server: {name: "plugin-yaml-origin"}
  client: {name: "plugin-yaml-client"}
  ats:
    name: "plugin-yaml-ts"
    process_config: {enable_cache: false}
    records_config:
      proxy.config.url_remap.remap_required: 0
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "header_rewrite|plugin"
    remap_config:
      - "map http://example.com http://127.0.0.1:{SERVER_HTTP_PORT}"
    inline_config_files:
      plugin.yaml: |
        plugins:
          - path: header_rewrite.so
            config: |
              cond %{SEND_RESPONSE_HDR_HOOK}
                set-header X-Plugin-YAML "loaded-from-inline"
          - path: xdebug.so
            enabled: false
            params: ["--enable=x-cache"]
    file_checks:
      - {path: "{LOG_DIR}/diags.log", contains: "plugin.yaml loading"}
      - {path: "{LOG_DIR}/diags.log", contains: "skipped"}
