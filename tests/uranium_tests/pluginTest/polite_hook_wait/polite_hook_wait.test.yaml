urtest:
  description: "Verify a transaction hook can wait for worker-thread results without blocking an event thread"
  replay: "polite_hook_wait.replay.yaml"
  server: {name: "polite-hook-origin"}
  client: {name: "polite-hook-client"}
  ats:
    name: "polite-hook-ts"
    process_config: {enable_cache: false}
    records_config:
      proxy.config.proxy_name: "Poxy_Proxy"
      proxy.config.url_remap.remap_required: 1
      proxy.config.diags.debug.enabled: 3
      proxy.config.diags.debug.tags: "polite_hook_wait"
    copy_custom_plugin:
      - "{AtsBuildUraniumTestsDir}/pluginTest/polite_hook_wait/.libs/polite_hook_wait.so"
    plugin_config: ["polite_hook_wait.so"]
    remap_config:
      - "map http://myhost.test http://127.0.0.1:{SERVER_HTTP_PORT}"
