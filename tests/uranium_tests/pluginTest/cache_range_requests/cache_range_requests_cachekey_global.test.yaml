meta:
  version: "1.0"

urtest:
  description: "Use Range in the global cachekey while cache_range_requests preserves it"
  requires:
    plugins: ["cache_range_requests.so", "cachekey.so", "xdebug.so"]
  server:
    name: "server"
  client:
    name: "client"
  ats:
    name: "ts"
    plugin_config:
      - "cachekey.so --include-headers=Range --static-prefix=foo"
      - "cache_range_requests.so --no-modify-cachekey"
      - "xdebug.so --enable=x-cache,x-cache-key,x-parentselection-key"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "cachekey|cache_range_requests"
    remap_config:
      - "map http://www.example.com http://127.0.0.1:{SERVER_HTTP_PORT}"

sessions:
  - transactions:
      - client-request:
          method: "GET"
          url: "/path"
          version: "1.1"
          headers:
            fields:
              - [Host, www.example.com]
              - [Accept, "*/*"]
              - [Range, "bytes=0-"]
              - [x-debug, x-cache-key]
              - [uuid, crr-cachekey-global]

        proxy-request:
          method: "GET"
          url: "/path"
          headers:
            fields:
              - [Range, {value: "bytes=0-", as: equal}]
              - [uuid, {value: crr-cachekey-global, as: equal}]

        server-response:
          status: 206
          reason: "Partial Content"
          headers:
            fields:
              - [Accept-Ranges, bytes]
              - [Etag, '"foo"']
              - [Cache-Control, "public, max-age=500"]
              - [Content-Range, "bytes 0-18/18"]
              - [Content-Length, "18"]
          content:
            data: "lets go surfin now"

        proxy-response:
          status: 206
          headers:
            fields:
              - [X-Cache-Key, {value: "/foo/Range:bytes=0-/path", as: equal}]
              - [Content-Length, {value: "18", as: equal}]
          content:
            data: "lets go surfin now"
