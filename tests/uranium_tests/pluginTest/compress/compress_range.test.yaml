urtest:
  description: "Verify compress plugin range-request behavior"
  replay: "replay/compress-and-range.replay.yaml"
  requires:
    plugins: ["compress.so"]
  server:
    name: "compress-range-origin"
  client:
    name: "compress-range-client"
  ats:
    name: "compress-range-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|compress"
      proxy.config.http.insert_response_via_str: 2
    copy_to_config_dir:
      - "etc/cache-true-remove-range.config"
      - "etc/cache-true-remove-accept-encoding.config"
      - "etc/cache-true-no-compression.config"
    remap_config:
      - "map /cache-true-remove-range/ http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=compress.so @pparam={CONFIG_DIR}/etc/cache-true-remove-range.config"
      - "map /cache-true-remove-accept-encoding/ http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=compress.so @pparam={CONFIG_DIR}/etc/cache-true-remove-accept-encoding.config"
      - "map /cache-true-no-compression/ http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=compress.so @pparam={CONFIG_DIR}/etc/cache-true-no-compression.config"
