meta:
  version: '1.0'
urtest:
  description: Cookie remap preserves matrix parameters through path and query substitutions.
  requires:
    plugins:
    - cookie_remap.so
  server:
    name: origin
  client:
    name: client
  ats:
    name: ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: cookie_remap.*|http.*|dns.*
    inline_config_files:
      matrixconfig.txt: "# This is a test configuration\n\n# Do a regex against the url\n\nop:\n  operation: regex\n  regex:\
        \ eleventh\n  sendto: http://127.0.0.1:{SERVER_HTTP_PORT}/$path/eleventh;matrix=2?query=true\n\nop:\n  operation:\
        \ regex\n  regex: tenth\n  sendto: http://127.0.0.1:{SERVER_HTTP_PORT}/$path/tenth;matrix=2\n\nop:\n  operation: regex\n\
        \  regex: ninth\n  sendto: http://127.0.0.1:{SERVER_HTTP_PORT}/$path/ninth?query=true\n\nop:\n  operation: regex\n\
        \  regex: eighth\n  sendto: http://127.0.0.1:{SERVER_HTTP_PORT}/$path/eighth\n\n"
    remap_config:
    - map http://www.example.com/eighth http://shouldnothit.com/eighth @plugin=cookie_remap.so @pparam={CONFIG_DIR}/matrixconfig.txt
    - map http://www.example.com/ninth http://shouldnothit.com/ninth @plugin=cookie_remap.so @pparam={CONFIG_DIR}/matrixconfig.txt
    - map http://www.example.com/tenth http://shouldnothit.com/tenth @plugin=cookie_remap.so @pparam={CONFIG_DIR}/matrixconfig.txt
    - map http://www.example.com/eleventh http://shouldnothit.com/eleventh @plugin=cookie_remap.so @pparam={CONFIG_DIR}/matrixconfig.txt
sessions:
- transactions:
  - client-request:
      method: GET
      url: /eighth/magic;matrix=1
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - matrix-0
    proxy-request:
      url:
      - - path
        - value: /eighth/magic;matrix=1/eighth
          as: equal
      - - query
        - as: absent
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
  - client-request:
      method: GET
      url: /eighth/magic;matrix=1?hello=10
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - matrix-1
    proxy-request:
      url:
      - - path
        - value: /eighth/magic;matrix=1/eighth
          as: equal
      - - query
        - value: hello=10
          as: equal
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
  - client-request:
      method: GET
      url: /ninth/magic;matrix=5?hello=16
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - matrix-2
    proxy-request:
      url:
      - - path
        - value: /ninth/magic;matrix=5/ninth
          as: equal
      - - query
        - value: query=true
          as: equal
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
  - client-request:
      method: GET
      url: /tenth/magic
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - matrix-3
    proxy-request:
      url:
      - - path
        - value: /tenth/magic/tenth;matrix=2
          as: equal
      - - query
        - as: absent
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
  - client-request:
      method: GET
      url: /tenth/magic?query=10
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - matrix-4
    proxy-request:
      url:
      - - path
        - value: /tenth/magic/tenth;matrix=2
          as: equal
      - - query
        - value: query=10
          as: equal
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
  - client-request:
      method: GET
      url: /eleventh/magic;matrix=4?query=12
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - matrix-5
    proxy-request:
      url:
      - - path
        - value: /eleventh/magic;matrix=4/eleventh;matrix=2
          as: equal
      - - query
        - value: query=true
          as: equal
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
