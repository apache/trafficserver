meta: {version: "1.0"}

urtest:
  description: "Verify cookie_remap routing and substitution operations"
  requires: {plugins: [cookie_remap.so]}
  server:
    name: "cookie-remap-origin"
    process_config: {listen_extra_http: true}
  client: {name: "cookie-remap-client"}
  ats:
    name: "cookie-remap-ts"
    process_config: {enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "cookie_remap|http"
  variants:
    - name: "cookie-exists"
      client: {process_config: {keys: "exists-present exists-absent"}}
      ats:
        template_to_config_dir: ["configs/existsconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/existsconfig.txt"

    - name: "cookie-not-exists"
      client: {process_config: {keys: "not-exists-absent not-exists-present"}}
      ats:
        template_to_config_dir: ["configs/notexistsconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/notexistsconfig.txt"

    - name: "cookie-string-match"
      client: {process_config: {keys: "match-yes match-no"}}
      ats:
        template_to_config_dir: ["configs/matchconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/matchconfig.txt"

    - name: "cookie-bucket"
      client: {process_config: {keys: "bucket-in bucket-out"}}
      ats:
        template_to_config_dir: ["configs/bucketconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/bucketconfig.txt"

    - name: "connected-operations"
      client: {process_config: {keys: "connector-yes connector-no"}}
      ats:
        template_to_config_dir: ["configs/connectorconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com/magic @plugin=cookie_remap.so @pparam={CONFIG_DIR}/connectorconfig.txt"

    - name: "uri-match"
      client: {process_config: {keys: "uri-match-yes uri-match-no"}}
      ats:
        template_to_config_dir: ["configs/matchuriconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/matchuriconfig.txt"

    - name: "collapse-remapped-slashes"
      client: {process_config: {keys: "collapse-remapped"}}
      ats:
        template_to_config_dir: ["configs/collapseconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com/magic @plugin=cookie_remap.so @pparam={CONFIG_DIR}/collapseconfig.txt"

    - name: "collapse-preremap-slashes"
      client: {process_config: {keys: "collapse-preremap"}}
      ats:
        template_to_config_dir: ["configs/pcollapseconfig.txt"]
        remap_config:
          - "map http://www.example.com/orig_path http://shouldnothit.com/magic @plugin=cookie_remap.so @pparam={CONFIG_DIR}/pcollapseconfig.txt"

    - name: "post-remap-substitutions"
      client:
        process_config:
          keys: "sub-path sub-unmatched-path sub-request-url sub-outgoing-path"
      ats:
        template_to_config_dir: ["configs/substituteconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com/magic @plugin=cookie_remap.so @pparam={CONFIG_DIR}/substituteconfig.txt"

    - name: "pre-remap-substitutions"
      client:
        process_config:
          keys: "psub-path psub-unmatched-path psub-request-url psub-outgoing-path"
      ats:
        template_to_config_dir: ["configs/psubstituteconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com/not-used @plugin=cookie_remap.so @pparam={CONFIG_DIR}/psubstituteconfig.txt"

    - name: "cookie-regex"
      client: {process_config: {keys: "regex-yes regex-no"}}
      ats:
        template_to_config_dir: ["configs/regexconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/regexconfig.txt"

    - name: "canned-status"
      server: {enabled: false}
      client: {process_config: {keys: "status-match status-else"}}
      ats:
        template_to_config_dir: ["configs/statusconfig.txt"]
        remap_config:
          - "map http://www.example.com/magic http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/statusconfig.txt"

    - name: "subcookie"
      client: {process_config: {keys: "subcookie-yes subcookie-no"}}
      ats:
        template_to_config_dir: ["configs/subcookie.txt"]
        remap_config:
          - "map http://www.example.com http://shouldnothit.com/magic @plugin=cookie_remap.so @pparam={CONFIG_DIR}/subcookie.txt"

    - name: "disable-pristine-host-header"
      dns:
        name: "cookie-remap-dns"
        records: {canary.com: [127.0.0.1], stable.com: [127.0.0.1]}
      client: {process_config: {keys: "pristine-disabled-canary pristine-disabled-stable"}}
      ats:
        records_config: {proxy.config.url_remap.pristine_host_hdr: 1}
        template_to_config_dir: ["configs/disable_pristine_host_hdr_config_true.txt"]
        remap_config:
          - "map http://example.com http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/disable_pristine_host_hdr_config_true.txt"

    - name: "preserve-pristine-host-header"
      dns:
        name: "cookie-remap-dns"
        records: {canary.com: [127.0.0.1], stable.com: [127.0.0.1]}
      client: {process_config: {keys: "pristine-preserved-canary pristine-preserved-stable"}}
      ats:
        records_config: {proxy.config.url_remap.pristine_host_hdr: 1}
        template_to_config_dir: ["configs/disable_pristine_host_hdr_config_false.txt"]
        remap_config:
          - "map http://example.com http://shouldnothit.com @plugin=cookie_remap.so @pparam={CONFIG_DIR}/disable_pristine_host_hdr_config_false.txt"


sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, exists-present]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=value]]}
        proxy-request: {url: /cookieexists}
        server-response: &ok
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: &proxy-ok {status: 200}

      - all: {headers: {fields: [[uuid, exists-absent]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, breadcrumb=etc]]}
        proxy-request: {url: /cookiedoesntexist}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, not-exists-absent]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {url: /cookiedoesntexist}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, not-exists-present]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=etc]]}
        proxy-request: {url: /cookieexists}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, match-yes]]}}
        client-request:
          method: GET
          url: /magic?a=1&b=2&c=3
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=magic]]}
        proxy-request: {url: "/cookiematches?a=1&b=2&c=3"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, match-no]]}}
        client-request:
          method: GET
          url: /magic?a=1&b=2&c=3
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=magit]]}
        proxy-request: {url: "/cookiedoesntmatch?a=1&b=2&c=3"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, bucket-in]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=333]]}
        proxy-request: {url: /cookiematches}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, bucket-out]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=etc]]}
        proxy-request: {url: /cookiedoesntmatch}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, connector-yes]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, "fpbeta=abcd icecream=donteat"]]}
        proxy-request: {url: /cookiematches}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, connector-no]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=somethingelse]]}
        proxy-request: {url: /cookiedoesntmatch}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, uri-match-yes]]}}
        client-request:
          method: GET
          url: /magic/thisispartofthepath
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {url: /cookiematches}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, uri-match-no]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=etc]]}
        proxy-request: {url: /cookiedoesntmatch}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, collapse-remapped]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {url: "/i/like/cheetos?.done=http://finance.yahoo.com"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, collapse-preremap]]}}
        client-request:
          method: GET
          url: /orig_path
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {url: "/i/like/cheetos?.done=http://finance.yahoo.com"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, sub-path]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=abcd]]}
        proxy-request: {url: "/photos/search?query=magic"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, sub-unmatched-path]]}}
        client-request:
          method: GET
          url: /magic/theunmatchedpath
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, oxalpha=3333]]}
        proxy-request: {url: "/photos/search?query=/theunmatchedpath"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, sub-request-url]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, acgamma=value]]}
        proxy-request:
          url: "/photos/search/cr_substitutions?query=%28http%3A%2F%2Fshouldnothit%2Ecom%2Fmagic"
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, sub-outgoing-path]]}}
        client-request:
          method: GET
          url: /magic/foobar
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {url: /photos/search/magic/foobar}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, psub-path]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=abcd]]}
        proxy-request: {url: "/photos/search?query=magic"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, psub-unmatched-path]]}}
        client-request:
          method: GET
          url: /magic/theunmatchedpath
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, oxalpha=3333]]}
        proxy-request: {url: "/photos/search?query=/theunmatchedpath"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, psub-request-url]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, acgamma=value]]}
        proxy-request:
          url: "/photos/search/cr_substitutions?query=%28http%3A%2F%2Fwww%2Eexample%2Ecom%2Fmagic"
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, psub-outgoing-path]]}}
        client-request:
          method: GET
          url: /magic/foobar
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {url: /photos/search/magic/foobar}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, regex-yes]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=ilove-oreos-chipsahoy-icecream]]}
        proxy-request: {url: "/regexmatches?cookies=oreos-chipsahoy-icecream"}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, regex-no]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=etc]]}
        proxy-request: {url: /regexdoesntmatch}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, status-match]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, fpbeta=magic]]}
        server-response: {status: 599}
        proxy-response: {status: 205}

      - all: {headers: {fields: [[uuid, status-else]]}}
        client-request:
          method: GET
          url: /magic
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: {status: 599}
        proxy-response: {status: 400}

      - all: {headers: {fields: [[uuid, subcookie-yes]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, "fpbeta=a=1&b=2&c=3"]]}
        proxy-request: {url: /cookiematches}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, subcookie-no]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, www.example.com], [Cookie, "fpbeta=a=1&b=2&c=4"]]}
        proxy-request: {url: /cookiedoesntmatch}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, pristine-disabled-canary]]}}
        client-request:
          method: GET
          url: /app/test
          version: "1.1"
          headers: {fields: [[Host, example.com], [Cookie, SessionID=333]]}
        proxy-request:
          url: /app/test
          headers: {fields: [[Host, {value: canary.com, as: contains}]]}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, pristine-disabled-stable]]}}
        client-request:
          method: GET
          url: /app/test
          version: "1.1"
          headers: {fields: [[Host, example.com]]}
        proxy-request:
          url: /app/test
          headers: {fields: [[Host, {value: example.com, as: equal}]]}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, pristine-preserved-canary]]}}
        client-request:
          method: GET
          url: /app/test
          version: "1.1"
          headers: {fields: [[Host, example.com], [Cookie, SessionID=333]]}
        proxy-request:
          url: /app/test
          headers: {fields: [[Host, {value: example.com, as: equal}]]}
        server-response: *ok
        proxy-response: *proxy-ok

      - all: {headers: {fields: [[uuid, pristine-preserved-stable]]}}
        client-request:
          method: GET
          url: /app/test
          version: "1.1"
          headers: {fields: [[Host, example.com]]}
        proxy-request:
          url: /app/test
          headers: {fields: [[Host, {value: example.com, as: equal}]]}
        server-response: *ok
        proxy-response: *proxy-ok
