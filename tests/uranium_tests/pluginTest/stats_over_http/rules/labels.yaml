format: prometheus
prometheus:
  name:
    replace: [{from: '+', to: 'plus'}]
    invalid: '[^a-zA-Z0-9_]'
  types:
    source: rules
    rules:
      - {match: 'queue', type: gauge}
      - {match: '', type: counter}
  strings:
    names: [proxy.process.version.server.short]
  rules:
    # The last rule of the family sets its label name, so post is relabeled from verb to method.
    - {match: '^(plugin\.test_metrics\.requests)\.(post)$', labels: {verb: 2}}
    - {match: '^(plugin\.test_metrics\.requests)\.(.+)$', labels: {method: 2}}
