meta:
  version: "1.0"

# Testing txn_open hook.
  txn_box:
    global:
    - when: txn-open
      do:
      - debug: [ "txn_box" , "Checking '{ua-req-scheme}' for '{ua-req-host}'" ]
      - with: ua-req-path
        select:
        - is-empty:
          do:
          - txn-conf<proxy.config.http.transaction_no_activity_timeout_out>: 937

    - when: proxy-req
      do:
      - debug: [ "txn_box" , "UA {ua-req-method}: '{ua-req-scheme}' for '{ua-req-host}'" ]
      - debug: [ "txn_box" , "PROXY {proxy-req-method}: '{proxy-req-scheme}' for '{proxy-req-host}'" ]
      - proxy-req-field<Test>: "NATO = {txn-conf<proxy.config.http.transaction_no_activity_timeout_out>}"

  blocks:
  - base-req: &base-req
      version: "1.1"
      method: "GET"

  - base-rsp: &base-rsp
      status: 200
      reason: "OK"
      headers:
        fields:
        - [ Content-Type, html/plaintext ]
        - [ Content-Length, 96 ]

sessions:
- protocol:
    stack: http
  transactions:
  #
  - all: { headers: { fields: [[ uuid, 1 ]]}}
    client-request:
      <<: *base-req
      url: "/1"
      headers:
        fields:
        - [ Host, one.ex ]
    proxy-request:
      headers:
        fields:
        - [ Test, { value: "NATO = 937", as: equal } ]
    server-response:
      <<: *base-rsp
    proxy-response:


urtest:
  description: Verify txn_box transaction-open hooks (case 2)
  requires:
    plugins:
    - txn_box.so
  server:
    name: txn-box-txn_open_2-origin
  dns:
    name: txn-box-txn_open_2-dns
    process_config:
      default: 127.0.0.1
  client:
    name: txn-box-txn_open_2-client
  ats:
    name: txn-box-txn_open_2-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: txn_box
      proxy.config.log.max_secs_per_buffer: 1
      proxy.config.http.transaction_no_activity_timeout_out: 120
      proxy.config.http.per_server.connection.max: 500
      proxy.config.http.background_fill_completed_threshold: 0.4
    copy_to_config_dir:
    - txn_open_2.test.yaml
    remap_config:
    - map http://one.ex http://one.ex:{SERVER_HTTP_PORT}
    plugin_config:
    - txn_box.so
    - txn_box.so --key meta.txn_box.global {CONFIG_DIR}/txn_open_2.test.yaml
