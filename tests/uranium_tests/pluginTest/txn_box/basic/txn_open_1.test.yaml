meta:
  version: "1.0"

# Testing txn_open hook.
  txn_box:
    global:
    - when: proxy-req
      do:
      - proxy-req-field<Test>: "NATO = {txn-conf<proxy.config.http.transaction_no_activity_timeout_out>}"

  blocks:
  - base-req: &base-req
      version: "1.1"
      method: "GET"

  - base-rsp: &base-rsp
      status: 200
      reason: "OK"
      content:
        size: 96
      headers:
        fields:
        - [ Content-Type, html/plaintext ]
        - [ Content-Length, 96 ]

sessions:
- protocol:
    stack: http
  transactions:
  #
  - all: { headers: { fields: [[ uuid, 1 ]]}}
    client-request:
      <<: *base-req
      url: "/1"
      headers:
        fields:
        - [ Host, one.ex ]
    proxy-request:
      headers:
        fields:
        - [ Test, { value: "NATO = 120", as: equal } ]
    server-response:
      <<: *base-rsp
    proxy-response:


urtest:
  description: Verify txn_box transaction-open hooks (case 1)
  requires:
    plugins:
    - txn_box.so
  server:
    name: txn-box-txn_open_1-origin
  client:
    name: txn-box-txn_open_1-client
  ats:
    name: txn-box-txn_open_1-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: txn_box
      proxy.config.log.max_secs_per_buffer: 1
      proxy.config.http.transaction_no_activity_timeout_out: 120
      proxy.config.http.per_server.connection.max: 500
      proxy.config.http.background_fill_completed_threshold: 0.4
    copy_to_config_dir:
    - txn_open_1.test.yaml
    remap_config:
    - map / http://127.0.0.1:{SERVER_HTTP_PORT}
    plugin_config:
    - txn_box.so
    - txn_box.so --key meta.txn_box.global {CONFIG_DIR}/txn_open_1.test.yaml
