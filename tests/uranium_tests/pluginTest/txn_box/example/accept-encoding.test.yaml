meta:
  version: "1.0"

  txn_box:
    global:
    # doc.start
    - when: proxy-req
      do:
      - proxy-req-field<Accept-Encoding>: [ proxy-req-field<Accept-Encoding> , { else: "identity" } ]
    # doc.end
  blocks:

  - base_request: &base_request
      version: "1.1"
      method: "GET"

  - rsp: &rsp
      status: 200
      reason: OK
      content:
        size: 234
      headers:
        fields:
        - [ Content-Type, html/plaintext ]
        - [ Content-Length, 234 ]

sessions:
- protocol:
    stack: http
  transactions:
  - all: { headers: { fields: [[ uuid, 1 ]]}}
    client-request:
      <<: *base_request
      url: "/1"
      headers:
        fields:
        - [ Host, base.ex ]
    proxy-request:
      headers:
        fields:
        - [ Accept-Encoding, { value: "identity", as: equal } ]
    server-response:
      <<: *rsp
    proxy-response:
      <<: *rsp

  - all: { headers: { fields: [[ uuid, 2 ]]}}
    client-request:
      <<: *base_request
      url: "/2"
      headers:
        fields:
        - [ Host, base.ex ]
        - [ Accept-Encoding, "gzip" ]
    proxy-request:
      headers:
        fields:
        - [ Accept-Encoding, { value: "gzip", as: equal } ]
    server-response:
      <<: *rsp
    proxy-response:
      <<: *rsp



urtest:
  description: Verify txn_box Accept-Encoding handling
  requires:
    plugins:
    - txn_box.so
  server:
    name: txn-box-accept-encoding-origin
  client:
    name: txn-box-accept-encoding-client
  ats:
    name: txn-box-accept-encoding-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: txn_box
      proxy.config.http.cache.http: 0
      proxy.config.http.normalize_ae: 0
      proxy.config.url_remap.remap_required: 0
    copy_to_config_dir:
    - accept-encoding.test.yaml
    remap_config:
    - map / http://127.0.0.1:{SERVER_HTTP_PORT}
    plugin_config:
    - txn_box.so
    - txn_box.so --key meta.txn_box.global {CONFIG_DIR}/accept-encoding.test.yaml
