meta:
  version: "1.0"

  txn-box:
    remap:
    - var<target>: ua-req-field<ycal-host>
    - with: pre-remap-host
      continue:
      select:
      - any-of:
        - contains: "notepad.yahoo.com"
        - contains: "notepad.mail.yahoo.com"
        do:
         - var<target>: "calendar.yahoo.com"
         - ua-req-query:
           - ua-req-query
           - concat: [ "&" , "view=notepad" ]
    - ua-req-host: var<target>
    - with: var<target>
      select:
      - any-of:
        - prefix: "calendar.yahoo.com"
        - prefix: "mail.yahoo-inc.com"
        do:
        - ua-req-scheme: "https"
        - remap-redirect:

  blocks:
  - base-req: &base-req
      version: "1.1"
      method: "GET"
  - base-rsp: &base-rsp
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, html/plaintext ]
        - [ Content-Length, 96 ]

sessions:
- protocol:
    stack: http
  transactions:
  - all: { headers: { fields: [[ uuid, base-case ]]}}
    client-request:
      <<: *base-req
      url: "/me"
      headers:
        fields:
        - [ Host, "nowhere.com" ]
        - [ ycal-host, "calendar.yahoo.com" ]
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 302
      headers:
        fields:
        - [ "Location", { value: "https://calendar.yahoo.com", as: prefix } ]

  - all: { headers: { fields: [[ uuid, notepad ]]}}
    client-request:
      <<: *base-req
      url: "/me"
      headers:
        fields:
        - [ Host, "notepad.mail.yahoo.com" ]
        - [ ycal-host, "bop.yahoo.com" ]
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 302
      headers:
        fields:
        - [ Location, { value: "view=notepad", as: "contains" } ]

urtest:
  description: Verify the txn_box Stanley remap configuration
  requires: {plugins: [txn_box.so]}
  server: {name: txn-box-stanley-origin}
  dns: {name: txn-box-stanley-dns, process_config: {default: 127.0.0.1}}
  client: {name: txn-box-stanley-client, process_config: {other_args: --verbose info}}
  ats:
    name: txn-box-stanley-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: txn_box
      proxy.config.http.cache.http: 0
    copy_to_config_dir: [stanley.test.yaml]
    plugin_config:
    - txn_box.so
    remap_config:
    - map http://nowhere.com http://0.0.0.0:{SERVER_HTTP_PORT}/health @plugin=txn_box.so @pparam=--key=meta.txn-box.remap @pparam={CONFIG_DIR}/stanley.test.yaml
    - map http://calendar.yahoo.com/ http://0.0.0.0:{SERVER_HTTP_PORT}/health @plugin=txn_box.so @pparam=--key=meta.txn-box.remap @pparam={CONFIG_DIR}/stanley.test.yaml
    - map / http://0.0.0.0:{SERVER_HTTP_PORT}/health @plugin=txn_box.so @pparam=--key=meta.txn-box.remap @pparam={CONFIG_DIR}/stanley.test.yaml
