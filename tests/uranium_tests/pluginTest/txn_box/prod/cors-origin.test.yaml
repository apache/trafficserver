meta:
  version: "1.0"

  txn-box:
    global:
    - when: ua-req
      do:
      - with: ua-req-field<origin>
        select:
        - any-of:
          - match: "https://alpha.ex"
          - match: "https://bravo.ex"
          - match: "https://charlie.ex"
          - match: "https://delta.ex"
          do:
          - var<cors>: ... # must preserve value for later hook.
          - debug: "Prepping CORS as {var<cors>}"
          - when: proxy-rsp
            do:
            - debug: "Setting CORS as {var<cors>}"
            - proxy-rsp-field<CORS>: var<cors>
          # fall through - none of the valid referrer hosts.
      - proxy-reply:
          status: 401
          reason: "Nice try bozo"
          body: "No API goodness for you, faker!"

  blocks:
  - base-req: &base-req
      version: "1.1"
      method: "GET"
  - base-rsp: &base-rsp
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, html/plaintext ]
        - [ Content-Length, 96 ]

sessions:
- protocol:
    stack: http
  transactions:

  - all: { headers: { fields: [[ uuid, alpha ]]}}
    client-request:
      <<: *base-req
      url: "/"
      headers:
        fields:
        - [ Host, api.ex ]
        - [ Origin, "https://alpha.ex" ]
    proxy-request:
      <<: *base-req
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 200
      headers:
        fields:
        - [ "CORS", { value: "https://alpha.ex", as: equal }]

  # no origin
  - all: { headers: { fields: [[ uuid, no-origin ]]}}
    client-request:
      <<: *base-req
      url: "/"
      headers:
        fields:
        - [ Host, api.ex ]
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 401

  # no origin
  - all: { headers: { fields: [[ uuid, invalid-host ]]}}
    client-request:
      <<: *base-req
      url: "/"
      headers:
        fields:
        - [ Host, api.ex ]
        - [ Origin, "https://echo.ex" ]
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 401

  - all: { headers: { fields: [[ uuid, delta ]]}}
    client-request:
      <<: *base-req
      url: "/"
      headers:
        fields:
        - [ Host, api.ex ]
        - [ Origin, "https://delta.ex" ]
    proxy-request:
      <<: *base-req
    server-response:
      <<: *base-rsp
    proxy-response:
      status: 200
      headers:
        fields:
        - [ "CORS", { value: "https://delta.ex", as: equal }]


urtest:
  description: Verify txn_box CORS origin handling
  requires:
    plugins:
    - txn_box.so
  server:
    name: txn-box-cors-origin-origin
  client:
    name: txn-box-cors-origin-client
  ats:
    name: txn-box-cors-origin-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: txn_box
      proxy.config.http.cache.http: 0
      proxy.config.url_remap.remap_required: 0
    copy_to_config_dir:
    - cors-origin.test.yaml
    remap_config:
    - map / http://127.0.0.1:{SERVER_HTTP_PORT}
    plugin_config:
    - txn_box.so
    - txn_box.so --key meta.txn-box.global {CONFIG_DIR}/cors-origin.test.yaml
