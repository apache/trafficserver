txn_box:
- when: upstream-rsp
  do:
  - with: [ upstream-rsp-status, proxy-req-path ]
    select:
    - as-tuple:
      - eq: 404
      - match: "example"
      do:
      - upstream-rsp-status: [ 200, "OK" ]
      - upstream-rsp-field<Cache-Control>: "max-age=3600"

  - with: upstream-rsp-status
    select:
    - eq: 200
      do:
      - upstream-rsp-field<X-Txn-Box>: "selected"
