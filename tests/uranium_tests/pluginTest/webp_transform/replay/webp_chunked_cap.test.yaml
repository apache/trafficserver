# Origin side for the chunked no-Content-Length cap-trip test. The verifier
# server returns a 20 MiB image/jpeg body framed with Transfer-Encoding:
# chunked and no Content-Length, so webp_transform cannot decline it up front
# and must fall back to the per-transaction cap inside consume().

meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      method: "GET"
      url: /chunked-huge.jpg
      version: "1.1"
      headers:
        fields:
        - [Host, example.com]
        - [uuid, chunked-huge]
        - [Accept, image/webp]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Type, image/jpeg]
        - [Transfer-Encoding, chunked]
      content:
        encoding: plain
        size: 20971520

    proxy-response:
      status: 502
      content:
        encoding: plain
        size: 0

urtest:
  description: Refuse over-cap chunked WebP transforms without poisoning cache
  requires: {plugins: [webp_transform.so]}
  server: {name: webp-transform-origin}
  client: {name: webp-transform-client}
  ats:
    name: webp-transform-ts
    process_config:
      disable_log_checks: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: webp_transform
      proxy.config.url_remap.pristine_host_hdr: 1
    plugin_config:
    - webp_transform.so convert_to_webp
    remap_config:
    - map / http://127.0.0.1:{SERVER_HTTP_PORT}/
    log_validation:
      diags_log:
        contains:
        - expression: response body exceeds cap
          description: The in-transform response cap must reject the chunked body
  variants:
  - name: uncached
    ats:
      process_config:
        enable_cache: false
        disable_log_checks: true
  - name: cache-safety
    client:
      process_config:
        other_args: --repeat 2
    ats:
      records_config:
        proxy.config.http.cache.required_headers: 0
        proxy.config.http.cache.ignore_client_cc_max_age: 1
