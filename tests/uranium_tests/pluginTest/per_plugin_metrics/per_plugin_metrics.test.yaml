urtest:
  description: "Verify per-plugin invocation and PluginVC workload metrics"
  replay: "per_plugin_metrics.replay.yaml"
  requires: {plugins: [header_rewrite.so, conf_remap.so, generator.so]}
  server: {name: "per-plugin-metrics-origin"}
  client: {name: "per-plugin-metrics-client"}
  ats:
    name: "per-plugin-metrics-ts"
    process_config: {enable_cache: false}
    copy_to_config_dir: ["rules"]
    plugin_config:
      - "header_rewrite.so {CONFIG_DIR}/rules/global.conf"
    remap_config:
      - "map http://test.example http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=conf_remap.so @pparam=proxy.config.url_remap.pristine_host_hdr=1"
      - "map http://gen.example http://127.0.0.1/ @plugin=generator.so"
    metric_checks:
      - {metric: proxy.process.plugin.header_rewrite.invocations, min: 1, delay: 0}
      - {metric: proxy.process.plugin.conf_remap.invocations, min: 1, delay: 0}
      - {metric: proxy.process.plugin.generator.bytes, min: 1, delay: 0}
      - {metric: proxy.process.plugin.generator.transfers, min: 1, delay: 0}
