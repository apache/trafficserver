meta:
  version: '1.0'
urtest:
  description: Header rewrite conditions and last-operator semantics.
  requires:
    plugins:
    - header_rewrite.so
  server:
    name: origin
  client:
    name: client
  ats:
    name: ts
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: header.*
    remap_config:
    - map http://www.example.com http://127.0.0.1:{SERVER_HTTP_PORT}
    file_checks:
    - path: '{LOG_DIR}/traffic.out'
      contains: 'DIAG: \(header_rewrite\)'
    copy_to_config_dir:
    - rules/rule_l_value.conf
    plugin_config:
    - header_rewrite.so {CONFIG_DIR}/rules/rule_l_value.conf
sessions:
- transactions:
  - client-request:
      method: GET
      url: /
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - last
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 200
      headers:
        fields:
        - - X-First
          - First
        - - X-Last
          - Last
