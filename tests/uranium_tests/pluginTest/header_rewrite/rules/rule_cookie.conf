# Cookie operator and condition coverage. Each block is gated by the request
# path so exactly one operation runs per request.

# set-cookie preserves the ';' separator when the rewritten cookie is followed
# by "; " in the Cookie value.
cond %{CLIENT-URL:PATH} /^from_19\/sep/
  set-cookie X-Test newval

# A configured key longer than the trailing cookie token must not read past the
# (non NUL-terminated) Cookie value; the key is not matched and set-cookie falls
# through to appending the pair at the end.
cond %{CLIENT-URL:PATH} /^from_19\/oob/
  set-cookie session newval

# rm-cookie removes a cookie from the middle of the list.
cond %{CLIENT-URL:PATH} /^from_19\/rm_mid/
  rm-cookie b

# rm-cookie removes the last cookie, dropping the preceding separator.
cond %{CLIENT-URL:PATH} /^from_19\/rm_last/
  rm-cookie c

# rm-cookie removes the only cookie, leaving the field empty so it is destroyed.
cond %{CLIENT-URL:PATH} /^from_19\/rm_only/
  rm-cookie a

# rm-cookie on an absent key is a no-op.
cond %{CLIENT-URL:PATH} /^from_19\/rm_absent/
  rm-cookie zzz

# add-cookie appends a key that is not already present.
cond %{CLIENT-URL:PATH} /^from_19\/add_new/
  add-cookie newk newv

# add-cookie is a no-op when the key already exists.
cond %{CLIENT-URL:PATH} /^from_19\/add_exist/
  add-cookie a X

# set-cookie creates the Cookie field when the request has none.
cond %{CLIENT-URL:PATH} /^from_19\/set_nohdr/
  set-cookie foo bar

# %{COOKIE:name} extracts a present cookie's value.
cond %{CLIENT-URL:PATH} /^from_19\/getfoo/
  set-header X-Cookie-Foo "%{COOKIE:foo}"

# %{COOKIE:name} with a key longer than the trailing token must not over-read;
# extraction yields the empty string.
cond %{CLIENT-URL:PATH} /^from_19\/shortkey/ [AND]
cond %{COOKIE:session} =""
  set-header X-Cookie-Sess "empty"
