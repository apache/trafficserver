meta: {version: "1.0"}

urtest:
  description: "Verify header_rewrite set-body-from success, failure, status, and binary-body handling"
  requires: {plugins: [header_rewrite.so]}
  server:
    name: "set-body-from-origin"
    process_config: {other_args: "--format {url}"}
  client:
    name: "set-body-from-client"
    process_config:
      keys: "body-remap-fail body-remap-success body-plugin-success body-plugin-override body-file body-plugin-fail body-success-200 body-binary"
  ats:
    name: "set-body-from-ts"
    process_config: {enable_cache: false}
    copy_to_config_dir:
      - "rules/rule_set_body_from_remap.conf"
      - "rules/rule_set_body_from_plugin.conf"
      - "rules/rule_set_body_from_file.conf"
      - source: "gold/header_rewrite-set_body_from_success.gold"
        destination: "rules/header_rewrite-set_body_from_success.gold"
    plugin_config:
      - "header_rewrite.so {CONFIG_DIR}/rules/rule_set_body_from_plugin.conf"
    remap_config:
      - "map http://www.example.com/remap_success http://127.0.0.1:{SERVER_HTTP_PORT}/remap_success @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_set_body_from_remap.conf"
      - "map http://www.example.com/200 http://127.0.0.1:{SERVER_HTTP_PORT}/200 @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_set_body_from_remap.conf"
      - "map http://www.example.com/remap_fail http://127.0.0.1:{SERVER_HTTP_PORT}/remap_fail @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_set_body_from_remap.conf"
      - "map http://www.example.com/remap_binary http://127.0.0.1:{SERVER_HTTP_PORT}/remap_binary @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_set_body_from_remap.conf"
      - "map http://www.example.com/binary_body http://127.0.0.1:{SERVER_HTTP_PORT}/binary_body"
      - "map http://www.example.com/plugin_success http://127.0.0.1:{SERVER_HTTP_PORT}/plugin_success"
      - "map http://www.example.com/plugin_override http://127.0.0.1:{SERVER_HTTP_PORT}/plugin_override"
      - "map http://www.example.com/file http://127.0.0.1:{SERVER_HTTP_PORT}/file @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_set_body_from_file.conf"
      - "map http://www.example.com/plugin_fail http://127.0.0.1:{SERVER_HTTP_PORT}/plugin_fail"
      - "map http://www.example.com/404.html http://127.0.0.1:{SERVER_HTTP_PORT}/404.html"
      - "map http://www.example.com/plugin_no_server http://127.0.0.1:{UNUSED_PORT}/plugin_no_server"


sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, body-remap-fail]]}}
        client-request: &remap-fail-request
          method: GET
          url: /remap_fail
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: &not-found
          status: 404
          headers: {fields: [[Content-Length, 13], [Connection, close]]}
          content: {data: "404 Not Found", size: 13}
        proxy-response: {status: 404}

      - all: {headers: {fields: [[uuid, body-remap-success]]}}
        client-request:
          method: GET
          url: /remap_success
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response: &custom-not-found
          status: 404
          headers: {fields: [[Content-Type, {value: application/json, as: equal}]]}
          content: {data: "{\"error\": \"custom\"}\n", size: 20}

      - all: {headers: {fields: [[uuid, body-plugin-success]]}}
        client-request:
          method: GET
          url: /plugin_success
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response: *custom-not-found

      - all: {headers: {fields: [[uuid, body-plugin-override]]}}
        client-request:
          method: GET
          url: /plugin_override
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response:
          status: 404
          headers: {fields: [[Content-Type, {value: application/problem+json, as: equal}]]}
          content: {data: "{\"error\": \"custom\"}\n", size: 20}

      - all: {headers: {fields: [[uuid, body-file]]}}
        client-request:
          method: GET
          url: /file
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        proxy-request: {expect: absent}
        proxy-response:
          status: 403
          headers: {fields: [[Content-Type, {value: application/json, as: equal}]]}
          content: {data: "{\"error\": \"custom\"}\n", size: 20}

      - all: {headers: {fields: [[uuid, body-plugin-fail]]}}
        client-request:
          method: GET
          url: /plugin_fail
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response: {status: 404}

      - all: {headers: {fields: [[uuid, body-success-200]]}}
        client-request:
          method: GET
          url: /200
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 6], [Connection, close]]}
          content: {data: "200 OK", size: 6}
        proxy-response:
          status: 500
          headers: {fields: [[Content-Type, {value: application/json, as: equal}]]}
          content: {data: "{\"error\": \"custom\"}\n", size: 20}

      - all: {headers: {fields: [[uuid, body-binary]]}}
        client-request:
          method: GET
          url: /remap_binary
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response:
          status: 404
          content: {data: "BeforeNUL\0AfterNUL_AAAAAAAAAAAAAAAAAAAAAAAA", size: 43}

      - all: {headers: {fields: [[uuid, body-fetch-custom]]}}
        client-request:
          method: GET
          url: /404.html
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 20], [Content-Type, application/json], [Connection, close]]}
          content: {data: "{\"error\": \"custom\"}\n", size: 20}

      - all: {headers: {fields: [[uuid, body-fetch-binary]]}}
        client-request:
          method: GET
          url: /binary_body
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 43], [Connection, close]]}
          content: {data: "BeforeNUL\0AfterNUL_AAAAAAAAAAAAAAAAAAAAAAAA", size: 43}
