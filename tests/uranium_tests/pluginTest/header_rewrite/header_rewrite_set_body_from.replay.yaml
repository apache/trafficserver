meta: {version: "1.0"}

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, body-remap-fail]]}}
        client-request: &remap-fail-request
          method: GET
          url: /remap_fail
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: &not-found
          status: 404
          headers: {fields: [[Content-Length, 13], [Connection, close]]}
          content: {data: "404 Not Found", size: 13}
        proxy-response: {status: 404}

      - all: {headers: {fields: [[uuid, body-remap-success]]}}
        client-request:
          method: GET
          url: /remap_success
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response: &custom-not-found
          status: 404
          content: {data: "Custom body found\n", size: 18}

      - all: {headers: {fields: [[uuid, body-plugin-success]]}}
        client-request:
          method: GET
          url: /plugin_success
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response: *custom-not-found

      - all: {headers: {fields: [[uuid, body-plugin-fail]]}}
        client-request:
          method: GET
          url: /plugin_fail
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response: {status: 404}

      - all: {headers: {fields: [[uuid, body-success-200]]}}
        client-request:
          method: GET
          url: /200
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 6], [Connection, close]]}
          content: {data: "200 OK", size: 6}
        proxy-response:
          status: 500
          content: {data: "Custom body found\n", size: 18}

      - all: {headers: {fields: [[uuid, body-binary]]}}
        client-request:
          method: GET
          url: /remap_binary
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response: *not-found
        proxy-response:
          status: 404
          content: {data: "BeforeNUL\0AfterNUL_AAAAAAAAAAAAAAAAAAAAAAAA", size: 43}

      - all: {headers: {fields: [[uuid, body-fetch-custom]]}}
        client-request:
          method: GET
          url: /404.html
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 18], [Connection, close]]}
          content: {data: "Custom body found\n", size: 18}

      - all: {headers: {fields: [[uuid, body-fetch-binary]]}}
        client-request:
          method: GET
          url: /binary_body
          version: "1.1"
          headers: {fields: [[Host, www.example.com]]}
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 43], [Connection, close]]}
          content: {data: "BeforeNUL\0AfterNUL_AAAAAAAAAAAAAAAAAAAAAAAA", size: 43}
