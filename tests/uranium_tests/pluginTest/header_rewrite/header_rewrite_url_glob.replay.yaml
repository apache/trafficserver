meta: {version: "1.0"}

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, redirect-read-response]]}}
        client-request:
          method: HEAD
          url: /
          version: "1.1"
          headers: {fields: [[Host, "127.0.0.1:{SERVER_HTTP_PORT}"]]}
        server-response: &origin-response
          status: 200
          headers: {fields: [[Content-Length, 0], [Connection, close]]}
        proxy-response: &redirect
          status: 301
          headers: {fields: [[Location, "http://redirect.com/here"]]}

      - all: {headers: {fields: [[uuid, redirect-send-response]]}}
        client-request:
          method: HEAD
          url: /
          version: "1.1"
          headers: {fields: [[Host, "127.0.0.1:{SERVER_HTTP_PORT}"]]}
        server-response: *origin-response
        proxy-response: *redirect
