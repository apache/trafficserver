meta:
  version: '1.0'
urtest:
  description: CLIENT-URL matching and TO-URL redirect substitutions preserve original URL semantics.
  requires:
    plugins:
    - header_rewrite.so
  server:
    name: origin
  client:
    name: client
  ats:
    name: ts
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: header.*
    remap_config:
    - map http://www.example.com/from_path/ https://127.0.0.1:{SERVER_HTTP_PORT}/to_path/ @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_client.conf
    - map http://www.example.com:8080/from_path/ https://127.0.0.1:{SERVER_HTTP_PORT}/to_path/ @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/rule_client.conf
    - map http://no_path.com http://no_path.com?name=brian/ @plugin=header_rewrite.so @pparam={CONFIG_DIR}/rules/set_redirect.conf
    file_checks:
    - path: '{LOG_DIR}/traffic.out'
      contains: 'DIAG: \(header_rewrite\)'
    copy_to_config_dir:
    - rules/rule_client.conf
    - rules/set_redirect.conf
sessions:
- transactions:
  - client-request:
      method: GET
      url: /from_path/hello?=foo=bar
      version: '1.1'
      headers:
        fields:
        - - Host
          - www.example.com
        - - uuid
          - client
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 304
      headers:
        fields:
        - - Cache-Control
          - value: no-store
            as: equal
  - client-request:
      method: HEAD
      url: /
      version: '1.1'
      headers:
        fields:
        - - Host
          - no_path.com
        - - uuid
          - redirect
    server-response:
      status: 200
      headers:
        fields:
        - - Content-Length
          - 0
        - - Connection
          - close
    proxy-response:
      status: 301
      headers:
        fields:
        - - Location
          - value: http://no_path.com?name=brian/
            as: equal
