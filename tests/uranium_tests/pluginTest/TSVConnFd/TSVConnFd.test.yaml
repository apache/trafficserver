urtest:
  description: "Verify TSVConnFdCreate wraps and exchanges data over an existing socket"
  replay: "TSVConnFd.replay.yaml"
  server: {name: "vconn-fd-origin"}
  client: {name: "vconn-fd-client"}
  ats:
    name: "vconn-fd-ts"
    records_config:
      proxy.config.proxy_name: "Poxy_Proxy"
      proxy.config.url_remap.remap_required: 1
      proxy.config.diags.debug.enabled: 3
      proxy.config.diags.debug.tags: "TSVConnFd"
    copy_custom_plugin:
      - "{AtsBuildUraniumTestsDir}/pluginTest/TSVConnFd/.libs/TSVConnFd.so"
    plugin_config:
      - "TSVConnFd.so {ATS_ROOT}/in_progress {UNUSED_PORT}"
    remap_config:
      - "map http://myhost.test http://127.0.0.1:{SERVER_HTTP_PORT}"
    pre_client_commands:
      - 'touch "{ATS_ROOT}/in_progress"'
    post_client_commands:
      - 'for i in $(seq 1 15); do test ! -e "{ATS_ROOT}/in_progress" && exit 0; sleep 1; done; exit 1'
