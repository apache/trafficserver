urtest:
  description: "Verify slice accepts PURGE requests"
  replay: "replay/slice_purge.replay.yaml"
  requires:
    plugins: ["slice.so", "cache_range_requests.so"]
  server:
    name: "slice-purge-origin"
  client:
    name: "slice-purge-client"
  ats:
    name: "slice-purge-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|slice|cache_range_requests"
  variants:
    - name: "absolute-basic"
      ats:
        remap_config:
          - "map /ref/block http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=slice.so @pparam=--blockbytes-test=10 @plugin=cache_range_requests.so"
    - name: "absolute-reference"
      replay: "replay/slice_purge_ref.replay.yaml"
      ats:
        remap_config:
          - "map /ref/block http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=slice.so @pparam=--blockbytes-test=10 @plugin=cache_range_requests.so"
    - name: "relative-basic"
      ats:
        remap_config:
          - "map /ref/block http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=slice.so @pparam=--blockbytes-test=10 @pparam=--ref-relative @plugin=cache_range_requests.so"
    - name: "relative-no-reference"
      replay: "replay/slice_purge_no_ref.replay.yaml"
      ats:
        remap_config:
          - "map /ref/block http://127.0.0.1:{SERVER_HTTP_PORT} @plugin=slice.so @pparam=--blockbytes-test=10 @pparam=--ref-relative @plugin=cache_range_requests.so"
