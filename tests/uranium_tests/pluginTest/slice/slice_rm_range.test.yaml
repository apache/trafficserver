urtest:
  description: "Verify slice can strip Range from HEAD requests"
  replay: "replay/slice_range.replay.yaml"
  requires:
    plugins: ["slice.so", "cache_range_requests.so"]
  server:
    name: "slice-range-origin"
  client:
    name: "slice-range-client"
  ats:
    name: "slice-range-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|slice|cache_range_requests"
    remap_config:
      - "map /no/range http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=slice.so @pparam=--blockbytes-test=10 @pparam=--strip-range-for-head @plugin=cache_range_requests.so"
      - "map /with/range http://127.0.0.1:{SERVER_HTTP_PORT}/ @plugin=slice.so @pparam=--blockbytes-test=10 @plugin=cache_range_requests.so"
