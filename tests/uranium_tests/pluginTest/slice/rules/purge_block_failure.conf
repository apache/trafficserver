# Make a block PURGE fail, which the core will not do on its own.
#
# slice re-issues every block as its own PURGE through this same remap rule, adding
# Range and its skip header on the way, so a rule can single out one block or all of
# them without ever matching the client's own PURGE. set-status fires at the remap
# pseudo-hook, before any cache lookup, so it applies whether or not the block is
# cached and leaves a cached one where it was.

# One block mid-walk, behind a block that will be removed and in front of one that must
# not be. Gated on the method: this object's fill and check GETs are ranged too.
cond %{REMAP_PSEUDO_HOOK} [AND]
cond %{METHOD} =PURGE [AND]
cond %{CLIENT-URL:PATH} /failblock/ [AND]
cond %{CLIENT-HEADER:Range} ="bytes=10-19"
  set-status 500

# Every block, as ip_allow.yaml refusing PURGE would. The walk stops at the first, so
# only block 0 is ever asked for, and nothing is removed at all.
cond %{REMAP_PSEUDO_HOOK} [AND]
cond %{METHOD} =PURGE [AND]
cond %{CLIENT-URL:PATH} /denied/ [AND]
cond %{CLIENT-HEADER:X-Slicer-Info} ="" [NOT]
  set-status 403
