urtest:
  description: "Verify the JA3 fingerprint plugin"
  requires: {plugins: [ja3_fingerprint.so]}
  dns: {name: "ja3-dns"}
  server: {name: "ja3-origin"}
  client: {name: "ja3-client"}
  ats:
    name: "ja3-ts"
    process_config: {enable_cache: false, enable_tls: true}
    records_config:
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
      proxy.config.proxy_name: "test.proxy.com"
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|ja3_fingerprint"
    file_checks:
      - path: "{LOG_DIR}/ja3_fingerprint.log"
        contains: "JA3.*MD5"
        timeout: 15
  variants:
    - name: "global"
      replay: "ja3_fingerprint_global.replay.yaml"
      ats:
        plugin_config: ["ja3_fingerprint.so --ja3log --ja3raw --preserve"]
        remap_config:
          - "map https://https.server.com https://https.backend.com:{SERVER_HTTPS_PORT}"
          - "map https://http2.server.com https://http2.backend.com:{SERVER_HTTPS_PORT}"
        file_checks:
          - path: "{LOG_DIR}/ja3_fingerprint.log"
            line_count_min: 2
            contains: "JA3.*MD5"
            timeout: 15

    - name: "remap"
      replay: "ja3_fingerprint_remap.replay.yaml"
      ats:
        remap_config:
          - "map https://https.server.com https://https.backend.com:{SERVER_HTTPS_PORT}"
          - "map https://http2.server.com https://http2.backend.com:{SERVER_HTTPS_PORT} @plugin=ja3_fingerprint.so @pparam=--ja3log"

    - name: "modify-incoming"
      replay: "ja3_fingerprint_global.replay.yaml"
      ats:
        plugin_config: ["ja3_fingerprint.so --ja3log --ja3raw --preserve --modify-incoming"]
        remap_config:
          - "map https://https.server.com https://https.backend.com:{SERVER_HTTPS_PORT}"
          - "map https://http2.server.com https://http2.backend.com:{SERVER_HTTPS_PORT}"
        file_checks:
          - path: "{LOG_DIR}/ja3_fingerprint.log"
            line_count_min: 2
            contains: "JA3.*MD5"
            timeout: 15
