meta: {version: "1.0"}

urtest:
  description: "Verify msdms milestone fields on cache miss and hit paths"
  server: {name: "origin"}
  client: {name: "client"}
  ats:
    name: "ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|log"
      proxy.config.http.cache.http: 1
      proxy.config.log.max_secs_per_buffer: 1
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
    logging_yaml:
      logging:
        formats:
          - name: "milestone_test"
            format: 'crc=%<crc> ckh=%<ckh> ms=%<ttms> c_ttfb=%<{TS_MILESTONE_UA_BEGIN_WRITE-TS_MILESTONE_SM_START}msdms> c_tls=%<{TS_MILESTONE_TLS_HANDSHAKE_END-TS_MILESTONE_TLS_HANDSHAKE_START}msdms> c_hdr=%<{TS_MILESTONE_UA_READ_HEADER_DONE-TS_MILESTONE_SM_START}msdms> c_proc=%<{TS_MILESTONE_CACHE_OPEN_READ_BEGIN-TS_MILESTONE_UA_READ_HEADER_DONE}msdms> cache=%<{TS_MILESTONE_CACHE_OPEN_READ_END-TS_MILESTONE_CACHE_OPEN_READ_BEGIN}msdms> dns=%<{TS_MILESTONE_SERVER_FIRST_CONNECT-TS_MILESTONE_CACHE_OPEN_READ_END}msdms> o_tcp=%<{TS_MILESTONE_SERVER_CONNECT_END-TS_MILESTONE_SERVER_FIRST_CONNECT}msdms> o_wait=%<{TS_MILESTONE_SERVER_FIRST_READ-TS_MILESTONE_SERVER_CONNECT_END}msdms> o_hdr=%<{TS_MILESTONE_SERVER_READ_HEADER_DONE-TS_MILESTONE_SERVER_FIRST_READ}msdms> o_proc=%<{TS_MILESTONE_UA_BEGIN_WRITE-TS_MILESTONE_SERVER_READ_HEADER_DONE}msdms> o_body=%<{TS_MILESTONE_SERVER_CLOSE-TS_MILESTONE_UA_BEGIN_WRITE}msdms> c_xfer=%<{TS_MILESTONE_SM_FINISH-TS_MILESTONE_SERVER_CLOSE}msdms> hit_proc=%<{TS_MILESTONE_UA_BEGIN_WRITE-TS_MILESTONE_CACHE_OPEN_READ_END}msdms> hit_xfer=%<{TS_MILESTONE_SM_FINISH-TS_MILESTONE_UA_BEGIN_WRITE}msdms>'
        logs:
          - {filename: "milestone_fields", format: "milestone_test", mode: "ascii"}
    post_client_commands:
      - 'until [ "$(grep -c "^crc=.* hit_xfer=" "{LOG_DIR}/milestone_fields.log" 2>/dev/null)" -ge 2 ]; do sleep 0.1; done; "{PYTHON}" "{TEST_DIR}/verify_milestone_fields.py" "{LOG_DIR}/milestone_fields.log"'
    file_checks:
      - path: "{LOG_DIR}/milestone_fields.log"
        contains: '^crc=.* hit_xfer='
        line_count_min: 2

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, milestone-miss]]}}
        client-request:
          method: GET
          url: /cacheable
          version: "1.1"
          headers: {fields: [[Host, example.com]]}
        server-response:
          status: 200
          headers:
            fields:
              - [Content-Type, text/plain]
              - [Cache-Control, "max-age=300"]
              - [Content-Length, 14]
          content: {data: "milestone body", size: 14}
        proxy-response: {status: 200}
      - all: {headers: {fields: [[uuid, milestone-hit]]}}
        client-request:
          delay: 1000ms
          method: GET
          url: /cacheable
          version: "1.1"
          headers: {fields: [[Host, example.com]]}
        server-response: {status: 503}
        proxy-response:
          status: 200
          content: {data: "milestone body", size: 14}
