meta:
  version: "1.0"

sessions:
  - transactions:
      - client-request:
          method: GET
          url: /cacheable
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, cache-write]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 4]
              - [Cache-Control, "max-age=60"]
              - [Age, 7]
          content:
            encoding: plain
            data: body

        proxy-response:
          status: 200
          content:
            encoding: plain
            data: body
            verify: {as: equal}

      - client-request:
          delay: 100ms
          method: GET
          url: /cacheable
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, cache-hit]

        proxy-request:
          expect: absent

        server-response:
          status: 500
          reason: Not Used

        proxy-response:
          status: 200
          content:
            encoding: plain
            data: body
            verify: {as: equal}

      - client-request:
          method: GET
          url: /negative-revalidation
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, negative-revalidation-write]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 4]
              - [Cache-Control, "max-age=1"]
          content:
            encoding: plain
            data: body

        proxy-response:
          status: 200
          content:
            encoding: plain
            data: body
            verify: {as: equal}

      - client-request:
          delay: 2s
          method: GET
          url: /negative-revalidation
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, negative-revalidation]

        server-response:
          status: 503
          reason: Service Unavailable
          headers:
            fields:
              - [Content-Length, 0]

        proxy-response:
          status: 200
          content:
            encoding: plain
            data: body
            verify: {as: equal}

      - client-request:
          method: GET
          url: /cache-write-too-large
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, failed-cache-write]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 2097152]
              - [Cache-Control, "max-age=120"]
          content:
            encoding: plain
            size: 2097152

        proxy-response:
          status: 200
          content:
            encoding: plain
            size: 2097152

      - client-request:
          method: GET
          url: /uncacheable
          version: '1.1'
          headers:
            fields:
              - [Host, example.com]
              - [uuid, uncacheable]

        server-response:
          status: 200
          reason: OK
          headers:
            fields:
              - [Content-Length, 4]
              - [Cache-Control, no-store]
          content:
            encoding: plain
            data: body

        proxy-response:
          status: 200
          content:
            encoding: plain
            data: body
            verify: {as: equal}
