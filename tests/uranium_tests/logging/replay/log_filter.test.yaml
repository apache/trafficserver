meta:
  version: "1.0"

  blocks:
  - request_base: &request_base
      method: "GET"
      version: "1.1"
      scheme: "http"
      headers:
        fields:
        - [ Host, example.com ]
  - 200_response: &200_response
      server-response:
        status: 200
        reason: OK
        headers:
          fields:
          - [ Content-Length, 0 ]
      proxy-response:
        status: 200

urtest:
  description: "Verify access-log filters and query parameter wiping"
  dns:
    name: "log-filter-dns"
    process_config:
      default: "127.0.0.1"
  server:
    name: "log-filter-origin"
  client:
    name: "log-filter-client"
  ats:
    name: "log-filter-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "log"
      proxy.config.net.connections_throttle: 100
    remap_config:
      - from: "/"
        to: "http://localhost:{SERVER_HTTP_PORT}/"
    logging_yaml:
      logging:
        filters:
          - name: "only_localhost"
            action: "accept"
            condition: "chi MATCH 127.0.0.1"
          - name: "not_localhost"
            action: "accept"
            condition: "chi MATCH 3.3.3.3"
          - name: "queryparamescaper_cquuc"
            action: "WIPE_FIELD_VALUE"
            condition: "cquuc CASE_INSENSITIVE_CONTAIN password,secret,access_token,session_redirect,cardNumber,code,query,search-query,prefix,keywords,email,handle"
        formats:
          - name: "custom"
            format: "%<cquuc>"
        logs:
          - filename: "filter-test"
            format: "custom"
            filters: ["queryparamescaper_cquuc", "only_localhost"]
          - filename: "should-not-be-written"
            format: "custom"
            filters: ["queryparamescaper_cquuc", "not_localhost"]
    file_checks:
      - {path: "{LOG_DIR}/should-not-be-written.log", exists: false}
    log_validation:
      access_log:
        filename: "filter-test.log"
        gold_file: "gold/filter-test.gold"


sessions:
- transactions:
  - all: { headers: { fields: [[ uuid, test-1 ]]}}
    client-request:
      url: "/test-1?name=value&email=123@gmail.com"
      <<: *request_base
    <<: *200_response

  - all: { headers: { fields: [[ uuid, test-2 ]]}}
    client-request:
      url: "/test-2?email=123@gmail.com&name=password"
      <<: *request_base
    <<: *200_response

  - all: { headers: { fields: [[ uuid, test-3 ]]}}
    client-request:
      url: "/test-3?trivial=password&name1=val1&email=123@gmail.com"
      <<: *request_base
    <<: *200_response

  - all: { headers: { fields: [[ uuid, test-4 ]]}}
    client-request:
      url: "/test-4?trivial=password&email=&name=handle&session_redirect=wiped_string"
      <<: *request_base
    <<: *200_response

  - all: { headers: { fields: [[ uuid, test-5 ]]}}
    client-request:
      url: "/test-5?trivial=password&email=123@gmail.com&email=456@gmail.com&session_redirect=wiped_string&email=789@gmail.com&name=value"
      <<: *request_base
    <<: *200_response
