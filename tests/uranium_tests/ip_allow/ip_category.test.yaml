# Assume everything is allowed by default.

meta:
  version: "1.0"

  blocks:
  - standard_response: &standard_response
      server-response:
        status: 200
        reason: OK
        headers:
          fields:
          - [ Content-Length, 20 ]

urtest:
  description: "Apply inbound method policy through named IP categories"
  server:
    name: origin
    replay: replays/https_categories_server.replay.yaml
  client:
    name: client
  ats:
    name: ts
    process_config:
      enable_tls: true
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http|ip_allow
      proxy.config.cache.ip_categories.filename: "{CONFIG_DIR}/categories.yaml"
      proxy.config.http.push_method_enabled: 1
      proxy.config.ssl.client.verify.server.policy: PERMISSIVE
      proxy.config.http.connect_ports: "{SERVER_HTTP_PORT}"
      proxy.config.url_remap.acl_behavior_policy: 1
    ip_allow_yaml: &ip-allow
      ip_allow:
        - apply: in
          ip_categories: ACME_INTERNAL
          action: set_allow
          methods: [GET, HEAD, POST, PUSH]
        - apply: in
          ip_categories: ACME_EXTERNAL
          action: set_allow
          methods: [GET, HEAD]
        - apply: in
          ip_categories: ACME_ALL
          action: set_allow
          methods: [HEAD]
        - apply: in
          ip_categories: ALL
          action: set_deny
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}"

  variants:
    - name: internal-and-external
      ats:
        inline_config_files:
          categories.yaml: |
            ip_categories:
              - name: ACME_INTERNAL
                ip_addrs: 127.0.0.1
              - name: ACME_EXTERNAL
                ip_addrs: 127.0.0.1
              - name: ACME_ALL
                ip_addrs: 127.0.0.1
              - name: ALL
                ip_addrs: 127.0.0.1

    - name: external
      client:
        replay: replays/https_categories_external.replay.yaml
      ats:
        inline_config_files: &external-categories
          categories.yaml: |
            ip_categories:
              - name: ACME_INTERNAL
                ip_addrs: 1.2.3.4
              - name: ACME_REMAP_EXTERNAL
                ip_addrs: 127.0.0.1
              - name: ACME_EXTERNAL
                ip_addrs: 127.0.0.1
              - name: ACME_ALL
                ip_addrs: [1.2.3.4, 127.0.0.1]
              - name: ALL
                ip_addrs: [1.2.3.4, 127.0.0.1]

    - name: denied-before-http
      client:
        replay: replays/https_categories_all.replay.yaml
        return_code: 1
        process_config:
          allow_errors: true
      ats:
        inline_config_files:
          categories.yaml: |
            ip_categories:
              - name: ACME_INTERNAL
                ip_addrs: 1.2.3.4
              - name: ACME_EXTERNAL
                ip_addrs: 1.2.3.4
              - name: ACME_ALL
                ip_addrs: 1.2.3.4
              - name: ALL
                ip_addrs: [1.2.3.4, 127.0.0.1]
        log_validation:
          diags_log:
            contains:
              - expression: "client '127.0.0.1' prohibited by ip-allow policy"

    - name: remap-denies-external-get
      client:
        replay: replays/https_categories_external_remap.replay.yaml
      ats:
        inline_config_files: *external-categories
        remap_config:
          - >-
            map / http://127.0.0.1:{SERVER_HTTP_PORT}
            @action=set_deny @src_ip_category=ACME_REMAP_EXTERNAL @method=GET

sessions:
- protocol:
    stack: https
    tls:
      sni: test_sni
  transactions:

  # GET allowed
  - client-request:
      method: "GET"
      version: "1.1"
      url: /test/ip_allow/test_get
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ uuid, get ]
        - [ X-Request, get ]

    <<: *standard_response

    proxy-response:
      status: 200

  # POST allowed
  - client-request:
      method: "POST"
      version: "1.1"
      url: /test/ip_allow/test_post
      headers:
        fields:
        - [Content-Length, 10]
        - [ uuid, post ]
        - [ X-Request, post ]

    <<: *standard_response

    proxy-response:
      status: 200

  # PUSH allowed
  - client-request:
      method: "PUSH"
      version: "1.1"
      url: /test/ip_allow/test_push
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, push ]
        - [ X-Request, push ]
        - [ Content-Length, 113 ]
      content:
        encoding: plain
        data: "HTTP/1.1 200 OK\nServer: ATS/10.0.0\nAccept-Ranges: bytes\nContent-Length: 6\nCache-Control: public,max-age=2\n\nCACHED"

    <<: *standard_response

    # Cacching is off, but a 400 still indicates that ATS processed it.
    proxy-response:
      status: 400

  # DELETE is not allowed even for internal.
  - client-request:
      method: "DELETE"
      version: "1.1"
      url: /test/ip_allow/test_delete
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ uuid, delete ]
        - [ X-Request, delete ]

    <<: *standard_response

    proxy-response:
      status: 403
