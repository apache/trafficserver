# The replay file executes various HTTP requests to verify the ip_allow policy
# applies by default to all methods.

meta:
  version: "1.0"

  blocks:
  - standard_response: &standard_response
      server-response:
        status: 200
        reason: OK
        headers:
          fields:
          - [ Content-Length, 20 ]

urtest:
  description: "Verify ip_allow across HTTP methods, Proxy Protocol, and HTTP/3"
  server:
    name: origin
  client:
    name: client
  ats:
    name: ts
    process_config:
      enable_tls: true
      enable_cache: true
      enable_proxy_protocol: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: v_quic|quic|http|ip_allow|proxyprotocol
      proxy.config.http.push_method_enabled: 1
      proxy.config.ssl.client.verify.server.policy: PERMISSIVE
      proxy.config.http.connect_ports: "{SERVER_HTTP_PORT}"
      proxy.config.acl.subjects: PROXY,PEER
    remap_config:
      - "map / http://127.0.0.1:{SERVER_HTTP_PORT}"

  variants:
    - name: methods-unspecified
      ats:
        ip_allow_yaml:
          ip_allow:
            - apply: in
              ip_addrs: 0/0
              action: allow

    - name: proxy-protocol-source
      replay: replays/http_proxy_protocol.replay.yaml
      client:
        process_config:
          http_ports: ["{ATS_PROXY_PROTOCOL_PORT}"]
          https_ports: []
      ats:
        ip_allow_yaml:
          ip_allow:
            - apply: in
              ip_addrs: 1.2.3.4
              action: allow
            - apply: in
              ip_addrs: 0/0
              action: deny

    - name: h3-allow
      replay: replays/h3.replay.yaml
      requires:
        ats_features: [TS_USE_QUIC]
        curl_features: [http3]
      ats:
        process_config:
          enable_quic: true
        records_config:
          proxy.config.quic.no_activity_timeout_in: 0
        ip_allow_yaml: &allow-all
          ip_allow:
            - apply: in
              ip_addrs: 0/0
              action: allow
              methods: ALL

    - name: h3-deny
      replay: replays/h3.replay.yaml
      requires:
        ats_features: [TS_USE_QUIC]
        curl_features: [http3]
      client:
        return_code: 1
        process_config:
          allow_errors: true
      ats:
        process_config:
          enable_quic: true
        records_config:
          proxy.config.quic.no_activity_timeout_in: 0
        ip_allow_yaml:
          ip_allow:
            - apply: in
              ip_addrs: 0/0
              action: deny
              methods: ALL
        log_validation:
          diags_log:
            contains:
              - expression: "client.*prohibited by ip-allow policy"

sessions:
- protocol:
    stack: https
    tls:
      sni: test_sni
  transactions:

  # GET
  - client-request:
      method: "GET"
      version: "1.1"
      url: /test/ip_allow/test_get
      headers:
        fields:
        - [ Content-Length, 0 ]
        - [ uuid, 1 ]

    <<: *standard_response

    proxy-response:
      status: 200

  # PUSH
  - client-request:
      method: "PUSH"
      version: "1.1"
      url: /test/ip_allow/test_put
      headers:
        fields:
        - [ Host, example.com ]
        - [ uuid, push ]
        - [ X-Request, push ]
        - [ Content-Length, 113 ]
      content:
        encoding: plain
        data: "HTTP/1.1 200 OK\nServer: ATS/10.0.0\nAccept-Ranges: bytes\nContent-Length: 6\nCache-Control: public,max-age=2\n\nCACHED"

    # Doesn't matter as the server should not get the request.
    <<: *standard_response

    # Verify that ATS confirmed that the PUSH was successful, which it does
    # with a 201 response.
    proxy-response:
      status: 201

  # POST
  - client-request:
      method: "POST"
      version: "1.1"
      url: "/test/ip_allow/test_post"
      headers:
        fields:
          - [Host, www.tls.com]
          - [Content-Length, 10]
          - [uuid, post]

    <<: *standard_response

    proxy-response:
      status: 200

  transactions:
  # CONNECT
  - client-request:
      method: CONNECT
      version: "1.1"
      url: www.example.com:80
      headers:
        fields:
          - [uuid, connect]
          - [Host, www.example.com:80]
    # This is a CONNECT request so it should not reach the origin server
    <<: *standard_response

    # ATS returns a 200 responses to client when it establishes a tunnel
    # between the client and server
    proxy-response:
      status: 200
