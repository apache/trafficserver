meta:
  version: "1.0"

sessions:
- protocol:
    stack: http
  transactions:
  - client-request:
      method: "GET"
      version: "1.1"
      url: /a/path/resource
      headers:
        fields:
        - [ Host, oof.com ]
        - [ Connection, keep-alive ]
        - [ Content-Length, 0 ]

    server-response:
      status: 307
      headers:
        fields:
          - [ location, /a/new/path/resource ]
          - [ content-length, 0 ]

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /a/new/path/resource
      headers:
        fields:
        - [ Host, oof.com ]
        - [ Connection, keep-alive ]
        - [ Content-Length, 0 ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
          - [ content-length, 16 ]
          - [ cache-control, "public,max-age=3600"]

    proxy-response:
      status: 200

  - client-request:
      # wait for cache I/O
      delay: 100ms
      method: "GET"
      version: "1.1"
      url: /a/path/resource
      headers:
        fields:
        - [ Host, oof.com ]
        - [ Connection, keep-alive ]
        - [ Content-Length, 0 ]
        - [ x-debug, x-cache ]

    proxy-request:
      expect: absent

    # should no request to origin server
    server-response:
      status: 503

    # hitting cache is expected
    proxy-response:
      status: 200
      headers:
        fields:
        - [ x-cache, {value: "hit-fresh", as: equal } ]

urtest:
  description: Follow a same-origin redirect and cache the final response
  server:
    name: same-origin-redirect-origin
    process_config:
      other_args: '--format {url}'
  dns: {name: same-origin-redirect-dns, process_config: {default: 127.0.0.1}}
  client:
    name: same-origin-redirect-client
    process_config:
      keys: /a/path/resource
      other_args: '--format {url}'
  ats:
    name: same-origin-redirect-ts
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: cache|dns|http|redirect|remap
      proxy.config.http.redirect.actions: self:follow
      proxy.config.http.number_of_redirections: 1
    plugin_config:
    - xdebug.so --enable=x-cache,x-cache-key,via
    remap_config:
    - map http://oof.com http://oof.backend.com:{SERVER_HTTP_PORT}
