meta:
  version: '1.0'

sessions:
- transactions:
  - all: {headers: {fields: [[uuid, one]]}}
    client-request: &request
      method: GET
      version: '1.1'
      url: /one
      headers:
        fields:
        - [Host, www.example.com]
        - [Connection, close]
    proxy-request:
      <<: *request
    server-response: &response
      status: 200
      reason: OK
      headers:
        fields:
        - [Server, verifier-server]
        - [Content-Length, 0]
    proxy-response: {status: 200}
- transactions:
  - all: {headers: {fields: [[uuid, two]]}}
    client-request:
      <<: *request
      url: /two
    proxy-request:
      <<: *request
      url: /two
    server-response:
      <<: *response
    proxy-response: {status: 200}
- transactions:
  - all: {headers: {fields: [[uuid, three]]}}
    client-request:
      <<: *request
      url: /three
    proxy-request:
      <<: *request
      url: /three
    server-response:
      <<: *response
      headers:
        fields:
        - [Server, verifier-server]
        - [Connection, close]
        - [Content-Length, 0]
    proxy-response: {status: 200}

urtest:
  description: Select server-session sharing by host and IP
  server: {name: session-sharing-origin}
  client: {name: session-sharing-client}
  ats:
    name: session-sharing-ts
    process_config: {enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: http
      proxy.config.http.auth_server_session_private: 1
      proxy.config.http.server_session_sharing.pool: global
      proxy.config.url_remap.pristine_host_hdr: 1
    remap_config:
    - map / http://127.0.0.1:{SERVER_HTTP_PORT}
  variants:
  - name: host
    ats:
      records_config:
        proxy.config.http.server_session_sharing.match: host
      log_validation:
        traffic_out:
          contains:
          - {expression: global pool search successful}
  - name: ip
    ats:
      records_config:
        proxy.config.http.server_session_sharing.match: ip
      log_validation:
        traffic_out:
          contains:
          - {expression: global pool search successful}
  - name: both
    ats:
      records_config:
        proxy.config.http.server_session_sharing.match: both
      log_validation:
        traffic_out:
          contains:
          - {expression: global pool search successful}
  - name: none
    ats:
      records_config:
        proxy.config.http.server_session_sharing.match: none
      log_validation:
        traffic_out:
          excludes:
          - {expression: global pool search successful}
