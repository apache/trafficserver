meta:
  version: "1.0"

# Configuration for the Uranium test runner
urtest:
  description: 'Verify the errno of an immediate connect failure is reported on both the shared and the private session path'

  dns:
    name: 'dns-bind-fail'
    records: {"backend-shared.example.com": ["127.0.0.1"], "backend-private.example.com": ["127.0.0.1"]}

  server:
    name: 'server-bind-fail'

  client:
    name: 'client-bind-fail'

  ats:
    name: 'ts-bind-fail'
    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: 'http_ss|http_ss_auth'
      # A non-local source address (RFC 5737) makes the connect fail synchronously: bind() fails with EADDRNOTAVAIL, or,
      # where non-local binds are allowed, connect() fails with ENETUNREACH.
      proxy.config.outgoing_ip_to_bind: '192.0.2.1'
      proxy.config.http.connect_attempts_max_retries: 0

    remap_config:
      - from: "http://shared.example.com/"
        to: "http://backend-shared.example.com:{SERVER_HTTP_PORT}/"
      - from: "http://private.example.com/"
        to: "http://backend-private.example.com:{SERVER_HTTP_PORT}/"

    log_validation:
      traffic_out:
        contains:
          - expression: "Queue multiplexed request"
            description: "the shared request connects through ConnectingEntry"
          - expression: "Setting server session to private for authorization headers"
            description: "the Authorization request connects directly from HttpSM"
      error_log:
        contains:
          - expression: "CONNECT: attempt fail .* for host='shared.example.com' .* connection_result=E[A-Z]+ .* error=E[A-Z]+"
            description: "the shared path reports the connect errno"
          - expression: "CONNECT: attempt fail .* for host='private.example.com' .* connection_result=E[A-Z]+ .* error=E[A-Z]+"
            description: "the private path reports the connect errno"
        excludes:
          - expression: "connection_result=EIO"
            description: "connect() errno must be reported, not the EIO placeholder"
          - expression: "error=SUCCESS"
            description: "connect() errno must be reported as the cause of death"

sessions:
- transactions:
  - client-request:
      method: GET
      url: /path/
      version: '1.1'
      headers:
        fields:
        - [Host, shared.example.com]
        - [uuid, 1]

    server-response:
      status: 200

    proxy-response:
      status: 502

  - client-request:
      method: GET
      url: /path/
      version: '1.1'
      headers:
        fields:
        - [Host, private.example.com]
        - [Authorization, Basic dXNlcjpwYXNz]
        - [uuid, 2]

    server-response:
      status: 200

    proxy-response:
      status: 502
