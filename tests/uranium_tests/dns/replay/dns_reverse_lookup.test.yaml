meta:
  version: "1.0"

urtest:
  description: "Verify reverse DNS lookup does not poison a hostdb record"
  server:
    name: "reverse-lookup-origin"
  client:
    name: "reverse-lookup-client"
  ats:
    name: "reverse-lookup-ts"
    process_config:
      enable_cache: false
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "hostdb|dns|http"
      proxy.config.http.connect_attempts_max_retries: 0
      proxy.config.http.connect_attempts_rr_retries: 0
      proxy.config.hostdb.fail.timeout: 10
      proxy.config.dns.resolv_conf: "NULL"
      proxy.config.hostdb.ttl_mode: 1
      proxy.config.hostdb.timeout: 2
      proxy.config.hostdb.lookup_timeout: 2
      proxy.config.http.transaction_no_activity_timeout_in: 2
      proxy.config.http.connect_attempts_timeout: 2
      proxy.config.hostdb.host_file.interval: 1
      proxy.config.hostdb.host_file.path: "{CONFIG_DIR}/hosts_file"
    copy_to_config_dir:
      - "hosts_file"
    remap_config:
      - from: "/test1"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
      - from: "/test2"
        to: "http://localhost:{SERVER_HTTP_PORT}/"
    parent_config:
      - "dest_domain=. parent=parent_host:{ATS_HTTP_PORT} round_robin=consistent_hash go_direct=false"
      - 'dest_host=other_host scheme=http parent="parent_host:8080"'


sessions:
- transactions:
  - client-request:
      # Delay to allow hostdb to sync external host file
      delay: 1s
      method: "GET"
      version: "1.1"
      url: /test1
      headers:
        fields:
        - [ Host, example.com ]
        - [ X-Request, request ]
        - [ uuid, 1 ]

    server-response:
      status: 200

    proxy-response:
      status: 200

  - client-request:
      method: "GET"
      version: "1.1"
      url: /test2
      headers:
        fields:
        - [ Host, example.com ]
        - [ X-Request, request ]
        - [ uuid, 1 ]

    server-response:
      status: 200

    proxy-response:
      status: 200
