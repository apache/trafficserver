meta:
  version: "1.0"

sessions:
- transactions:
  - client-request:
      # Delay to allow hostdb to sync external host file
      delay: 2s
      method: "GET"
      version: "1.1"
      url: /dns/mark/down
      headers:
        fields:
        - [ Host, example.com ]
        - [ X-Request, request ]
        - [ uuid, 1 ]

    # Shouldn't be reached since server IP is unreachable
    server-response:
      status: 200

    # Returns 502 since server connection is unreachable
    # This transaction should mark the IP as down
    proxy-response:
      status: 502

  - client-request:
      # Delay to allow hostdb to sync external host file
      delay: 2s
      method: "GET"
      version: "1.1"
      url: /dns/unreachable
      headers:
        fields:
        - [ Host, example.com ]
        - [ X-Request, request ]
        - [ uuid, 2 ]

    # Shouldn't be reached since server IP is unreachable
    server-response:
      status: 200

    # After host has been marked down from previous test, HostDB should not return
    # the host as available and HostDB lookup should fail.
    proxy-response:
      status: 500

urtest:
  description: Handle a cached hostname whose origin has been marked down
  server: {name: dns-host-down-origin}
  client: {name: dns-host-down-client}
  ats:
    name: dns-host-down-ts
    process_config: {enable_cache: false}
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: hostdb|dns|http|socket
      proxy.config.http.connect_attempts_max_retries: 0
      proxy.config.http.connect_attempts_rr_retries: 0
      proxy.config.hostdb.fail.timeout: 10
      proxy.config.dns.resolv_conf: 'NULL'
      proxy.config.hostdb.ttl_mode: 1
      proxy.config.hostdb.timeout: 2
      proxy.config.hostdb.lookup_timeout: 2
      proxy.config.http.transaction_no_activity_timeout_in: 2
      proxy.config.http.connect_attempts_timeout: 2
      proxy.config.hostdb.host_file.interval: 1
      proxy.config.hostdb.host_file.path: '{CONFIG_DIR}/hosts_file'
    copy_to_config_dir: [hosts_file]
    remap_config:
    - map / http://resolve.this.com:{SERVER_HTTP_PORT}/
    metric_checks:
    - metric: proxy.process.http.down_server.no_requests
      value: '2'
      delay: 2
    file_checks:
    - path: '{LOG_DIR}/error.log'
      contains: "/dns/mark/down' fail_count='1' marking down"
      timeout: 10
