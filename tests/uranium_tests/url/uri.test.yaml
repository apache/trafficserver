urtest:
  description: "Verify URI parsing and encoded cache-key behavior"
  replay: "uri.replay.yaml"
  server:
    name: "uri-origin"
  client:
    name: "uri-client"
  ats:
    name: "uri-ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|cache|url"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}/"
