meta:
  version: '1.0'

autest:
  description: 'Verify anchor_policy_rules=1 requires a gate pattern to match the whole subject'

  # Distinct process names: both replays run in one sandbox, so reusing the
  # default names collides when the second run stages its own binaries.
  dns:
    name: 'dns-enforcing'

  server:
    name: 'server-enforcing'

  client:
    name: 'client-enforcing'

  ats:
    name: 'ts-enforcing'

    process_config:
      enable_cache: false

    records_config:
      proxy.config.diags.debug.enabled: 0
      proxy.config.url_remap.remap_required: 1
      # Without this the referer filter never runs and the rule is not exercised.
      proxy.config.http.referer_filter: 1
      proxy.config.regex.anchor_policy_rules: 1

    remap_config:
      # Unanchored: under enforcement this no longer matches a Referer that merely
      # contains the value, so the rule becomes inert and requests are redirected.
      - 'map_with_referer http://gated.example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/ http://denied.example.com/ trusted\.example\.com'
      # Rewritten the way the migration guidance prescribes: ".*" at each end that was
      # not anchored, which keeps the substring intent. So this rule works unchanged.
      - 'map_with_referer http://contains.example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/ http://denied.example.com/ ^.*trusted\.example\.com.*$'
      # The same negative rule as the default-state replay. Under enforcement it stops
      # matching a Referer that merely contains the value, so the restriction it expressed
      # no longer applies and the request is forwarded. This is the permissive direction,
      # and the reason the migration guidance says to rewrite before enabling.
      - 'map_with_referer http://guarded.example.com/ http://127.0.0.1:{SERVER_HTTP_PORT}/ http://denied.example.com/ ~restricted\.example\.com *'

    log_validation:
      diags_log:
        contains:
        # Enforcing names each pattern the policy had to anchor, so a rule added after
        # the migration is visible rather than silently inert.
        - expression: 'NOTE: \[regex-anchor\] map_with_referer referer pattern .*restricted'
          description: 'A pattern the policy anchored is recorded at NOTE severity'
        excludes:
        # Enforcing makes the pattern safe, so nothing is wrong and nothing warns.
        - expression: 'WARNING: \[regex-anchor\]'
          description: 'No warnings once the policy is enforcing'
        # Already anchored in the pattern, so the policy changed nothing for it.
        - expression: "\\[regex-anchor\\] map_with_referer referer pattern '\\^\\.\\*trusted"
          description: 'An already-anchored rule is not reported in either state'
        - expression: 'WARNING: \[regex-anchor\]'
          description: 'No warnings once the policy is enforcing'

sessions:
- transactions:

  # Same request that was forwarded with the setting off. Enforcement requires the
  # pattern to span the whole Referer value, which it does not, so the rule does
  # not apply and the referer filter redirects instead of forwarding.
  - client-request:
      method: GET
      url: /path/test.html
      version: '1.1'
      headers:
        fields:
        - [Host, gated.example.com]
        - [Referer, 'https://other.example.com/trusted.example.com']
        - [uuid, substring-referer-no-longer-matches]

    proxy-request:
      expect: absent

    proxy-response:
      status: 302

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]

  # The rewritten rule states substring intent in the pattern and is compiled for a
  # whole-subject match, so enforcement leaves it alone and the request is still
  # forwarded. This is the migration path an operator takes for a rule the warning
  # names.
  - client-request:
      method: GET
      url: /path/test.html
      version: '1.1'
      headers:
        fields:
        - [Host, contains.example.com]
        - [Referer, 'https://other.example.com/trusted.example.com']
        - [uuid, explicit-substring-pattern-still-matches]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
        - [X-Origin-Marker, served-by-origin]

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Origin-Marker, {value: served-by-origin, as: equal}]

  # An exactly-matching Referer works under enforcement too: the whole value is
  # the configured host, so the pattern spans it.
  - client-request:
      method: GET
      url: /path/test.html
      version: '1.1'
      headers:
        fields:
        - [Host, gated.example.com]
        - [Referer, 'trusted.example.com']
        - [uuid, whole-subject-referer-matches]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
        - [X-Origin-Marker, served-by-origin]

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Origin-Marker, {value: served-by-origin, as: equal}]

  # The same request the default-state replay has redirected by the negative rule. The
  # unanchored pattern no longer matches a Referer that only contains the value, so the
  # restriction stops applying and the request reaches the origin. Enforcement can widen
  # what is allowed, not only narrow it.
  - client-request:
      method: GET
      url: /path/test.html
      version: '1.1'
      headers:
        fields:
        - [Host, guarded.example.com]
        - [Referer, 'https://other.example.com/restricted.example.com']
        - [uuid, negative-referer-no-longer-restricts]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [Content-Length, 0]
        - [X-Origin-Marker, served-by-origin]

    proxy-response:
      status: 200
      headers:
        fields:
        - [X-Origin-Marker, {value: served-by-origin, as: equal}]
