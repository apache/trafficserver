meta: {version: "1.0"}

urtest:
  description: "Verify regex_map substitutions in both remap formats"
  dns:
    name: "dns"
    process_config: {default: "127.0.0.1"}
  server: {name: "origin"}
  client: {name: "client"}
  ats:
    name: "ts"
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http|dns"
      proxy.config.http.referer_filter: 1
  variants:
    - name: "classic"
      ats:
        remap_config:
          - 'regex_map http://(.*)?one\.two\.three\.com/ http://$1reactivate.four.five.six.com:{SERVER_HTTP_PORT}/'
          - 'regex_map https://\b(?!(.*one|two|three|four|five|six)).+\b\.seven\.eight\.nine\.com/blah12345.html https://www.example.com:{SERVER_HTTP_PORT}/one/two/three/blah12345.html'
    - name: "yaml"
      ats:
        remap_yaml_lines:
          - "remap:"
          - "  - type: regex_map"
          - "    from:"
          - '      url: http://(.*)?one\.two\.three\.com/'
          - "    to:"
          - '      url: http://$1reactivate.four.five.six.com:{SERVER_HTTP_PORT}/'
          - "  - type: regex_map"
          - "    from:"
          - '      url: https://\b(?!(.*one|two|three|four|five|six)).+\b\.seven\.eight\.nine\.com/blah12345.html'
          - "    to:"
          - "      url: https://www.example.com:{SERVER_HTTP_PORT}/one/two/three/blah12345.html"

sessions:
  - transactions:
      - all: {headers: {fields: [[uuid, regex-map]]}}
        client-request:
          method: GET
          url: /
          version: "1.1"
          headers: {fields: [[Host, zero.one.two.three.com]]}
        proxy-request:
          method: GET
          url: /
          headers:
            fields:
              - [Host, {value: 'zero.reactivate.four.five.six.com', as: prefix}]
        server-response:
          status: 200
          headers: {fields: [[Content-Length, 0]]}
        proxy-response: {status: 200}
