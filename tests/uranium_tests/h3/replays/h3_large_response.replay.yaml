meta:
  version: "1.0"

sessions:
- protocol:
    stack: http3
    tls:
      sni: example.com

  transactions:
  - client-request:
      version: "3"
      headers:
        fields:
        - [ ":method", GET ]
        - [ ":scheme", https ]
        - [ ":authority", example.com ]
        - [ ":path", /h3-large-response ]
        - [ uuid, h3-large-response ]

    server-response:
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, application/octet-stream ]
        - [ Content-Length, "1048576" ]
      content:
        size: 1048576

    proxy-response:
      status: 200
      headers:
        fields:
        - [ Content-Length, { value: "1048576", as: equal } ]
      content:
        size: 1048576
