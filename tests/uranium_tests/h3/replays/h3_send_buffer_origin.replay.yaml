# The origin for the aioquic send buffer checks. Each request carries its case
# name in a uuid header, which picks its response here.

meta:
  version: "1.0"

  blocks:
  - request_base: &request_base
      version: "1.1"
      method: GET
      url: /send-buffer
  - generated_1m_response: &generated_1m_response
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, application/octet-stream ]
        - [ Content-Length, "1048576" ]
      content:
        size: 1048576
  - generated_512k_response: &generated_512k_response
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, application/octet-stream ]
        - [ Content-Length, "524288" ]
      content:
        size: 524288
  - generated_100_response: &generated_100_response
      status: 200
      reason: OK
      headers:
        fields:
        - [ Content-Type, application/octet-stream ]
        - [ Content-Length, "100" ]
      content:
        size: 100

sessions:
- transactions:
  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-window-16384 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-window-16384-second ]

    server-response:
      <<: *generated_100_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-window-10000 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-window-10000-second ]

    server-response:
      <<: *generated_100_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-0 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-1 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-2 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-3 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-4 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-5 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-6 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-concurrent-7 ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-stop-sending ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-stop-sending-second ]

    server-response:
      <<: *generated_1m_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-unacknowledged-0 ]

    server-response:
      <<: *generated_512k_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-unacknowledged-1 ]

    server-response:
      <<: *generated_512k_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-unacknowledged-2 ]

    server-response:
      <<: *generated_512k_response

  - client-request:
      <<: *request_base
      headers:
