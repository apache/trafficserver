  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-unacknowledged-8 ]

    server-response:
      <<: *generated_512k_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-unacknowledged-9 ]

    server-response:
      <<: *generated_512k_response

  - client-request:
      <<: *request_base
      headers:
        fields:
        - [ uuid, send-buffer-unacknowledged-10 ]

