urtest:
  description: "Verify HTTP/3 SNI checking"
  replay: "replays/h3_sni.replay.yaml"
  requires:
    ats_features: ["TS_USE_QUIC"]
  server:
    name: "h3-sni-origin"
  client:
    name: "h3-sni-client"
    process_config:
      http_ports: []
      https_ports: []
  ats:
    name: "h3-sni-ts"
    process_config:
      enable_tls: true
      enable_quic: true
    records_config:
      proxy.config.diags.debug.enabled: 1
      proxy.config.diags.debug.tags: "http"
      proxy.config.quic.no_activity_timeout_in: 0
      proxy.config.ssl.client.verify.server.policy: "PERMISSIVE"
    remap_config:
      - from: "/"
        to: "http://127.0.0.1:{SERVER_HTTP_PORT}"
  variants:
    - name: "with-sni"
      client:
        process_config:
          keys: ["has_sni"]
      ats:
        log_validation:
          traffic_out:
            excludes:
              - {expression: "SNI not found", description: "ATS must accept the supplied SNI"}
    - name: "without-sni"
      client:
        return_code: 1
        process_config:
          keys: ["no_sni"]
          allow_errors: true
      ats:
        log_validation:
          traffic_out:
            contains:
              - {expression: "SNI not found", description: "ATS must reject a connection without SNI"}
